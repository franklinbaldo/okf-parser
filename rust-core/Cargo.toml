[package]
name = "okf-core"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Native OKF CLI and compatibility adapters"

[lib]
path = "src/lib.rs"

[[bin]]
name = "okf-parser"
path = "src/main.rs"
required-features = ["full"]

[features]
default = ["full", "bundled"]
# The official product enables both capability groups. Development can compile
# the engine/CLI shell alone with --no-default-features.
full = ["sql", "mcp"]
sql = ["dep:okf-db"]
mcp = ["dep:axum", "dep:rmcp", "dep:schemars", "dep:tokio"]
# Compile DuckDB into the binary. Release wheels turn it off and link the
# official prebuilt libduckdb instead (DUCKDB_DOWNLOAD_LIB=1), shipped next
# to the executable; see build.rs and docs/releasing.md.
bundled = ["sql", "okf-db/bundled"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
clap = { version = "4", features = ["derive"] }
okf-db = { path = "../okf-db", version = "0.48.1", default-features = false, optional = true }
okf-engine = { path = "../okf-engine", version = "0.48.1" }
rmcp = { version = "3.4", features = ["server", "transport-io", "macros", "transport-streamable-http-server"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "process", "net"], optional = true }
