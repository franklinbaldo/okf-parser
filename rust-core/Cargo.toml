[package]
name = "okf-core"
version = "0.42.7"
edition = "2024"
license = "MIT"
description = "Native OKF CLI and compatibility adapters"

[[bin]]
name = "okf-parser"
path = "src/main.rs"

[features]
default = []
# The private __engine-duckdb subcommand, off by default. The published
# okf-parser DuckDB export runs in Python against the `duckdb` distribution
# this package already depends on, so shipping a second DuckDB inside this
# executable only duplicated it -- and dragged a C++ amalgamation build, or
# a dynamic library needing per-platform loader work, into every wheel.
duckdb-export = ["dep:duckdb"]

[dependencies]
clap = { version = "4", features = ["derive"] }
duckdb = { version = "1.10505.0", features = ["bundled"], optional = true }
okf-engine = { path = "../okf-engine", version = "0.39.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
