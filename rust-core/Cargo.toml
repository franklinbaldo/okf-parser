[package]
name = "okf-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Experimental batch Markdown facts core for okf-parser"

[dependencies]
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
