[package]
name = "okf-core"
version = "0.45.5"
edition = "2024"
license = "MIT"
description = "Native OKF CLI and compatibility adapters"

[[bin]]
name = "okf-parser"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
okf-engine = { path = "../okf-engine", version = "0.45.5" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
