[package]
name = "okf-db"
version.workspace = true
edition = "2024"
license = "MIT"
description = "OKF bundles as DuckDB tables: export, declared types and relational checks"

[features]
default = ["bundled"]
# Compile DuckDB, with its JSON and Parquet extensions, into the crate. Turn
# it off to link an external libduckdb (or, in a loadable extension, the host).
bundled = ["duckdb/bundled", "duckdb/json", "duckdb/parquet"]

[dependencies]
caseless = "0.2"
chrono = "0.4"
duckdb = "~1.10504.0"
globset = "0.4"
okf-engine = { path = "../okf-engine", version = "0.48.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"
unicode-ident = "1"
unicode-normalization = "0.1"
walkdir = "2"
