name: Release Dry Run

on:
  pull_request:
    paths:
      - ".github/workflows/release-dry-run.yml"
      - "changelog/**"
      - "docs/releasing.md"
      - "pyproject.toml"
      - "rfcs/0003-resumable-multi-registry-release.md"
      - "scripts/**"
      - "tests/test_release_contract.py"
      - "tests/test_registry_state.py"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/src/version.ts"
      - "typescript-duckdb/package.json"
      - "typescript-duckdb/package-lock.json"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      ref:
        description: Existing branch, commit, or stable vX.Y.Z tag to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-set:
    name: Build and verify release set
    runs-on: ubuntu-latest
    env:
      DRY_RUN_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Verify synchronized source contract
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--tag "$DRY_RUN_REF")
          fi
          python scripts/release_contract.py verify-source "${args[@]}"

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm ci --prefix typescript-duckdb

      - name: Build each artifact once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/python release/npm
          uv build --out-dir release/python
          rm -f release/python/.gitignore
          (cd typescript && npm pack --pack-destination ../release/npm --silent)
          (cd typescript-duckdb && npm pack --pack-destination ../release/npm --silent)

      - name: Generate immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_contract.py build-manifest \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --ref "$DRY_RUN_REF" \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --uv-version "$(uv --version | awk '{print $2}')"

      - name: Verify wheel and source distribution as consumers
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          wheel=$(find release/python -maxdepth 1 -type f -name '*.whl' -print -quit)
          sdist=$(find release/python -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          for artifact in "$wheel" "$sdist"; do
            label=$(basename "$artifact" | tr '.-' '__')
            environment="$RUNNER_TEMP/python-$label"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" "$artifact"
            EXPECTED_VERSION="$expected_version" "$environment/bin/python" -c 'import importlib.metadata, os; assert importlib.metadata.version("okf-parser") == os.environ["EXPECTED_VERSION"]'
            "$environment/bin/okf-parser" --help >/dev/null
            mkdir "$environment/fixture"
            printf '%s\n' '---' 'type: Node' '---' '# Node' > "$environment/fixture/node.md"
            "$environment/bin/okf-parser" check "$environment/fixture" >/dev/null
          done

      - name: Verify main npm tarball as a consumer
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/okf-parser-$expected_version.tgz"
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$parser_tarball" >/dev/null
          EXPECTED_VERSION="$expected_version" node --input-type=module -e 'import("okf-parser").then(({ capabilityManifest }) => { if (capabilityManifest.protocol_version !== process.env.EXPECTED_VERSION) process.exit(1) })'
          ./node_modules/.bin/okf-parser-ts --help >/dev/null
          mkdir format-fixture
          printf '# Heading\n\n-   item\n' > format-fixture/concept.md
          if ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null; then
            echo "installed formatter check unexpectedly succeeded before rewrite"
            exit 1
          fi
          ./node_modules/.bin/okf-parser-ts format format-fixture --write >/dev/null
          ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null
          grep -qx -- '- item' format-fixture/concept.md
          node "$GITHUB_WORKSPACE/typescript/scripts/smoke-mcp-stdio.mjs" ./node_modules/.bin/okf-parser-ts-mcp

      - name: Verify both npm tarballs together
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/okf-parser-$expected_version.tgz"
          adapter_tarball="$GITHUB_WORKSPACE/release/npm/okf-parser-duckdb-$expected_version.tgz"
          consumer="$RUNNER_TEMP/duckdb-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$parser_tarball" >/dev/null
          npm install --ignore-scripts "$adapter_tarball" >/dev/null
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          ./node_modules/.bin/okf-parser-ts-duckdb knowledge --database bundle.duckdb > report.json
          node --input-type=module -e 'import("okf-parser-duckdb").then(async ({ exportDuckDb }) => { const result = await exportDuckDb("knowledge", { database: "second.duckdb" }); if (result.concept_count !== 1) process.exit(1) })'

      - name: Re-verify exact artifact bytes
        run: python scripts/release_contract.py verify-local --manifest release/manifest.json

      - name: Inspect public registry state
        run: python -m scripts.registry_state --manifest release/manifest.json --output release/registry-state.json

      - name: Write release summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          manifest = json.loads(Path("release/manifest.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("release/registry-state.json").read_text(encoding="utf-8"))
          print(f"## Release dry run {manifest['version']}")
          print()
          print(f"Source: `{manifest['repository']}@{manifest['commit']}`")
          print()
          print("| Artifact | Bytes | SHA-256 |")
          print("|---|---:|---|")
          for artifact in manifest["artifacts"]:
              print(f"| `{artifact['path']}` | {artifact['size']} | `{artifact['sha256']}` |")
          print()
          print("## Public registry preflight")
          print()
          print("| Registry | Package | State | Package exists | Action |")
          print("|---|---|---|---|---|")
          actions = {
              (item["registry"], item["package"]): item["action"]
              for item in registry["plan"]
          }
          for entry in registry["entries"]:
              action = actions[(entry["registry"], entry["package"])]
              print(
                  f"| {entry['registry']} | `{entry['package']}` | "
                  f"`{entry['state']}` | `{entry['package_exists']}` | `{action}` |"
              )
          PY

      - name: Upload tested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
