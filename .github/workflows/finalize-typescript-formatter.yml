name: Finalize TypeScript Formatter

on:
  push:
    branches:
      - feat/typescript-formatter

permissions:
  contents: write

concurrency:
  group: finalize-typescript-formatter
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/typescript-formatter
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Refresh synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = text.replace('version = "0.10.0"', 'version = "0.11.0"', 1)
          pyproject.write_text(text, encoding="utf-8")

          version = Path("typescript/src/version.ts")
          text = version.read_text(encoding="utf-8")
          text = text.replace('"0.10.0"', '"0.11.0"', 1)
          version.write_text(text, encoding="utf-8")
          PY
          npm --prefix typescript version 0.11.0 --no-git-tag-version
          npm --prefix typescript-duckdb version 0.11.0 --no-git-tag-version
          npm --prefix typescript-duckdb pkg set 'peerDependencies.okf-parser=^0.11.0'
          uv lock
          npm install --prefix typescript --package-lock-only --ignore-scripts
          npm install --prefix typescript-duckdb --package-lock-only --ignore-scripts

      - name: Verify Python
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run vulture src --min-confidence 90
          uv run pytest
          uv run okf-parser check .
          uv build

      - name: Verify TypeScript formatter
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix typescript
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          mkdir "$RUNNER_TEMP/format-fixture"
          printf '# Heading\n\n-   item\n' > "$RUNNER_TEMP/format-fixture/concept.md"
          if node typescript/dist/cli.js format "$RUNNER_TEMP/format-fixture" >/dev/null; then
            exit 1
          fi
          node typescript/dist/cli.js format "$RUNNER_TEMP/format-fixture" --write >/dev/null
          node typescript/dist/cli.js format "$RUNNER_TEMP/format-fixture" >/dev/null
          grep -qx -- '- item' "$RUNNER_TEMP/format-fixture/concept.md"
          node typescript/scripts/smoke-mcp-stdio.mjs

      - name: Verify DuckDB sibling
        run: |
          set -euo pipefail
          npm ci --prefix typescript-duckdb
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb

      - name: Commit verified formatter
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/diagnose-typescript-formatter.yml
          rm .github/workflows/finalize-typescript-formatter.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/ci.yml \
            changelog/0.11.0.md \
            conformance/formatting.json \
            pyproject.toml \
            tests/test_formatting_conformance.py \
            typescript/README.md \
            typescript/package.json \
            typescript/package-lock.json \
            typescript/src/cli.ts \
            typescript/src/formatting.ts \
            typescript/src/index.ts \
            typescript/src/version.ts \
            typescript/test/formatting.test.ts \
            typescript-duckdb/package.json \
            typescript-duckdb/package-lock.json \
            uv.lock
          git add -u \
            .github/workflows/diagnose-typescript-formatter.yml \
            .github/workflows/finalize-typescript-formatter.yml
          git commit -m "feat(ts): add structurally guarded Markdown formatter"
          git push origin HEAD:feat/typescript-formatter
