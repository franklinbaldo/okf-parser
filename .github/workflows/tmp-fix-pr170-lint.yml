name: PR170 lint fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/import-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/import-preview-token
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - name: Extract preview freshness guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/okf_parser/bundle_import.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def _validate_options(*, overwrite: bool, on_conflict: ImportConflictPolicy) -> None:\n    if overwrite and on_conflict == "verify-identical":\n        message = "overwrite and on_conflict='verify-identical' are mutually exclusive"\n        raise BundleImportError(message)\n\n\n'''
          helper = '''def _validate_options(*, overwrite: bool, on_conflict: ImportConflictPolicy) -> None:\n    if overwrite and on_conflict == "verify-identical":\n        message = "overwrite and on_conflict='verify-identical' are mutually exclusive"\n        raise BundleImportError(message)\n\n\ndef _validate_preview_token(\n    *, write: bool, preview_token: str, expected_preview_token: str | None\n) -> None:\n    """Fail closed when a reviewed import preview no longer matches current state."""\n    if (\n        write\n        and expected_preview_token is not None\n        and not hmac.compare_digest(preview_token, expected_preview_token)\n    ):\n        message = "import preview is stale; rerun preview before committing"\n        raise BundleImportError(message)\n\n\n'''
          old = '''    if (\n        write\n        and expected_preview_token is not None\n        and not hmac.compare_digest(preview_token, expected_preview_token)\n    ):\n        raise BundleImportError("import preview is stale; rerun preview before committing")\n'''
          new = '''    _validate_preview_token(\n        write=write,\n        preview_token=preview_token,\n        expected_preview_token=expected_preview_token,\n    )\n'''
          if anchor not in text or old not in text:
              raise SystemExit('expected PR #170 source shape not found')
          text = text.replace(anchor, helper, 1).replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff format src/okf_parser/bundle_import.py
          uv run ruff check src/okf_parser/bundle_import.py
          git diff --check
      - name: Commit lint refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/okf_parser/bundle_import.py
          git diff --cached --quiet && exit 0
          git commit -m "refactor(import): isolate preview freshness guard"
          git push origin HEAD:feat/import-preview-token
