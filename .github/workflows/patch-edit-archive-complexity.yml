name: Patch archived edit orchestrator complexity

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'feat/single-concept-edit-0.24.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: archive/single-concept-edit-0.24.0
          fetch-depth: 0
      - name: Move compatibility details out of orchestrators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/okf_parser/apply.py',
              '''from okf_parser.write_support import (\n    ConceptSnapshot as _Concept,\n''',
              '''from okf_parser.write_support import (\n    BundleSnapshot as _BundleSnapshot,\n    ConceptSnapshot as _Concept,\n''',
          )
          helper = '''\n\ndef _snapshot_for_apply(root: Path, exclude: Sequence[str]) -> _BundleSnapshot:\n    """Capture apply's coherent snapshot while preserving its public conflict wording."""\n    try:\n        return _snapshot_bundle(root, exclude)\n    except WriteSupportError as exc:\n        message = str(exc).replace(\n            "file changed while it was being read",\n            "file changed while apply was reading it",\n        )\n        raise ApplyError(message) from exc\n'''
          replace_once(
              'src/okf_parser/apply.py',
              '\n\ndef apply_bundle(  # each argument is an independent public CLI flag.\n',
              helper + '\n\ndef apply_bundle(  # each argument is an independent public CLI flag.\n',
          )
          replace_once(
              'src/okf_parser/apply.py',
              '''        try:\n            snapshot = _snapshot_bundle(root, exclude)\n        except WriteSupportError as exc:\n            message = str(exc).replace(\n                "file changed while it was being read",\n                "file changed while apply was reading it",\n            )\n            raise ApplyError(message) from exc\n        concepts = snapshot.concepts\n''',
              '''        snapshot = _snapshot_for_apply(root, exclude)\n        concepts = snapshot.concepts\n''',
          )

          outcome_helper = '''\n\ndef _decode_write_outcome(\n    payload: dict[str, object],\n) -> tuple[bool, bool, tuple[dict[str, object], ...], tuple[str, ...], str | None]:\n    """Narrow the generic shared-write payload at the edit boundary."""\n    validation_value = payload.get("validation", ())\n    validation = (\n        cast("tuple[dict[str, object], ...]", tuple(validation_value))\n        if isinstance(validation_value, (list, tuple))\n        else ()\n    )\n    conflict_value = payload.get("conflict_paths", ())\n    conflict_paths = (\n        tuple(item for item in conflict_value if isinstance(item, str))\n        if isinstance(conflict_value, (list, tuple))\n        else ()\n    )\n    error_value = payload.get("error")\n    error = error_value if isinstance(error_value, str) else None\n    return (\n        bool(payload.get("succeeded", False)),\n        bool(payload.get("written", False)),\n        validation,\n        conflict_paths,\n        error,\n    )\n'''
          replace_once(
              'src/okf_parser/edit.py',
              '\n\ndef _edit_concept(\n',
              outcome_helper + '\n\ndef _edit_concept(\n',
          )
          replace_once(
              'src/okf_parser/edit.py',
              '''    succeeded = bool(write_result.get("succeeded", False))\n    written = bool(write_result.get("written", False))\n    validation_value = write_result.get("validation", ())\n    validation = (\n        cast("tuple[dict[str, object], ...]", tuple(validation_value))\n        if isinstance(validation_value, (list, tuple))\n        else ()\n    )\n    conflict_value = write_result.get("conflict_paths", ())\n    conflict_paths = (\n        tuple(item for item in conflict_value if isinstance(item, str))\n        if isinstance(conflict_value, (list, tuple))\n        else ()\n    )\n    error_value = write_result.get("error")\n    error = error_value if isinstance(error_value, str) else None\n''',
              '''    succeeded, written, validation, conflict_paths, error = _decode_write_outcome(\n        write_result\n    )\n''',
          )
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/okf_parser/apply.py src/okf_parser/edit.py
          git commit -m 'refactor(write): keep orchestration complexity bounded'
          git push origin HEAD:archive/single-concept-edit-0.24.0
