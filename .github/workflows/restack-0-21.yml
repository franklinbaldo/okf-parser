name: Restack 0.21.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  restack:
    if: github.head_ref == 'feat/public-typed-relations-0.21.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/public-typed-relations-0.21.0
          fetch-depth: 0
      - name: Attempt merge from main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge origin/main --no-edit; then
            echo 'UNMERGED FILES:'
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Validate restacked tree
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run pytest
          uv run python scripts/release_contract.py verify-source --root .
          npm ci --prefix typescript
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
      - name: Publish restack
        run: |
          set -euo pipefail
          rm .github/workflows/restack-0-21.yml
          git add -A
          git commit --amend --no-edit
          git push origin HEAD:feat/public-typed-relations-0.21.0
