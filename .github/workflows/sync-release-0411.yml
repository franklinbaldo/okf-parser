name: Sync 0.41.1 release metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-release-0411.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Synchronize version surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              "pyproject.toml",
              "native-python-stub/pyproject.toml",
              "rust-core/pyproject.toml",
              "rust-core/Cargo.toml",
              "Cargo.lock",
              "typescript/package.json",
              "typescript/package-lock.json",
              "typescript/src/version.ts",
              "typescript-duckdb/package.json",
              "typescript-duckdb/package-lock.json",
              "native-npm-linux-x64/package.json",
              "uv.lock",
              "README.md",
          ]
          for name in paths:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "0.41.0" not in text:
                  raise SystemExit(f"expected 0.41.0 in {name}")
              path.write_text(text.replace("0.41.0", "0.41.1"), encoding="utf-8")

          Path("changelog/0.41.1.md").write_text(
              """---\ntype: Release\ntitle: okf-parser 0.41.1\n---\n\n# okf-parser 0.41.1\n\n- restores the tag-driven production release workflow described by RFC 0003;\n- publishes the exact Python, TypeScript, DuckDB-adapter and native companion artifacts verified by the release build;\n- publishes native companions before packages that depend on them;\n- uses PyPI and npm trusted publishing through GitHub OIDC;\n- gates publication behind the `release` GitHub environment and finalizes the GitHub Release only after registry publication succeeds.\n""",
              encoding="utf-8",
          )
          PY

      - name: Remove temporary finalizer
        run: git rm .github/workflows/sync-release-0411.yml

      - name: Commit synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml native-python-stub/pyproject.toml rust-core/pyproject.toml rust-core/Cargo.toml Cargo.lock typescript/package.json typescript/package-lock.json typescript/src/version.ts typescript-duckdb/package.json typescript-duckdb/package-lock.json native-npm-linux-x64/package.json uv.lock README.md changelog/0.41.1.md
          git commit -m "chore: synchronize 0.41.1 release metadata"
          git push origin HEAD:${{ github.head_ref }}
