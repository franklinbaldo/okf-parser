name: Observe v0.43.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-0.43.0-observe.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Observe dispatched Release for reviewed SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=522cd5c12303c19e784a7645569094f54f73854e
          while true; do
            run=$(gh run list --workflow publish.yml --limit 20 --json databaseId,status,conclusion,headSha,event,url,createdAt \
              | jq -c --arg sha "$target" '[.[] | select(.headSha == $sha and .event == "workflow_dispatch")] | first')
            if [ "$run" != "null" ]; then
              status=$(jq -r .status <<<"$run")
              if [ "$status" = "completed" ]; then
                printf '%s\n' "$run" > release-0.43.0-status.json
                break
              fi
            fi
            sleep 5
          done

      - name: Record observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-0.43.0-status.json
          git commit -m "chore: record v0.43.0 release status"
          git push origin HEAD:main

      - name: Require successful release
        run: test "$(jq -r .conclusion release-0.43.0-status.json)" = success
