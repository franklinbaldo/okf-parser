name: Temporary polish edit 0.24.0

on:
  pull_request:
    branches:
      - feat/revision-digests-0.23.0

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'feat/single-concept-edit-0.24.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/single-concept-edit-0.24.0
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Apply canonical lint and type fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          edit = Path('src/okf_parser/edit.py')
          text = edit.read_text()
          text = text.replace('from typing import TYPE_CHECKING\n', 'from typing import TYPE_CHECKING, cast\n', 1)
          text = text.replace('def _edit_concept(\n', 'def _edit_concept(  # noqa: PLR0913 - explicit bounded edit inputs\n', 1)
          text = text.replace(
              '            validation = tuple(\n',
              '            validation: tuple[dict[str, object], ...] = tuple(\n',
              1,
          )
          marker = '    written = bool(write_result.get("written", False))\n'
          assert marker in text
          insertion = dedent('''\
          validation_value = write_result.get("validation", ())
          validation_result: tuple[dict[str, object], ...] = (
              tuple(
                  cast("dict[str, object]", item)
                  for item in validation_value
                  if isinstance(item, dict)
              )
              if isinstance(validation_value, (list, tuple))
              else ()
          )
          conflict_value = write_result.get("conflict_paths", ())
          conflict_result = (
              tuple(str(item) for item in conflict_value)
              if isinstance(conflict_value, (list, tuple))
              else ()
          )
          error_value = write_result.get("error")
          ''')
          text = text.replace(marker, marker + indent(insertion, '    '), 1)
          text = text.replace(
              '        validation=tuple(write_result.get("validation", ())),\n',
              '        validation=validation_result,\n',
              1,
          )
          text = text.replace(
              '        conflict_paths=tuple(write_result.get("conflict_paths", ())),\n',
              '        conflict_paths=conflict_result,\n',
              1,
          )
          text = text.replace(
              '        error=write_result.get("error") if isinstance(write_result.get("error"), str) else None,\n',
              '        error=error_value if isinstance(error_value, str) else None,\n',
              1,
          )
          compile(text, str(edit), 'exec')
          edit.write_text(text)

          support = Path('src/okf_parser/write_support.py')
          text = support.read_text()
          text = text.replace(
              '                raise WriteSupportError(f"file changed while it was being read: {posix}")',
              '                message = f"file changed while it was being read: {posix}"\n                raise WriteSupportError(message)',
              1,
          )
          text = text.replace(
              'def stage_validate_write(\n',
              'def stage_validate_write(  # noqa: PLR0913 - shared write gate has explicit inputs\n',
              1,
          )
          compile(text, str(support), 'exec')
          support.write_text(text)

          test = Path('tests/test_edit.py')
          text = test.read_text()
          if not text.startswith('"""Tests for conflict-safe single-concept body editing.'): 
              text = '"""Tests for conflict-safe single-concept body editing."""\n\n' + text
          text = text.replace(
              'from pathlib import Path\n\nimport pytest\n',
              'from typing import TYPE_CHECKING\n\nimport pytest\n\nif TYPE_CHECKING:\n    from pathlib import Path\n',
              1,
          )
          compile(text, str(test), 'exec')
          test.write_text(text)
          PY
          uv sync --frozen --all-groups
          uv run ruff check --fix src/okf_parser/apply.py src/okf_parser/edit.py src/okf_parser/write_support.py tests/test_edit.py
          uv run ruff format src/okf_parser/apply.py src/okf_parser/edit.py src/okf_parser/write_support.py tests/test_edit.py
      - name: Validate entire 0.24.0 tree
        run: |
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run vulture src --min-confidence 90
          uv run pytest -q
          uv build
          npm ci --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb
      - name: Rebuild as one semantic commit on #62
        shell: bash
        run: |
          rm -f .github/workflows/temporary-*.yml .github/workflows/temporary-*.yaml
          git add -A
          git fetch origin feat/revision-digests-0.23.0
          git reset --soft origin/feat/revision-digests-0.23.0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(edit): add conflict-safe single-concept body preview/write'
          git push --force-with-lease origin HEAD:feat/single-concept-edit-0.24.0
