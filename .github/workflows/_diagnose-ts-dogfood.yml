name: Diagnose TypeScript dogfood

on:
  push:
    branches:
      - feat/codebase-okf-project-manifest

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/codebase-okf-project-manifest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci --prefix typescript
      - run: npm run build --prefix typescript
      - name: Print dogfood result
        shell: bash
        run: |
          set +e
          node typescript/dist/cli.js check .
          code=$?
          echo "DOGFOOD_EXIT=$code"
          exit 0
      - name: Remove diagnostic workflow
        run: |
          rm .github/workflows/_diagnose-ts-dogfood.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove TypeScript dogfood diagnostic'
          git push origin HEAD:feat/codebase-okf-project-manifest
