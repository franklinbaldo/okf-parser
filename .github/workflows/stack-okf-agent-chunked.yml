name: Build stacked OKF agent surfaces chunked

on:
  push:
    branches: [stack/okf-agent-bootstrap]

permissions:
  contents: write

concurrency:
  group: okf-agent-stack-bootstrap-chunked
  cancel-in-progress: true

jobs:
  build-stack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Configure stack author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Decode one-shot stack builder
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = "".join(
              Path(f".github/stack/chunk{index}.b64").read_text(encoding="utf-8").strip()
              for index in range(1, 7)
          )
          Path("/tmp/build_stack.py").write_bytes(gzip.decompress(base64.b64decode(encoded)))
          PY
          python -m py_compile /tmp/build_stack.py

      - name: Build, verify, and push six stacked branches
        run: python /tmp/build_stack.py
