name: Refresh RFC npm lock

on:
  push:
    branches:
      - rfc/0008-effect-aware-mcp-writes

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Refresh generated lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix typescript

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add typescript/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh generated TypeScript lockfile"
          git push
