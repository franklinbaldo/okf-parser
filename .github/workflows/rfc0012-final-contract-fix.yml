name: RFC 0012 final contract fix

on:
  push:
    branches:
      - docs/rfc-0012-relational-agent-surfaces

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/rfc-0012-relational-agent-surfaces
          fetch-depth: 0
      - name: Apply patch and clean staging files
        shell: bash
        run: |
          python .github/stack/rfc0012_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rfc0012-final-contract-fix.yml .github/stack/rfc0012_patch.py
          git add rfcs/0012-relational-agent-surfaces.md
          git diff --cached --check
          git commit -m "docs: close RFC 0012 impact and sequencing semantics"
          git push origin HEAD:docs/rfc-0012-relational-agent-surfaces
