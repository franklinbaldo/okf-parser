name: Temporary build reviewed apply tree

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Materialize reviewed-preview implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/temporary-finalize-apply-token.yml').read_text(encoding='utf-8')
          marker = '      - name: Materialize reviewed-preview contract\n        run: |\n'
          start = source.index(marker) + len(marker)
          end = source.find('\n      - name:', start)
          raw = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
          Path('/tmp/materialize-apply-token.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/materialize-apply-token.sh
          python - <<'PY'
          from pathlib import Path
          path = Path('src/okf_parser/apply.py')
          text = path.read_text(encoding='utf-8')
          old = 'def apply_bundle(  # each argument is an independent public CLI flag.\n'
          new = 'def apply_bundle(  # noqa: C901, PLR0911 - snapshot-coherent RFC 0005 orchestration\n'
          if text.count(new) == 1:
              pass
          elif text.count(old) == 1:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('unexpected apply_bundle lint marker')
          PY
      - name: Canonicalize and focused-test semantic implementation
        run: |
          uv sync --frozen --all-groups
          uv run ruff format src/okf_parser/apply.py src/okf_parser/service.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run ruff check --fix src/okf_parser/apply.py src/okf_parser/service.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run ruff format src/okf_parser/apply.py src/okf_parser/service.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run pytest -q tests/test_apply.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run ty check src tests
          uv run vulture src --min-confidence 90
      - name: Synchronize 0.24.1 metadata and locks
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('pyproject.toml'): [('version = "0.24.0"', 'version = "0.24.1"')],
              Path('typescript/package.json'): [('"version": "0.24.0"', '"version": "0.24.1"')],
              Path('typescript-duckdb/package.json'): [
                  ('"version": "0.24.0"', '"version": "0.24.1"'),
                  ('"okf-parser": "^0.24.0"', '"okf-parser": "^0.24.1"'),
              ],
              Path('typescript/src/version.ts'): [('PROTOCOL_VERSION = "0.24.0"', 'PROTOCOL_VERSION = "0.24.1"')],
              Path('README.md'): [('franklinbaldo/okf-parser@v0.24.0', 'franklinbaldo/okf-parser@v0.24.1')],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if text.count(new) == 1 and text.count(old) == 0:
                      continue
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: unexpected version marker {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          uv lock
          npm --prefix typescript install --package-lock-only --ignore-scripts
          npm --prefix typescript-duckdb install --package-lock-only --ignore-scripts
          uv run ruff format tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run ruff check src/okf_parser/apply.py src/okf_parser/service.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
      - name: Commit semantic blobs only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md pyproject.toml uv.lock changelog/0.24.1.md \
            src/okf_parser/apply.py src/okf_parser/service.py \
            tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py \
            typescript/package.json typescript/package-lock.json typescript/src/version.ts \
            typescript-duckdb/package.json typescript-duckdb/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat(apply): bind commit to reviewed preview candidate'
          git push
