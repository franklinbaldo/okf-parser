name: One-shot status lifecycle

on:
  push:
    branches: [fix/core-status-lifecycle]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[status-lifecycle-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Patch lifecycle validation and shared corpus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"expected one marker in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/okf_parser/bundle.py",
              '_DATE_LEVEL = 2\ntype TableRecord = ConceptRecord | ReservedRecord | LinkRecord\n',
              '_DATE_LEVEL = 2\n_CORE_STATUSES = frozenset({"draft", "stable", "deprecated"})\ntype TableRecord = ConceptRecord | ReservedRecord | LinkRecord\n',
          )
          replace_once(
              "src/okf_parser/bundle.py",
              '''    if not parsed.concept_type:\n        diagnostics.append(\n            Violation(\n                code="OKF002",\n                severity=Severity.ERROR,\n                path=relative,\n                message="frontmatter must contain a non-empty string type",\n            )\n        )\n\n    doc_id = concept_id(root, path)\n''',
              '''    if not parsed.concept_type:\n        diagnostics.append(\n            Violation(\n                code="OKF002",\n                severity=Severity.ERROR,\n                path=relative,\n                message="frontmatter must contain a non-empty string type",\n            )\n        )\n\n    frontmatter = json.loads(parsed.frontmatter_json)\n    if "status" in frontmatter:\n        status = frontmatter["status"]\n        if not isinstance(status, str) or status not in _CORE_STATUSES:\n            diagnostics.append(\n                Violation(\n                    code="OKF010",\n                    severity=Severity.ERROR,\n                    path=relative,\n                    message="frontmatter status must be one of: draft, stable, deprecated",\n                )\n            )\n\n    doc_id = concept_id(root, path)\n''',
          )

          replace_once(
              "typescript/src/core.ts",
              'const DEFAULT_READ_CONCURRENCY = 32;\n',
              'const DEFAULT_READ_CONCURRENCY = 32;\nconst CORE_STATUSES = new Set(["draft", "stable", "deprecated"]);\n',
          )
          replace_once(
              "typescript/src/core.ts",
              '''    if (parsed.conceptType === "") {\n      diagnostics.push(\n        diagnostic("OKF002", "error", relative, "frontmatter must contain a non-empty string type"),\n      );\n    }\n    const sourceId = conceptId(root, filePath);\n''',
              '''    if (parsed.conceptType === "") {\n      diagnostics.push(\n        diagnostic("OKF002", "error", relative, "frontmatter must contain a non-empty string type"),\n      );\n    }\n    if (Object.hasOwn(parsed.frontmatter, "status")) {\n      const status = parsed.frontmatter.status;\n      if (typeof status !== "string" || !CORE_STATUSES.has(status)) {\n        diagnostics.push(\n          diagnostic(\n            "OKF010",\n            "error",\n            relative,\n            "frontmatter status must be one of: draft, stable, deprecated",\n          ),\n        );\n      }\n    }\n    const sourceId = conceptId(root, filePath);\n''',
          )

          replace_once(
              "okf-engine/src/engine.rs",
              '''struct Parsed {\n    record: ConceptRecord,\n    facts: Facts,\n}\n''',
              '''struct Parsed {\n    record: ConceptRecord,\n    facts: Facts,\n    status: Option<Value>,\n}\n''',
          )
          replace_once(
              "okf-engine/src/engine.rs",
              '''    Ok(Parsed {\n        facts: markdown_facts(b),\n        record: ConceptRecord {\n''',
              '''    Ok(Parsed {\n        facts: markdown_facts(b),\n        status: map.get("status").cloned(),\n        record: ConceptRecord {\n''',
          )
          replace_once(
              "okf-engine/src/engine.rs",
              '''                    if p.record.concept_type.is_empty() {\n                        diagnostics.push(diag(\n                            "OKF002",\n                            "error",\n                            &doc.relative,\n                            "frontmatter must contain a non-empty string type",\n                        ));\n                    }\n''',
              '''                    if p.record.concept_type.is_empty() {\n                        diagnostics.push(diag(\n                            "OKF002",\n                            "error",\n                            &doc.relative,\n                            "frontmatter must contain a non-empty string type",\n                        ));\n                    }\n                    if let Some(status) = &p.status\n                        && !matches!(\n                            status,\n                            Value::String(value)\n                                if matches!(value.as_str(), "draft" | "stable" | "deprecated")\n                        )\n                    {\n                        diagnostics.push(diag(\n                            "OKF010",\n                            "error",\n                            &doc.relative,\n                            "frontmatter status must be one of: draft, stable, deprecated",\n                        ));\n                    }\n''',
          )

          cases = [
              {"name": "status-absent", "source": "---\ntype: Reference\n---\n# Absent\n", "valid": True},
              {"name": "status-draft", "source": "---\ntype: Reference\nstatus: draft\n---\n# Draft\n", "valid": True},
              {"name": "status-stable", "source": "---\ntype: Reference\nstatus: stable\n---\n# Stable\n", "valid": True},
              {"name": "status-deprecated", "source": "---\ntype: Reference\nstatus: deprecated\n---\n# Deprecated\n", "valid": True},
              {"name": "status-proposed-invalid", "source": "---\ntype: RFC\nstatus: proposed\n---\n# Proposed\n", "valid": False},
              {"name": "status-list-invalid", "source": "---\ntype: Reference\nstatus:\n  - stable\n---\n# List\n", "valid": False},
              {"name": "status-map-invalid", "source": "---\ntype: Reference\nstatus:\n  value: stable\n---\n# Map\n", "valid": False},
              {"name": "domain-extension-allowed", "source": "---\ntype: RFC\nrfc_status: superseded\n---\n# Extension\n", "valid": True},
          ]
          Path("conformance/status-lifecycle.json").write_text(
              json.dumps(cases, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          Path("tests/test_status_lifecycle.py").write_text(r'''from __future__ import annotations

import json
from pathlib import Path

from okf_parser.bundle import load_bundle


def test_shared_status_lifecycle_conformance(tmp_path: Path) -> None:
    cases = json.loads(
        (Path(__file__).parents[1] / "conformance" / "status-lifecycle.json").read_text(
            encoding="utf-8"
        )
    )
    for case in cases:
        root = tmp_path / case["name"]
        root.mkdir()
        (root / "concept.md").write_text(case["source"], encoding="utf-8")
        bundle = load_bundle(root)
        status_errors = [item for item in bundle.diagnostics if item.code == "OKF010"]
        assert (not status_errors) is case["valid"], case["name"]
''', encoding="utf-8")

          Path("typescript/test/status-lifecycle.test.ts").write_text(r'''import { mkdtemp, readFile, rm, writeFile } from "node:fs/promises";
import os from "node:os";
import path from "node:path";

import { expect, test } from "vitest";

import { loadBundle } from "../src/index.js";

interface Case {
  readonly name: string;
  readonly source: string;
  readonly valid: boolean;
}

test("shared status lifecycle conformance", async () => {
  const fixture = path.resolve(import.meta.dirname, "../../conformance/status-lifecycle.json");
  const cases = JSON.parse(await readFile(fixture, "utf8")) as readonly Case[];
  for (const item of cases) {
    const root = await mkdtemp(path.join(os.tmpdir(), "okf-status-"));
    try {
      await writeFile(path.join(root, "concept.md"), item.source, "utf8");
      const bundle = await loadBundle(root);
      const statusErrors = bundle.diagnostics.filter((diagnostic) => diagnostic.code === "OKF010");
      expect(statusErrors.length === 0, item.name).toBe(item.valid);
    } finally {
      await rm(root, { recursive: true, force: true });
    }
  }
});
''', encoding="utf-8")

          rust_test = r'''use std::fs;
use std::path::PathBuf;
use std::time::{SystemTime, UNIX_EPOCH};

use okf_engine::load_bundle;
use serde::Deserialize;

#[derive(Deserialize)]
struct Case {
    name: String,
    source: String,
    valid: bool,
}

#[test]
fn shared_status_lifecycle_conformance() {
    let cases: Vec<Case> = serde_json::from_str(include_str!("../../conformance/status-lifecycle.json"))
        .expect("valid conformance corpus");
    for (index, case) in cases.into_iter().enumerate() {
        let nonce = SystemTime::now()
            .duration_since(UNIX_EPOCH)
            .expect("clock")
            .as_nanos();
        let root: PathBuf = std::env::temp_dir().join(format!("okf-status-{}-{nonce}-{index}", std::process::id()));
        fs::create_dir_all(&root).expect("create temp bundle");
        fs::write(root.join("concept.md"), case.source).expect("write concept");
        let bundle = load_bundle(&root, &[], 1).expect("load bundle");
        let has_status_error = bundle.diagnostics.iter().any(|item| item.code == "OKF010");
        assert_eq!(!has_status_error, case.valid, "{}", case.name);
        fs::remove_dir_all(root).expect("remove temp bundle");
    }
}
'''
          Path("okf-engine/tests").mkdir(exist_ok=True)
          Path("okf-engine/tests/status_lifecycle.rs").write_text(rust_test, encoding="utf-8")
          PY
      - name: Format and test focused slice
        run: |
          uv sync --group dev
          uv run ruff format src/okf_parser/bundle.py tests/test_status_lifecycle.py
          uv run ruff check src/okf_parser/bundle.py tests/test_status_lifecycle.py
          uv run pytest tests/test_status_lifecycle.py
          npm --prefix typescript ci
          npm --prefix typescript run format -- --write src/core.ts test/status-lifecycle.test.ts
          npm --prefix typescript test -- --run test/status-lifecycle.test.ts
          cargo fmt --manifest-path okf-engine/Cargo.toml --check
          cargo test --manifest-path okf-engine/Cargo.toml --test status_lifecycle
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/okf_parser/bundle.py tests/test_status_lifecycle.py conformance/status-lifecycle.json typescript/src/core.ts typescript/test/status-lifecycle.test.ts okf-engine/src/engine.rs okf-engine/tests/status_lifecycle.rs
          git commit -m 'fix: validate core OKF status lifecycle [status-lifecycle-generated]'
          git push
