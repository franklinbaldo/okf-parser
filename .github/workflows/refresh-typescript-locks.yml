name: Refresh TypeScript locks

on:
  push:
    branches:
      - feat/typescript-core

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/typescript-core

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Generate locks and remove this one-shot workflow
        run: |
          set -euo pipefail
          npm install --prefix typescript --package-lock-only
          uv lock
          rm .github/workflows/refresh-typescript-locks.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add typescript/package-lock.json uv.lock .github/workflows/refresh-typescript-locks.yml
          git commit -m "chore: lock TypeScript core dependencies"
          git push origin HEAD:feat/typescript-core
