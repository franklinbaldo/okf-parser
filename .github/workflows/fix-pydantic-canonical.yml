name: Fix Pydantic canonical output

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/pydantic-schema-source' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pydantic-schema-source
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          python-version: '3.12'
      - name: Add regressions, canonicalize, and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text and new not in text:
                  raise SystemExit(f"expected text not found in {path}")
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f"ambiguous replacement in {path}")
                  file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/okf_parser/cli.py",
              '    if isinstance(result.payload, str):\n        sys.stdout.write(result.payload + "\\n")\n',
              '    if isinstance(result.payload, str):\n        text = result.payload\n        sys.stdout.write(text if text.endswith("\\n") else text + "\\n")\n',
          )

          pydantic_tests = Path("tests/test_pydantic_source.py")
          text = pydantic_tests.read_text(encoding="utf-8")
          if "test_adversarial_names_and_literals_stay_canonical" not in text:
              text += '''\n\ndef _write_adversarial_bundle(path: Path) -> tuple[str, str, str, str]:\n    concept_type = "ExtremelyLongConceptType" + "Segment" * 18\n    long_key = "customer-" + "identifier-" * 14 + "value"\n    nested_key = "nested-" + "structure-" * 12 + "value"\n    child_key = "child-" + "segment-" * 12 + "value"\n    _write_concept(\n        path / "adversarial.md",\n        f"type: {concept_type}\\n{long_key}: customer-123\\n"\n        f"{nested_key}:\\n  {child_key}: nested\\n",\n    )\n    return concept_type, long_key, nested_key, child_key\n\n\ndef test_adversarial_names_and_literals_stay_canonical(tmp_path: Path) -> None:\n    concept_type, long_key, nested_key, child_key = _write_adversarial_bundle(tmp_path)\n    source = export_pydantic_source(str(tmp_path))\n    expected = (\n        Path(__file__).parent / "fixtures" / "pydantic_adversarial_generated.py"\n    ).read_text(encoding="utf-8")\n\n    assert source == expected\n    assert max(map(len, source.splitlines())) <= 100\n\n    dynamic = build_pydantic_models(str(tmp_path))[concept_type]\n    generated = _source_model(source, dynamic.__name__)\n    assert len(dynamic.__name__) <= 40\n    assert dynamic.__name__ == generated.__name__\n    assert max(map(len, generated.model_fields)) <= 32\n\n    value = generated.model_validate(\n        {\n            "type": concept_type,\n            long_key: "customer-123",\n            nested_key: {child_key: "nested"},\n        }\n    )\n    customer_name = next(\n        name for name, field in generated.model_fields.items() if field.alias == long_key\n    )\n    assert value.model_dump()[customer_name] == "customer-123"\n'''
              pydantic_tests.write_text(text, encoding="utf-8")

          cli_tests = Path("tests/test_cli.py")
          text = cli_tests.read_text(encoding="utf-8")
          if "from typing import TYPE_CHECKING" in text and "import pytest" not in text:
              text = text.replace(
                  "from typing import TYPE_CHECKING\n\nfrom okf_parser.cli import format_command\n",
                  "from typing import TYPE_CHECKING, Literal\n\nimport pytest\n\nfrom okf_parser.cli import app, format_command\nfrom okf_parser.service import schema_bundle\n",
              )
          if "test_text_schema_cli_preserves_single_trailing_newline" not in text:
              text += '''\n\n@pytest.mark.parametrize("schema_format", ["zod", "pydantic"])\ndef test_text_schema_cli_preserves_single_trailing_newline(\n    tmp_path: Path,\n    capsys: pytest.CaptureFixture[str],\n    schema_format: Literal["zod", "pydantic"],\n) -> None:\n    (tmp_path / "concept.md").write_text(\n        "---\\ntype: Example\\nname: value\\n---\\nBody\\n",\n        encoding="utf-8",\n    )\n    expected = schema_bundle(str(tmp_path), schema_format)\n\n    app(["schema", str(tmp_path), "--format", schema_format])\n\n    assert capsys.readouterr().out == expected\n'''
          cli_tests.write_text(text, encoding="utf-8")
          PY

          uv sync --frozen --all-groups

          uv run python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from okf_parser.schema_export import export_pydantic_source

          with TemporaryDirectory() as directory:
              root = Path(directory)
              concept_type = "ExtremelyLongConceptType" + "Segment" * 18
              long_key = "customer-" + "identifier-" * 14 + "value"
              nested_key = "nested-" + "structure-" * 12 + "value"
              child_key = "child-" + "segment-" * 12 + "value"
              (root / "adversarial.md").write_text(
                  "---\n"
                  f"type: {concept_type}\n"
                  f"{long_key}: customer-123\n"
                  f"{nested_key}:\n  {child_key}: nested\n"
                  "---\nBody\n",
                  encoding="utf-8",
              )
              source = export_pydantic_source(str(root))
          Path("tests/fixtures/pydantic_adversarial_generated.py").write_text(
              source, encoding="utf-8"
          )
          PY

          uv run ruff format src/okf_parser/pydantic_projection.py src/okf_parser/cli.py tests/test_pydantic_source.py tests/test_cli.py tests/fixtures/pydantic_adversarial_generated.py
          uv run ruff check .
          uv run ty check src tests
          uv run pytest tests/test_pydantic_source.py tests/test_cli.py

          rm -f .github/workflows/fix-pydantic-canonical.yml .github/workflows/run-pydantic-canonical-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep generated schema source canonical'
          git push origin HEAD:feat/pydantic-schema-source
