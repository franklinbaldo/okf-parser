name: Fix Pydantic canonical output

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/pydantic-schema-source'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pydantic-schema-source
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          python-version: '3.12'
      - name: Apply fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {text.count(old)}")
              return text.replace(old, new)

          projection = Path('src/okf_parser/pydantic_projection.py')
          text = projection.read_text(encoding='utf-8')
          text = replace_once(text, 'import json\nimport keyword\n', 'import hashlib\nimport json\nimport keyword\n', 'hashlib import')
          text = replace_once(
              text,
              '_PROTECTED_PYDANTIC_NAMES = frozenset(dir(BaseModel)) | {"model_config"}\n',
              '_PROTECTED_PYDANTIC_NAMES = frozenset(dir(BaseModel)) | {"model_config"}\n'
              '_MAX_PYDANTIC_FIELD_NAME = 32\n'
              '_MAX_PYDANTIC_MODEL_NAME = 40\n'
              '_MAX_COMPACT_ANNOTATION = 50\n'
              '_MAX_STRING_LITERAL = 64\n',
              'projection constants',
          )

          field_pattern = re.compile(
              r'def _normalized_identifier\(authored: str\) -> str:\n.*?\n\ndef _python_type',
              re.S,
          )
          field_replacement = '''def _normalized_identifier(authored: str) -> str:
              normalized = unicodedata.normalize("NFKC", authored)
              candidate = "".join(
                  character if character == "_" or character.isalnum() else "_"
                  for character in normalized
              ).strip("_")
              if not candidate:
                  candidate = "field"
              if candidate[0].isdigit():
                  candidate = f"field_{candidate}"
              if not candidate.isidentifier():
                  encoded = "".join(f"u{ord(character):04x}" for character in normalized)
                  candidate = f"field_{encoded}" if encoded else "field"
              return candidate


          def _bounded_identifier(candidate: str, source: str, *, limit: int, fallback: str) -> str:
              """Bound one generated identifier with a stable content digest."""
              if len(candidate) <= limit:
                  return candidate
              digest = hashlib.sha256(source.encode("utf-8")).hexdigest()[:10]
              prefix = candidate[: limit - len(digest) - 1].rstrip("_") or fallback
              return f"{prefix}_{digest}"


          def _pydantic_model_name(suggested: str, path: StructuralPath) -> str:
              """Keep emitted class names comfortably inside the repository line limit."""
              provenance = "\\x1f".join((*path, suggested))
              return _bounded_identifier(
                  suggested,
                  provenance,
                  limit=_MAX_PYDANTIC_MODEL_NAME,
                  fallback="Model",
              )


          def pydantic_field_name(
              authored: str,
              used: dict[str, str],
          ) -> PydanticFieldName:
              """Map an authored YAML key to a bounded safe Pydantic attribute."""
              normalized = unicodedata.normalize("NFKC", authored)
              direct = (
                  authored == normalized
                  and authored.isidentifier()
                  and not keyword.iskeyword(authored)
                  and not authored.startswith("_")
                  and not authored.startswith("model_")
                  and authored not in _PROTECTED_PYDANTIC_NAMES
              )
              if direct:
                  candidate = authored
                  alias = None
              else:
                  candidate = _normalized_identifier(authored)
                  if candidate.startswith("model_"):
                      candidate = f"field_{candidate}"
                  elif (
                      authored.startswith("_")
                      or keyword.iskeyword(candidate)
                      or candidate in _PROTECTED_PYDANTIC_NAMES
                  ):
                      candidate = f"{candidate.rstrip('_')}_"
                  if candidate.startswith("_"):
                      candidate = f"field{candidate}"
                  alias = authored

              bounded = _bounded_identifier(
                  candidate,
                  authored,
                  limit=_MAX_PYDANTIC_FIELD_NAME,
                  fallback="field",
              )
              if bounded != candidate:
                  candidate = bounded
                  alias = authored

              previous = used.get(candidate)
              if previous is not None and previous != authored:
                  message = (
                      f"authored fields {previous!r} and {authored!r} both map to "
                      f"Pydantic attribute {candidate!r}"
                  )
                  raise SchemaNameCollisionError(message)
              used[candidate] = authored
              return PydanticFieldName(candidate, alias)


          def _python_type'''
          text, count = field_pattern.subn(field_replacement, text)
          if count != 1:
              raise SystemExit(f'field policy replacement count: {count}')

          dynamic_pattern = re.compile(
              r'def _dynamic_model\(\n.*?\n\ndef build_dynamic_pydantic_models',
              re.S,
          )
          dynamic_replacement = '''def _dynamic_model(
              name: str,
              node: ObjectNode,
              *,
              path: StructuralPath,
              registry: PydanticModelNameRegistry,
          ) -> type[BaseModel]:
              emitted_name = _pydantic_model_name(name, path)
              registry.register(emitted_name, path)
              fields: dict[str, FieldDefinition] = {}
              used: dict[str, str] = {}
              for field_contract in node.fields:
                  mapped = pydantic_field_name(field_contract.name, used)
                  nested_name = model_name(f"{name}_{field_contract.name}", "Structure")
                  annotation: Any = _runtime_annotation(
                      field_contract.value,
                      suggested_name=nested_name,
                      path=(*path, field_contract.name),
                      registry=registry,
                  )
                  if field_contract.nullable:
                      annotation = annotation | None
                  default: Any = ... if field_contract.required else None
                  if mapped.alias is not None:
                      default = Field(default=default, alias=mapped.alias)
                  fields[mapped.python_name] = (annotation, default)
              return create_model(
                  emitted_name,
                  __config__=ConfigDict(extra="allow"),
                  **cast("dict[str, Any]", fields),
              )


          def build_dynamic_pydantic_models'''
          text, count = dynamic_pattern.subn(dynamic_replacement, text)
          if count != 1:
              raise SystemExit(f'dynamic replacement count: {count}')

          source_pattern = re.compile(
              r'@dataclass\(frozen=True, slots=True\)\nclass _SourceField:.*?def render_pydantic_source\(contracts: tuple\[TypeContract, \.\.\.\]\) -> str:\n.*?return "\\n"\.join\(lines\)\.rstrip\(\) \+ "\\n"',
              re.S,
          )
          source_replacement = '''@dataclass(frozen=True, slots=True)
          class _SourceAnnotation:
              compact: str
              lines: tuple[str, ...] | None = None


          @dataclass(frozen=True, slots=True)
          class _SourceField:
              name: str
              annotation: _SourceAnnotation
              required: bool
              nullable: bool
              alias: str | None


          @dataclass(frozen=True, slots=True)
          class _SourceModel:
              name: str
              fields: tuple[_SourceField, ...]


          @dataclass(slots=True)
          class _SourceContext:
              registry: PydanticModelNameRegistry = field(default_factory=PydanticModelNameRegistry)
              imports: _SourceImports = field(default_factory=_SourceImports)
              models: list[_SourceModel] = field(default_factory=list)


          def _string_literal_parts(value: str) -> tuple[str, ...]:
              """Split a Python string literal so no emitted literal token is excessively long."""
              compact = json.dumps(value, ensure_ascii=False)
              if len(compact) <= _MAX_STRING_LITERAL:
                  return (compact,)

              parts: list[str] = []
              current = ""
              for character in value:
                  candidate = current + character
                  if current and len(json.dumps(candidate, ensure_ascii=False)) > _MAX_STRING_LITERAL:
                      parts.append(json.dumps(current, ensure_ascii=False))
                      current = character
                  else:
                      current = candidate
              parts.append(json.dumps(current, ensure_ascii=False))
              return tuple(parts)


          def _literal_source_annotation(value: str) -> _SourceAnnotation:
              compact_value = json.dumps(value, ensure_ascii=False)
              compact = f"Literal[{compact_value}]"
              if len(compact) <= _MAX_COMPACT_ANNOTATION:
                  return _SourceAnnotation(compact)
              parts = list(_string_literal_parts(value))
              parts[-1] = f"{parts[-1]},"
              return _SourceAnnotation(
                  compact,
                  ("Literal[", *(f"    {part}" for part in parts), "]"),
              )


          def _nullable_source_annotation(annotation: _SourceAnnotation) -> _SourceAnnotation:
              compact = f"{annotation.compact} | None"
              if annotation.lines is None and len(compact) <= _MAX_COMPACT_ANNOTATION:
                  return _SourceAnnotation(compact)
              lines = list(annotation.lines or (annotation.compact,))
              lines[-1] = f"{lines[-1]} | None"
              return _SourceAnnotation(compact, tuple(lines))


          def _list_source_annotation(item: _SourceAnnotation) -> _SourceAnnotation:
              compact = f"list[{item.compact}]"
              if item.lines is None and len(compact) <= _MAX_COMPACT_ANNOTATION:
                  return _SourceAnnotation(compact)
              if item.lines is None:
                  inner = [f"    {item.compact},"]
              else:
                  inner = [f"    {line}" for line in item.lines]
                  inner[-1] = f"{inner[-1]},"
              return _SourceAnnotation(compact, ("list[", *inner, "]"))


          def _source_scalar(node: ScalarNode, imports: _SourceImports) -> _SourceAnnotation:
              declared = node.declared_type
              if declared is None:
                  annotation = {
                      "string": "str",
                      "boolean": "bool",
                      "integer": "int",
                      "number": "float",
                      "date": "date",
                      "datetime": "datetime",
                  }[node.kind]
              else:
                  annotation = {
                      "string": "str",
                      "boolean": "bool",
                      "integer": "int",
                      "float": "float",
                      "decimal": "Decimal",
                      "date": "date",
                      "timestamp": "datetime",
                      "timestamptz": "datetime",
                      "uuid": "UUID",
                      "unsupported": "Any",
                  }.get(declared.family, "Any")

              if annotation in {"date", "datetime"}:
                  imports.datetime_names.add(annotation)
              elif annotation == "Decimal":
                  imports.decimal = True
              elif annotation == "UUID":
                  imports.uuid = True
              elif annotation == "Any":
                  imports.typing_names.add("Any")
              return _SourceAnnotation(annotation)


          def _source_annotation(
              node: ContractNode,
              *,
              suggested_name: str,
              path: StructuralPath,
              context: _SourceContext,
          ) -> _SourceAnnotation:
              if isinstance(node, ScalarNode):
                  return _source_scalar(node, context.imports)
              if isinstance(node, LiteralNode):
                  context.imports.typing_names.add("Literal")
                  return _literal_source_annotation(node.value)
              if isinstance(node, AnyNode):
                  context.imports.typing_names.add("Any")
                  return _SourceAnnotation("Any")
              if isinstance(node, ListNode):
                  item = _source_annotation(
                      node.item,
                      suggested_name=f"{suggested_name}Item",
                      path=(*path, "[]"),
                      context=context,
                  )
                  if node.item_nullable:
                      item = _nullable_source_annotation(item)
                  return _list_source_annotation(item)
              emitted_name = _collect_source_model(
                  suggested_name,
                  node,
                  path=path,
                  context=context,
              )
              return _SourceAnnotation(emitted_name)


          def _collect_source_model(
              name: str,
              node: ObjectNode,
              *,
              path: StructuralPath,
              context: _SourceContext,
          ) -> str:
              emitted_name = _pydantic_model_name(name, path)
              context.registry.register(emitted_name, path)
              used: dict[str, str] = {}
              source_fields: list[_SourceField] = []
              for field_contract in node.fields:
                  mapped = pydantic_field_name(field_contract.name, used)
                  nested_name = model_name(f"{name}_{field_contract.name}", "Structure")
                  annotation = _source_annotation(
                      field_contract.value,
                      suggested_name=nested_name,
                      path=(*path, field_contract.name),
                      context=context,
                  )
                  if field_contract.nullable:
                      annotation = _nullable_source_annotation(annotation)
                  if mapped.alias is not None or (
                      not field_contract.required and not field_contract.nullable
                  ):
                      context.imports.field = True
                  source_fields.append(
                      _SourceField(
                          mapped.python_name,
                          annotation,
                          field_contract.required,
                          field_contract.nullable,
                          mapped.alias,
                      )
                  )
              context.models.append(_SourceModel(emitted_name, tuple(source_fields)))
              return emitted_name


          def _render_imports(imports: _SourceImports, *, has_models: bool) -> list[str]:
              standard: list[str] = []
              if imports.datetime_names:
                  standard.append(f"from datetime import {', '.join(sorted(imports.datetime_names))}")
              if imports.decimal:
                  standard.append("from decimal import Decimal")
              if imports.typing_names:
                  standard.append(f"from typing import {', '.join(sorted(imports.typing_names))}")
              if imports.uuid:
                  standard.append("from uuid import UUID")

              lines = ['"""Generated Pydantic models from OKF schema contracts."""']
              if standard:
                  lines.extend(["", *standard])
              if has_models:
                  pydantic_names = ["BaseModel", "ConfigDict"]
                  if imports.field:
                      pydantic_names.append("Field")
                  if lines:
                      lines.append("")
                  lines.append(f"from pydantic import {', '.join(pydantic_names)}")
              return lines


          def _render_annotation_assignment(
              field_contract: _SourceField,
              suffix: str,
          ) -> list[str]:
              annotation_lines = field_contract.annotation.lines or (field_contract.annotation.compact,)
              lines = [f"    {field_contract.name}: {annotation_lines[0]}"]
              lines.extend(f"    {line}" for line in annotation_lines[1:])
              lines[-1] = f"{lines[-1]}{suffix}"
              return lines


          def _render_string_keyword(name: str, value: str) -> list[str]:
              compact = json.dumps(value, ensure_ascii=False)
              candidate = f"        {name}={compact},"
              if len(candidate) <= 100:
                  return [candidate]
              parts = _string_literal_parts(value)
              return [
                  f"        {name}=(",
                  *(f"            {part}" for part in parts),
                  "        ),",
              ]


          def _render_field(field_contract: _SourceField) -> list[str]:
              annotation = field_contract.annotation
              if field_contract.alias is not None:
                  alias = json.dumps(field_contract.alias, ensure_ascii=False)
                  default = "" if field_contract.required else "default=None, "
                  compact = (
                      f"    {field_contract.name}: {annotation.compact} = "
                      f"Field({default}alias={alias})"
                  )
                  if annotation.lines is None and len(compact) <= 100:
                      return [compact]
                  lines = _render_annotation_assignment(field_contract, " = Field(")
                  if not field_contract.required:
                      lines.append("        default=None,")
                  lines.extend(_render_string_keyword("alias", field_contract.alias))
                  lines.append("    )")
                  return lines

              if field_contract.required:
                  return _render_annotation_assignment(field_contract, "")
              if field_contract.nullable:
                  compact = f"    {field_contract.name}: {annotation.compact} = None"
                  if annotation.lines is None and len(compact) <= 100:
                      return [compact]
                  return _render_annotation_assignment(field_contract, " = None")

              compact = f"    {field_contract.name}: {annotation.compact} = Field(default=None)"
              if annotation.lines is None and len(compact) <= 100:
                  return [compact]
              lines = _render_annotation_assignment(field_contract, " = Field(")
              lines.extend(["        default=None,", "    )"])
              return lines


          def render_pydantic_source(contracts: tuple[TypeContract, ...]) -> str:
              """Render deterministic importable Pydantic v2 source from shared contracts."""
              context = _SourceContext()
              for contract in contracts:
                  _collect_source_model(
                      contract.model_name,
                      contract.root,
                      path=(contract.concept_type,),
                      context=context,
                  )

              lines = _render_imports(context.imports, has_models=bool(context.models))
              for model in context.models:
                  lines.extend(["", "", f"class {model.name}(BaseModel):"])
                  lines.extend(
                      [
                          '    """Generated Pydantic model for one OKF contract object."""',
                          "",
                          '    model_config = ConfigDict(extra="allow")',
                      ]
                  )
                  if model.fields:
                      lines.append("")
                      for field_contract in model.fields:
                          lines.extend(_render_field(field_contract))
              return "\\n".join(lines).rstrip() + "\\n"'''
          text, count = source_pattern.subn(source_replacement, text)
          if count != 1:
              raise SystemExit(f'source replacement count: {count}')
          projection.write_text(text, encoding='utf-8')

          cli = Path('src/okf_parser/cli.py')
          text = cli.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    if isinstance(result.payload, str):\n        sys.stdout.write(result.payload + "\\n")\n',
              '    if isinstance(result.payload, str):\n        text = result.payload\n        sys.stdout.write(text if text.endswith("\\n") else text + "\\n")\n',
              'CLI text newline',
          )
          cli.write_text(text, encoding='utf-8')

          tests = Path('tests/test_pydantic_source.py')
          text = tests.read_text(encoding='utf-8')
          addition = r'''

          def _write_adversarial_bundle(path: Path) -> tuple[str, str, str]:
              concept_type = "ExtremelyLongConceptType" + "Segment" * 18
              long_key = "customer-" + "identifier-" * 14 + "value"
              nested_key = "nested-" + "structure-" * 12 + "value"
              _write_concept(
                  path / "adversarial.md",
                  f"type: {concept_type}\\n{long_key}: customer-123\\n"
                  f"{nested_key}:\\n  {'child-' + 'segment-' * 12 + 'value'}: nested\\n",
              )
              return concept_type, long_key, nested_key


          def test_adversarial_names_and_literals_stay_canonical(tmp_path: Path) -> None:
              concept_type, long_key, nested_key = _write_adversarial_bundle(tmp_path)
              source = export_pydantic_source(str(tmp_path))
              expected = (
                  Path(__file__).parent / "fixtures" / "pydantic_adversarial_generated.py"
              ).read_text(encoding="utf-8")

              assert source == expected
              assert max(map(len, source.splitlines())) <= 100

              dynamic = build_pydantic_models(str(tmp_path))[concept_type]
              generated = _source_model(source, dynamic.__name__)
              assert len(dynamic.__name__) <= 40
              assert dynamic.__name__ == generated.__name__
              assert max(map(len, generated.model_fields)) <= 32

              value = generated.model_validate(
                  {
                      "type": concept_type,
                      long_key: "customer-123",
                      nested_key: {"child-" + "segment-" * 12 + "value": "nested"},
                  }
              )
              assert value.model_dump()[next(name for name in generated.model_fields if name != "type" and generated.model_fields[name].alias == long_key)] == "customer-123"
          '''
          if 'test_adversarial_names_and_literals_stay_canonical' not in text:
              text += addition
          tests.write_text(text, encoding='utf-8')

          cli_tests = Path('tests/test_cli.py')
          text = cli_tests.read_text(encoding='utf-8')
          text = text.replace(
              'from typing import TYPE_CHECKING\n\nfrom okf_parser.cli import format_command\n',
              'from typing import TYPE_CHECKING\n\nimport pytest\n\nfrom okf_parser.cli import app, format_command\nfrom okf_parser.service import schema_bundle\n',
          )
          addition = r'''

          @pytest.mark.parametrize("schema_format", ["zod", "pydantic"])
          def test_text_schema_cli_preserves_single_trailing_newline(
              tmp_path: Path,
              capsys: pytest.CaptureFixture[str],
              schema_format: str,
          ) -> None:
              (tmp_path / "concept.md").write_text(
                  "---\\ntype: Example\\nname: value\\n---\\nBody\\n",
                  encoding="utf-8",
              )
              expected = schema_bundle(str(tmp_path), schema_format)

              app(["schema", str(tmp_path), "--format", schema_format])

              assert capsys.readouterr().out == expected
          '''
          if 'test_text_schema_cli_preserves_single_trailing_newline' not in text:
              text += addition
          cli_tests.write_text(text, encoding='utf-8')
          PY

          uv sync --frozen --all-groups

          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from okf_parser.schema_export import export_pydantic_source
          from tests.test_pydantic_source import _write_adversarial_bundle

          with TemporaryDirectory() as directory:
              root = Path(directory)
              _write_adversarial_bundle(root)
              source = export_pydantic_source(str(root))
          Path('tests/fixtures/pydantic_adversarial_generated.py').write_text(source, encoding='utf-8')
          PY

          uv run ruff format src/okf_parser/pydantic_projection.py src/okf_parser/cli.py tests/test_pydantic_source.py tests/test_cli.py tests/fixtures/pydantic_adversarial_generated.py
          uv run ruff check src/okf_parser/pydantic_projection.py src/okf_parser/cli.py tests/test_pydantic_source.py tests/test_cli.py tests/fixtures/pydantic_adversarial_generated.py
          uv run ty check src tests
          uv run pytest tests/test_pydantic_source.py tests/test_cli.py

          rm .github/workflows/fix-pydantic-canonical.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/okf_parser/pydantic_projection.py src/okf_parser/cli.py tests/test_pydantic_source.py tests/test_cli.py tests/fixtures/pydantic_adversarial_generated.py .github/workflows/fix-pydantic-canonical.yml
          git commit -m 'fix: keep generated schema source canonical'
          git push origin HEAD:feat/pydantic-schema-source
