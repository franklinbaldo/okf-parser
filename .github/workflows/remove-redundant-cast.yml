name: Remove redundant schema cast

on:
  push:
    branches: [refactor/string-first-schema-inference]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/string-first-schema-inference
          fetch-depth: 0

      - name: Remove redundant cast and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/okf_parser/schema_export.py')
          text = path.read_text(encoding='utf-8')
          old = 'item_annotation = cast("Any", item_annotation) | None'
          new = 'item_annotation = item_annotation | None'
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/okf_parser/schema_export.py
          git commit -m "fix(schema): remove redundant cast"
          git pull --rebase origin refactor/string-first-schema-inference
          git push origin HEAD:refactor/string-first-schema-inference
