name: Release Dry Run

on:
  pull_request:
    paths:
      - ".github/workflows/release-dry-run.yml"
      - "changelog/**"
      - "docs/releasing.md"
      - "native-python-stub/**"
      - "native-npm-linux-x64/**"
      - "pyproject.toml"
      - "rfcs/0003-resumable-multi-registry-release.md"
      - "rust-core/Cargo.lock"
      - "rust-core/Cargo.toml"
      - "rust-core/pyproject.toml"
      - "scripts/**"
      - "tests/test_release_contract.py"
      - "tests/test_registry_state.py"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/src/version.ts"
      - "typescript-duckdb/package.json"
      - "typescript-duckdb/package-lock.json"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      ref:
        description: Existing branch, commit, or stable vX.Y.Z tag to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-set:
    name: Build and verify release set
    runs-on: ubuntu-latest
    env:
      DRY_RUN_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Verify synchronized source contract
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--tag "$DRY_RUN_REF")
          fi
          python scripts/release_contract.py verify-source "${args[@]}"

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm ci --prefix typescript-duckdb

      - name: Build each artifact once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/python release/native-python release/npm release/native-npm
          uv build --out-dir release/python
          uv build --wheel native-python-stub --out-dir release/native-python
          uv build --wheel rust-core --out-dir release/native-python
          rm -f release/python/.gitignore release/native-python/.gitignore
          cargo build --release --locked --manifest-path rust-core/Cargo.toml
          mkdir -p native-npm-linux-x64/bin
          cp rust-core/target/release/okf-core native-npm-linux-x64/bin/okf-core
          chmod +x native-npm-linux-x64/bin/okf-core
          (cd native-npm-linux-x64 && npm pack --pack-destination ../release/native-npm --silent)
          (cd typescript && npm pack --pack-destination ../release/npm --silent)
          (cd typescript-duckdb && npm pack --pack-destination ../release/npm --silent)

      - name: Verify Python native selector artifacts
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          stub=$(find release/native-python -maxdepth 1 -type f -name "okf_parser_native-${expected_version}-py3-none-any.whl" -print -quit)
          native=$(find release/native-python -maxdepth 1 -type f -name "okf_parser_native-${expected_version}-*.whl" ! -name '*-py3-none-any.whl' -print -quit)
          test -n "$stub"
          test -n "$native"
          NATIVE_WHEEL="$native" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["NATIVE_WHEEL"])
          with zipfile.ZipFile(wheel) as archive:
              scripts = [name for name in archive.namelist() if name.endswith('/scripts/okf-core')]
              if len(scripts) != 1:
                  raise SystemExit(f"expected one okf-core wheel script, found {scripts}")
          PY

      - name: Verify npm native companion artifact
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          native="release/native-npm/okf-parser-native-linux-x64-${expected_version}.tgz"
          test -f "$native"
          native_listing="$(tar -tzf "$native")"
          grep -qx 'package/bin/okf-core' <<<"$native_listing"
          grep -qx 'package/package.json' <<<"$native_listing"

      - name: Generate immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_contract.py build-manifest \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --ref "$DRY_RUN_REF" \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --uv-version "$(uv --version | awk '{print $2}')"

      - name: Verify wheel and source distribution as consumers
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          wheel=$(find release/python -maxdepth 1 -type f -name '*.whl' -print -quit)
          sdist=$(find release/python -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          for artifact in "$wheel" "$sdist"; do
            label=$(basename "$artifact" | tr '.-' '__')
            environment="$RUNNER_TEMP/python-$label"
            uv venv --python 3.12 "$environment"
            uv pip install --python "$environment/bin/python" --find-links "$GITHUB_WORKSPACE/release/native-python" "$artifact"
            EXPECTED_VERSION="$expected_version" "$environment/bin/python" -c 'import importlib.metadata, os; assert importlib.metadata.version("okf-parser") == os.environ["EXPECTED_VERSION"]; assert importlib.metadata.version("okf-parser-native") == os.environ["EXPECTED_VERSION"]'
            "$environment/bin/okf-parser" --help >/dev/null
            mkdir "$environment/fixture"
            printf '%s\n' '---' 'type: Node' '---' '# Node' > "$environment/fixture/node.md"
            FIXTURE="$environment/fixture" "$environment/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from okf_parser import load_bundle
          from okf_parser.rust_core import resolve_rust_core

          executable = resolve_rust_core()
          if executable is None or executable.name not in {"okf-core", "okf-core.exe"}:
              raise SystemExit(f"native companion was not selected: {executable}")
          bundle = load_bundle(Path(os.environ["FIXTURE"]))
          if bundle.markdown_count != 1:
              raise SystemExit(f"unexpected native bundle count: {bundle.markdown_count}")
          PY
            "$environment/bin/okf-parser" check "$environment/fixture" >/dev/null
          done

      - name: Verify portable native-selector fallback
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          stub="$GITHUB_WORKSPACE/release/native-python/okf_parser_native-${expected_version}-py3-none-any.whl"
          wheel=$(find release/python -maxdepth 1 -type f -name '*.whl' -print -quit)
          environment="$RUNNER_TEMP/python-portable-fallback"
          uv venv --python 3.12 "$environment"
          uv pip install --python "$environment/bin/python" "$stub"
          uv pip install --python "$environment/bin/python" --no-deps "$wheel"
          "$environment/bin/python" - <<'PY'
          import okf_parser_native
          if okf_parser_native.HAS_NATIVE_CORE:
              raise SystemExit("portable selector unexpectedly claims a native core")
          PY

      - name: Verify main npm tarball with native companion
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/okf-parser-$expected_version.tgz"
          native_tarball="$GITHUB_WORKSPACE/release/native-npm/okf-parser-native-linux-x64-$expected_version.tgz"
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$native_tarball" "$parser_tarball" >/dev/null
          EXPECTED_VERSION="$expected_version" node --input-type=module -e 'import("okf-parser").then(({ capabilityManifest }) => { if (capabilityManifest.protocol_version !== process.env.EXPECTED_VERSION) process.exit(1) })'
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          node --input-type=module - <<'JS'
          import { loadBundle, resolveRustCore } from "okf-parser";
          const executable = resolveRustCore({ environment: { PATH: "" } });
          if (executable === undefined || !executable.includes("okf-parser-native-linux-x64")) {
            throw new Error(`npm native companion was not selected: ${String(executable)}`);
          }
          const bundle = await loadBundle("knowledge");
          if (bundle.markdownCount !== 1) throw new Error(`unexpected native bundle count: ${String(bundle.markdownCount)}`);
          JS
          ./node_modules/.bin/okf-parser-ts --help >/dev/null
          mkdir format-fixture
          printf '# Heading\n\n-   item\n' > format-fixture/concept.md
          if ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null; then
            echo "installed formatter check unexpectedly succeeded before rewrite"
            exit 1
          fi
          ./node_modules/.bin/okf-parser-ts format format-fixture --write >/dev/null
          ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null
          grep -qx -- '- item' format-fixture/concept.md
          node "$GITHUB_WORKSPACE/typescript/scripts/smoke-mcp-stdio.mjs" ./node_modules/.bin/okf-parser-ts-mcp

      - name: Verify npm portable fallback without optional package
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/okf-parser-$expected_version.tgz"
          consumer="$RUNNER_TEMP/npm-portable-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=optional "$parser_tarball" >/dev/null
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          node --input-type=module - <<'JS'
          import { loadBundle, resolveRustCore } from "okf-parser";
          if (resolveRustCore({ environment: { PATH: "" } }) !== undefined) throw new Error("portable install unexpectedly found Rust");
          const bundle = await loadBundle("knowledge", { engine: "native" });
          if (bundle.markdownCount !== 1) throw new Error("portable fallback failed");
          JS

      - name: Verify both npm tarballs together
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/okf-parser-$expected_version.tgz"
          adapter_tarball="$GITHUB_WORKSPACE/release/npm/okf-parser-duckdb-$expected_version.tgz"
          consumer="$RUNNER_TEMP/duckdb-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=optional "$parser_tarball" >/dev/null
          npm install --ignore-scripts "$adapter_tarball" >/dev/null
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          ./node_modules/.bin/okf-parser-ts-duckdb knowledge --database bundle.duckdb > report.json
          node --input-type=module -e 'import("okf-parser-duckdb").then(async ({ exportDuckDb }) => { const result = await exportDuckDb("knowledge", { database: "second.duckdb" }); if (result.concept_count !== 1) process.exit(1) })'

      - name: Re-verify exact artifact bytes
        run: python scripts/release_contract.py verify-local --manifest release/manifest.json

      - name: Verify shipped package contents
        run: python scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Inspect public registry state
        run: python -m scripts.registry_state --manifest release/manifest.json --output release/registry-state.json

      - name: Write release summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          manifest = json.loads(Path("release/manifest.json").read_text(encoding="utf-8"))
          registry = json.loads(Path("release/registry-state.json").read_text(encoding="utf-8"))
          native_python = sorted(path.name for path in Path("release/native-python").glob("*.whl"))
          native_npm = sorted(path.name for path in Path("release/native-npm").glob("*.tgz"))
          print(f"## Release dry run {manifest['version']}")
          print()
          print(f"Source: `{manifest['repository']}@{manifest['commit']}`")
          print()
          print("| Artifact | Bytes | SHA-256 |")
          print("|---|---:|---|")
          for artifact in manifest["artifacts"]:
              print(f"| `{artifact['path']}` | {artifact['size']} | `{artifact['sha256']}` |")
          for filename in native_python:
              print(f"| `native-python/{filename}` | native companion | verified separately |")
          for filename in native_npm:
              print(f"| `native-npm/{filename}` | native companion | verified separately |")
          print()
          print("## Public registry preflight")
          print()
          print("| Registry | Package | State | Package exists | Action |")
          print("|---|---|---|---|---|")
          actions = {
              (item["registry"], item["package"]): item["action"]
              for item in registry["plan"]
          }
          for entry in registry["entries"]:
              action = actions[(entry["registry"], entry["package"])]
              print(
                  f"| {entry['registry']} | `{entry['package']}` | "
                  f"`{entry['state']}` | `{entry['package_exists']}` | `{action}` |"
              )
          PY

      - name: Upload tested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
