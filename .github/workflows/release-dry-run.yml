name: Release Dry Run

on:
  pull_request:
    paths:
      - ".github/workflows/release-dry-run.yml"
      - ".github/workflows/publish.yml"
      - "changelog/**"
      - "docs/releasing.md"
      - "native-npm-linux-x64/**"
      - "pyproject.toml"
      - "rfcs/0003-resumable-multi-registry-release.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "okf-engine/Cargo.toml"
      - "okf-db/Cargo.toml"
      - "duckdb-extension/Cargo.lock"
      - "rust-core/Cargo.toml"
      - "scripts/**"
      - "tests/test_release_contract.py"
      - "tests/test_registry_state.py"
      - "typescript/package.json"
      - "typescript/package-lock.json"
      - "typescript/src/version.ts"
      - "typescript-duckdb/package.json"
      - "typescript-duckdb/package-lock.json"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      ref:
        description: Existing branch, commit, or stable vX.Y.Z tag to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheels-linux:
    name: Build wheel (linux-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Fetch the pinned prebuilt libduckdb
        run: uv run --script scripts/fetch_libduckdb.py --target "${{ matrix.target }}-unknown-linux-gnu" --github-env

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: 2_28
          docker-options: --env DUCKDB_LIB_DIR --env DUCKDB_INCLUDE_DIR
          args: --release --locked --no-default-features --out dist --compatibility pypi

      - name: Ship libduckdb beside the executable
        shell: bash
        run: |
          set -euo pipefail
          # The manylinux container writes dist/ as root.
          if [ "$RUNNER_OS" = Linux ]; then sudo chown -R "$(id -u):$(id -g)" dist; fi
          uv run --script scripts/ship_libduckdb.py --library "$DUCKDB_LIBRARY" dist/*.whl

      - name: Prove the wheel ships the libduckdb it links
        shell: bash
        run: uv run --script scripts/check_duckdb_shipped.py dist/*.whl

      - name: Install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/smoke"
          uv venv --python 3.12 "$environment"
          if [ -d "$environment/Scripts" ]; then
            bin="$environment/Scripts"
            python="$bin/python.exe"
          else
            bin="$environment/bin"
            python="$bin/python"
          fi
          uv pip install --python "$python" --quiet --only-binary :all: dist/*.whl
          mkdir -p "$RUNNER_TEMP/fixture"
          {
            echo '---'
            echo 'type: Note'
            echo '---'
            echo '# Note'
          } > "$RUNNER_TEMP/fixture/note.md"
          "$bin/okf-parser" --version
          "$bin/okf-parser" check "$RUNNER_TEMP/fixture"
          "$bin/okf-parser" search "$RUNNER_TEMP/fixture" note
          "$bin/okf-parser" sql "$RUNNER_TEMP/fixture" "SELECT concept_type FROM concepts"
          "$bin/okf-parser" duckdb "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/bundle.duckdb"
          # The wheel does not depend on duckdb; install it only to read the export back.
          uv pip install --python "$python" --quiet "duckdb>=1.4,<2"
          BUNDLE="$RUNNER_TEMP/bundle.duckdb" "$python" - <<'PY'
          import os
          import duckdb

          with duckdb.connect(os.environ["BUNDLE"], read_only=True) as connection:
              assert connection.sql("SELECT concept_type FROM okf.concepts").fetchone() == ("Note",)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  wheels-windows:
    name: Build wheel (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      # maturin uses the runner's existing Rust toolchain; restore against that
      # exact compiler before building, with native targets kept separate.
      - name: Restore compatible Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wheel-windows-${{ runner.arch }}-v1-no-default-features-${{ hashFiles('Cargo.toml', 'scripts/fetch_libduckdb.py', 'pyproject.toml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DUCKDB MATURIN SDKROOT MACOSX_DEPLOYMENT_TARGET DEVELOPER_DIR
          cache-bin: false

      - name: Fetch the pinned prebuilt libduckdb
        shell: bash
        run: uv run --script scripts/fetch_libduckdb.py --target x86_64-pc-windows-msvc --github-env

      - name: Build Windows wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: x64
          args: --release --locked --no-default-features --out dist --compatibility pypi

      - name: Ship libduckdb beside the executable
        shell: bash
        run: |
          set -euo pipefail
          # The manylinux container writes dist/ as root.
          if [ "$RUNNER_OS" = Linux ]; then sudo chown -R "$(id -u):$(id -g)" dist; fi
          uv run --script scripts/ship_libduckdb.py --library "$DUCKDB_LIBRARY" dist/*.whl

      - name: Prove the wheel ships the libduckdb it links
        shell: bash
        run: uv run --script scripts/check_duckdb_shipped.py dist/*.whl

      - name: Install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/smoke"
          uv venv --python 3.12 "$environment"
          if [ -d "$environment/Scripts" ]; then
            bin="$environment/Scripts"
            python="$bin/python.exe"
          else
            bin="$environment/bin"
            python="$bin/python"
          fi
          uv pip install --python "$python" --quiet --only-binary :all: dist/*.whl
          mkdir -p "$RUNNER_TEMP/fixture"
          {
            echo '---'
            echo 'type: Note'
            echo '---'
            echo '# Note'
          } > "$RUNNER_TEMP/fixture/note.md"
          "$bin/okf-parser" --version
          "$bin/okf-parser" check "$RUNNER_TEMP/fixture"
          "$bin/okf-parser" search "$RUNNER_TEMP/fixture" note
          "$bin/okf-parser" sql "$RUNNER_TEMP/fixture" "SELECT concept_type FROM concepts"
          "$bin/okf-parser" duckdb "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/bundle.duckdb"
          # The wheel does not depend on duckdb; install it only to read the export back.
          uv pip install --python "$python" --quiet "duckdb>=1.4,<2"
          BUNDLE="$RUNNER_TEMP/bundle.duckdb" "$python" - <<'PY'
          import os
          import duckdb

          with duckdb.connect(os.environ["BUNDLE"], read_only=True) as connection:
              assert connection.sql("SELECT concept_type FROM okf.concepts").fetchone() == ("Note",)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-windows-x64
          path: dist/*.whl
          if-no-files-found: error

  wheels-macos:
    name: Build wheel (macos-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: macos-15-intel
          - target: aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      # maturin uses the runner's existing Rust toolchain; restore against that
      # exact compiler before building, with native targets kept separate.
      - name: Restore compatible Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wheel-${{ matrix.runner }}-${{ matrix.target }}-v1-no-default-features-${{ hashFiles('Cargo.toml', 'scripts/fetch_libduckdb.py', 'pyproject.toml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DUCKDB MATURIN SDKROOT MACOSX_DEPLOYMENT_TARGET DEVELOPER_DIR
          cache-bin: false

      - name: Fetch the pinned prebuilt libduckdb
        run: uv run --script scripts/fetch_libduckdb.py --target "${{ matrix.target }}-apple-darwin" --github-env

      - name: Build macOS wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          args: --release --locked --no-default-features --out dist --compatibility pypi

      - name: Ship libduckdb beside the executable
        shell: bash
        run: |
          set -euo pipefail
          # The manylinux container writes dist/ as root.
          if [ "$RUNNER_OS" = Linux ]; then sudo chown -R "$(id -u):$(id -g)" dist; fi
          uv run --script scripts/ship_libduckdb.py --library "$DUCKDB_LIBRARY" dist/*.whl

      - name: Prove the wheel ships the libduckdb it links
        shell: bash
        run: uv run --script scripts/check_duckdb_shipped.py dist/*.whl

      - name: Install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          environment="$RUNNER_TEMP/smoke"
          uv venv --python 3.12 "$environment"
          if [ -d "$environment/Scripts" ]; then
            bin="$environment/Scripts"
            python="$bin/python.exe"
          else
            bin="$environment/bin"
            python="$bin/python"
          fi
          uv pip install --python "$python" --quiet --only-binary :all: dist/*.whl
          mkdir -p "$RUNNER_TEMP/fixture"
          {
            echo '---'
            echo 'type: Note'
            echo '---'
            echo '# Note'
          } > "$RUNNER_TEMP/fixture/note.md"
          "$bin/okf-parser" --version
          "$bin/okf-parser" check "$RUNNER_TEMP/fixture"
          "$bin/okf-parser" search "$RUNNER_TEMP/fixture" note
          "$bin/okf-parser" sql "$RUNNER_TEMP/fixture" "SELECT concept_type FROM concepts"
          "$bin/okf-parser" duckdb "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/bundle.duckdb"
          # The wheel does not depend on duckdb; install it only to read the export back.
          uv pip install --python "$python" --quiet "duckdb>=1.4,<2"
          BUNDLE="$RUNNER_TEMP/bundle.duckdb" "$python" - <<'PY'
          import os
          import duckdb

          with duckdb.connect(os.environ["BUNDLE"], read_only=True) as connection:
              assert connection.sql("SELECT concept_type FROM okf.concepts").fetchone() == ("Note",)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  verify-sdist:
    name: Verify source distribution (cold consumer)
    # Start as soon as the sdist is ready, alongside the platform wheels.
    needs: [sdist]
    runs-on: ubuntu-latest
    env:
      # Never restore a native wheel, Cargo target or prebuilt DuckDB here.
      # This remains a true, locked from-source build with bundled DuckDB.
      MATURIN_PEP517_ARGS: --locked
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
          enable-cache: false

      - name: Download the exact sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: release/python

      - name: Install and exercise the source distribution
        shell: bash
        env:
          # Runner context is available only after the job has been assigned.
          CARGO_HOME: ${{ runner.temp }}/sdist-cargo
          CARGO_TARGET_DIR: ${{ runner.temp }}/sdist-target
          UV_CACHE_DIR: ${{ runner.temp }}/sdist-uv
        run: |
          set -euo pipefail
          expected_version=$(uv run --script scripts/project_version.py)
          artifact=$(find release/python -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$artifact"
          environment="$RUNNER_TEMP/python-sdist-consumer"
          uv venv --python 3.12 "$environment"
          uv pip install --no-cache --python "$environment/bin/python" "$artifact"
          EXPECTED_VERSION="$expected_version" "$environment/bin/python" -c 'import importlib.metadata, os; assert importlib.metadata.version("okf-parser") == os.environ["EXPECTED_VERSION"]'
          "$environment/bin/okf-parser" --help >/dev/null
          test -x "$environment/bin/okf-parser"
          mkdir "$environment/fixture"
          printf '%s\n' '---' 'type: Node' '---' '# Node' > "$environment/fixture/node.md"
          FIXTURE="$environment/fixture" "$environment/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from okf_parser import load_bundle
          from okf_parser.rust_core import resolve_rust_core

          executable = resolve_rust_core()
          if executable is None or executable.name not in {"okf-parser", "okf-parser.exe"}:
              raise SystemExit(f"bundled native engine was not selected: {executable}")
          bundle = load_bundle(Path(os.environ["FIXTURE"]))
          if bundle.markdown_count != 1:
              raise SystemExit(f"unexpected native bundle count: {bundle.markdown_count}")
          PY
          "$environment/bin/okf-parser" check "$environment/fixture" >/dev/null

  build-release-set:
    name: Build and verify release set
    needs: [wheels-linux, wheels-windows, wheels-macos, sdist, verify-sdist]
    runs-on: ubuntu-latest
    env:
      DRY_RUN_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}
    steps:
      - name: Check out immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Verify synchronized source contract
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--tag "$DRY_RUN_REF")
          fi
          uv run --script scripts/sync_versions.py --check
          uv run --script scripts/release_contract.py verify-source "${args[@]}"

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --all-groups --no-install-project
          npm ci --prefix typescript
          npm ci --prefix typescript-duckdb

      - name: Download built wheels and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheel-*"
          path: release/python
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: release/python

      - name: Build native npm and npm release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/npm release/native-npm native-npm-linux-x64/bin
          version=$(uv run --script scripts/project_version.py)
          wheel=$(find release/python -maxdepth 1 -type f -name "okf_parser-${version}-py3-none-manylinux*_x86_64.whl" -print -quit)
          test -n "$wheel"
          uv run --script scripts/native_from_wheel.py extract "$wheel" native-npm-linux-x64/bin/okf-core
          (cd native-npm-linux-x64 && npm pack --pack-destination ../release/native-npm --silent)
          (cd typescript && npm pack --pack-destination ../release/npm --silent)
          (cd typescript-duckdb && npm pack --pack-destination ../release/npm --silent)

      - name: Verify bundled Python native engine
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(uv run --script scripts/project_version.py)
          wheel_count=$(find release/python -maxdepth 1 -type f -name "okf_parser-${expected_version}-*.whl" | wc -l)
          test "$wheel_count" -eq 5
          uv run --script scripts/verify_wheel_scripts.py             release/python/okf_parser-"${expected_version}"-*.whl

      - name: Verify npm native companion artifact
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          native="release/native-npm/franklinbaldo-okf-parser-native-linux-x64-${expected_version}.tgz"
          test -f "$native"
          native_listing="$(tar -tzf "$native")"
          grep -qx 'package/bin/okf-core' <<<"$native_listing"
          grep -qx 'package/package.json' <<<"$native_listing"
          wheel=$(find release/python -maxdepth 1 -type f -name "okf_parser-${expected_version}-py3-none-manylinux*_x86_64.whl" -print -quit)
          uv run --script scripts/native_from_wheel.py verify "$wheel" "$native"

      - name: Generate immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          uv run --script scripts/release_contract.py build-manifest \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --ref "$DRY_RUN_REF" \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --uv-version "$(uv --version | awk '{print $2}')"

      - name: Verify host wheel as a consumer
        # Every platform already has its native smoke test. Keep the aggregate
        # host check; the independent cold sdist job is also required by needs.
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(uv run --script scripts/project_version.py)
          artifact=$(find release/python -maxdepth 1 -type f -name "okf_parser-${expected_version}-py3-none-manylinux*_x86_64.whl" -print -quit)
          test -n "$artifact"
          environment="$RUNNER_TEMP/python-wheel-consumer"
          uv venv --python 3.12 "$environment"
          uv pip install --python "$environment/bin/python" --only-binary :all: "$artifact"
          EXPECTED_VERSION="$expected_version" "$environment/bin/python" -c 'import importlib.metadata, os; assert importlib.metadata.version("okf-parser") == os.environ["EXPECTED_VERSION"]'
          "$environment/bin/okf-parser" --help >/dev/null
          test -x "$environment/bin/okf-parser"
          mkdir "$environment/fixture"
          printf '%s\n' '---' 'type: Node' '---' '# Node' > "$environment/fixture/node.md"
          FIXTURE="$environment/fixture" "$environment/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from okf_parser import load_bundle
          from okf_parser.rust_core import resolve_rust_core

          executable = resolve_rust_core()
          if executable is None or executable.name not in {"okf-parser", "okf-parser.exe"}:
              raise SystemExit(f"bundled native engine was not selected: {executable}")
          bundle = load_bundle(Path(os.environ["FIXTURE"]))
          if bundle.markdown_count != 1:
              raise SystemExit(f"unexpected native bundle count: {bundle.markdown_count}")
          PY
          "$environment/bin/okf-parser" check "$environment/fixture" >/dev/null

      - name: Verify main npm tarball with native companion
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/franklinbaldo-okf-parser-$expected_version.tgz"
          native_tarball="$GITHUB_WORKSPACE/release/native-npm/franklinbaldo-okf-parser-native-linux-x64-$expected_version.tgz"
          consumer="$RUNNER_TEMP/npm-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$native_tarball" "$parser_tarball" >/dev/null
          EXPECTED_VERSION="$expected_version" node --input-type=module -e 'import("@franklinbaldo/okf-parser").then(({ capabilityManifest }) => { if (capabilityManifest.protocol_version !== process.env.EXPECTED_VERSION) process.exit(1) })'
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          node --input-type=module - <<'JS'
          import { loadBundle, resolveRustCore } from "@franklinbaldo/okf-parser";
          const executable = resolveRustCore({ environment: { PATH: "" } });
          if (executable === undefined || !executable.includes("@franklinbaldo/okf-parser-native-linux-x64")) {
            throw new Error(`npm native companion was not selected: ${String(executable)}`);
          }
          const bundle = await loadBundle("knowledge");
          if (bundle.markdownCount !== 1) throw new Error(`unexpected native bundle count: ${String(bundle.markdownCount)}`);
          JS
          ./node_modules/.bin/okf-parser-ts --help >/dev/null
          mkdir format-fixture
          printf '# Heading\n\n-   item\n' > format-fixture/concept.md
          if ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null; then
            echo "installed formatter check unexpectedly succeeded before rewrite"
            exit 1
          fi
          ./node_modules/.bin/okf-parser-ts format format-fixture --write >/dev/null
          ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null
          grep -qx -- '- item' format-fixture/concept.md
          node "$GITHUB_WORKSPACE/typescript/scripts/smoke-mcp-stdio.mjs" ./node_modules/.bin/okf-parser-ts-mcp

      - name: Verify npm portable fallback without optional package
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/franklinbaldo-okf-parser-$expected_version.tgz"
          consumer="$RUNNER_TEMP/npm-portable-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=optional "$parser_tarball" >/dev/null
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          node --input-type=module - <<'JS'
          import { loadBundle, resolveRustCore } from "@franklinbaldo/okf-parser";
          if (resolveRustCore({ environment: { PATH: "" } }) !== undefined) throw new Error("portable install unexpectedly found Rust");
          const bundle = await loadBundle("knowledge", { engine: "native" });
          if (bundle.markdownCount !== 1) throw new Error("portable fallback failed");
          JS

      - name: Verify both npm tarballs together
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          parser_tarball="$GITHUB_WORKSPACE/release/npm/franklinbaldo-okf-parser-$expected_version.tgz"
          adapter_tarball="$GITHUB_WORKSPACE/release/npm/franklinbaldo-okf-parser-duckdb-$expected_version.tgz"
          consumer="$RUNNER_TEMP/duckdb-consumer"
          mkdir "$consumer"
          cd "$consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts --omit=optional "$parser_tarball" >/dev/null
          npm install --ignore-scripts "$adapter_tarball" >/dev/null
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          ./node_modules/.bin/okf-parser-ts-duckdb knowledge --database bundle.duckdb > report.json
          node --input-type=module -e 'import("@franklinbaldo/okf-parser-duckdb").then(async ({ exportDuckDb }) => { const result = await exportDuckDb("knowledge", { database: "second.duckdb" }); if (result.concept_count !== 1) process.exit(1) })'

      - name: Re-verify exact artifact bytes
        run: uv run --script scripts/release_contract.py verify-local --manifest release/manifest.json

      - name: Verify shipped package contents
        run: uv run --script scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Inspect public registry state
        run: uv run --script scripts/registry_state.py --manifest release/manifest.json --output release/registry-state.json

      - name: Write release summary
        shell: bash
        run: uv run --script scripts/release_summary.py --directory release >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
