name: Apply codebase lexical containment

on:
  push:
    branches:
      - feat/codebase-okf-dependency-observation

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/codebase-okf-dependency-observation
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --frozen --all-groups
      - name: Apply containment contract
        shell: bash
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          generator = "skills/codebase-to-okf/scripts/python_codebase_to_okf.py"
          replace(
              generator,
              '''def _symbol_body(\n    symbol: Symbol,\n    module_path: str,\n    module_file: str,\n    parent_file: str | None,\n) -> str:\n''',
              '''def _symbol_body(\n    symbol: Symbol,\n    module_path: str,\n    module_file: str,\n    parent_file: str | None,\n    children: tuple[tuple[Symbol, str], ...],\n) -> str:\n''',
          )
          replace(
              generator,
              '''    if parent_file is not None and symbol.parent_qualname is not None:\n        body.extend(["", f"Parent: [{symbol.parent_qualname}](../symbols/{parent_file})."])\n    if symbol.docstring:\n''',
              '''    if parent_file is not None and symbol.parent_qualname is not None:\n        body.extend(["", f"Parent: [{symbol.parent_qualname}](../symbols/{parent_file})."])\n    if children:\n        body.extend(["", "## Lexical children", ""])\n        body.extend(\n            f"- [{child.qualname}](../symbols/{child_file}) — {child.kind}"\n            for child, child_file in children\n        )\n    if symbol.docstring:\n''',
          )
          replace(
              generator,
              '''    index_lines = [\n        "# Codebase OKF projection",\n''',
              '''    children_by_parent: dict[tuple[str, str, int], list[Symbol]] = {}\n    for module in modules:\n        for symbol in module.symbols:\n            if symbol.parent_qualname is None or symbol.parent_line_start is None:\n                continue\n            key = (module.source_path, symbol.parent_qualname, symbol.parent_line_start)\n            children_by_parent.setdefault(key, []).append(symbol)\n\n    index_lines = [\n        "# Codebase OKF projection",\n''',
          )
          replace(
              generator,
              '''            if symbol.parent_qualname and symbol.parent_line_start is not None:\n                parent_file = symbol_files.get(\n                    (\n                        module.source_path,\n                        symbol.parent_qualname,\n                        symbol.parent_line_start,\n                    )\n                )\n            fields: dict[str, str | list[str]] = {\n''',
              '''            if symbol.parent_qualname and symbol.parent_line_start is not None:\n                parent_file = symbol_files.get(\n                    (\n                        module.source_path,\n                        symbol.parent_qualname,\n                        symbol.parent_line_start,\n                    )\n                )\n            child_symbols = tuple(\n                (\n                    child,\n                    symbol_files[(module.source_path, child.qualname, child.line_start)],\n                )\n                for child in children_by_parent.get(\n                    (module.source_path, symbol.qualname, symbol.line_start),\n                    []\n                )\n            )\n            fields: dict[str, str | list[str]] = {\n''',
          )
          replace(
              generator,
              '''                "generated_by": "codebase-to-okf",\n            }\n            if symbol.decorators:\n''',
              '''                "generated_by": "codebase-to-okf",\n            }\n            if (\n                parent_file is not None\n                and symbol.parent_qualname is not None\n                and symbol.parent_line_start is not None\n            ):\n                fields["parent_qualname"] = symbol.parent_qualname\n                fields["parent_line_start"] = str(symbol.parent_line_start)\n                fields["parent_symbol"] = f"symbols/{parent_file}"\n            if child_symbols:\n                fields["child_qualnames"] = [child.qualname for child, _ in child_symbols]\n                fields["child_symbols"] = [\n                    f"symbols/{child_file}" for _, child_file in child_symbols\n                ]\n            if symbol.decorators:\n''',
          )
          replace(
              generator,
              '''                    parent_file,\n                ),\n''',
              '''                    parent_file,\n                    child_symbols,\n                ),\n''',
          )

          query = "skills/codebase-to-okf/scripts/query_codebase_okf.py"
          replace(
              query,
              '''    for key, value in filters.items():\n        if value and not _contains(row.get(key), value):\n            return False\n\n    if not args.query:\n''',
              '''    for key, value in filters.items():\n        if value and not _contains(row.get(key), value):\n            return False\n    if args.parent and str(row.get("parent_qualname") or "").casefold() != args.parent.casefold():\n        return False\n\n    if not args.query:\n''',
          )
          replace(
              query,
              '''        "qualname",\n        "signature",\n''',
              '''        "qualname",\n        "parent_qualname",\n        "child_qualnames",\n        "signature",\n''',
          )
          replace(
              query,
              '''        "qualname",\n        "source_path",\n''',
              '''        "qualname",\n        "parent_qualname",\n        "parent_line_start",\n        "parent_symbol",\n        "child_qualnames",\n        "child_symbols",\n        "source_path",\n''',
          )
          replace(
              query,
              '''    parser.add_argument("--name", help="filter by symbol or project name")\n    parser.add_argument("--caller", help="filter call observations by caller")\n''',
              '''    parser.add_argument("--name", help="filter by symbol or project name")\n    parser.add_argument(\n        "--parent",\n        help="filter symbols by exact immediate lexical parent qualified name",\n    )\n    parser.add_argument("--caller", help="filter call observations by caller")\n''',
          )

          finalizer = "skills/codebase-to-okf/scripts/finalize_codebase_okf.py"
          containment_bullets = '''- `parent_qualname`, `parent_line_start`, `parent_symbol` — optional immediate lexical parent\n  identity and generated concept path; the line component disambiguates same-name redefinitions.\n- `child_qualnames`, `child_symbols` — optional immediate lexical children in source order.\n'''
          replace(
              finalizer,
              '''- `fields` — optional names of direct class-body assignments.\n""",\n''',
              '''- `fields` — optional names of direct class-body assignments.\n''' + containment_bullets + '''\nLexical containment is syntax evidence. It does not assert inheritance ownership, descriptor\nbinding, runtime reachability, or dispatch.\n""",\n''',
          )
          replace(
              finalizer,
              '''- `calls_raw` — optional call expressions observed directly in the function body; these are not\n  resolved dispatch edges.\n""",\n''',
              '''- `calls_raw` — optional call expressions observed directly in the function body; these are not\n  resolved dispatch edges.\n''' + containment_bullets + '''\nContainment is immediate and lexical only; it is not a runtime ownership or reachability claim.\n""",\n''',
          )
          replace(
              finalizer,
              '''- `calls_raw` — optional call expressions observed directly in the method body; these are not\n  resolved dispatch edges.\n""",\n''',
              '''- `calls_raw` — optional call expressions observed directly in the method body; these are not\n  resolved dispatch edges.\n''' + containment_bullets + '''\nContainment is immediate and lexical only; it does not strengthen method dispatch semantics.\n""",\n''',
          )

          skill = "skills/codebase-to-okf/SKILL.md"
          replace(
              skill,
              '''## Resolve local imports conservatively\n''',
              '''## Navigate lexical containment\n\nSymbol concepts preserve immediate lexical containment in both directions. A child records its\n`parent_qualname`, parent definition line, and generated `parent_symbol` path; a parent records\n`child_qualnames` and `child_symbols` in source order. Same-name redefinitions remain distinct\nbecause relation identity includes the definition line and generated path.\n\nQuery a class's immediate methods/nested definitions without reopening source:\n\n```bash\nuv run skills/codebase-to-okf/scripts/query_codebase_okf.py \\\n  ./.derived/codebase-okf --parent Greeter\n```\n\n`--parent` is an exact immediate-parent filter. These relations describe lexical nesting only; they\ndo not claim inheritance ownership, runtime reachability, descriptor binding, or call dispatch.\n\n## Resolve local imports conservatively\n''',
          )
          PY

          cat > tests/test_codebase_to_okf_containment.py <<'PYTEST'
          """Contract for explicit lexical containment in codebase-to-OKF projections."""

          from __future__ import annotations

          import json
          import subprocess
          import sys
          from pathlib import Path

          from okf_parser import validate_path

          SKILL_ROOT = Path(__file__).parents[1] / "skills" / "codebase-to-okf"
          ONE_SHOT = SKILL_ROOT / "scripts" / "codebase_to_okf.py"
          QUERY = SKILL_ROOT / "scripts" / "query_codebase_okf.py"
          SPEC_TEMPLATE = "docs/types/{slug}.md"


          def _run(script: Path, *args: object) -> subprocess.CompletedProcess[str]:
              return subprocess.run(  # noqa: S603
                  [sys.executable, str(script), *(str(item) for item in args)],
                  check=False,
                  capture_output=True,
                  text=True,
              )


          def _snapshot(root: Path) -> dict[str, bytes]:
              return {
                  path.relative_to(root).as_posix(): path.read_bytes()
                  for path in sorted(root.rglob("*"))
                  if path.is_file()
              }


          def _query(bundle: Path, *args: str) -> list[dict[str, object]]:
              result = _run(QUERY, bundle, *args)
              assert result.returncode == 0, result.stderr
              payload = json.loads(result.stdout)
              assert isinstance(payload, list)
              return payload


          def test_projection_exposes_bidirectional_immediate_lexical_containment(tmp_path: Path) -> None:
              source = tmp_path / "source"
              output = tmp_path / "bundle"
              source.mkdir()
              (source / "app.py").write_text(
                  '''class Greeter:\n    def hello(self, name: str) -> str:\n        def normalize(value: str) -> str:\n            return value.strip()\n\n        return normalize(name)\n''',
                  encoding="utf-8",
              )

              generated = _run(ONE_SHOT, source, output)
              assert generated.returncode == 0, generated.stderr
              assert validate_path(
                  output,
                  require_spec=SPEC_TEMPLATE,
                  normative_spec=True,
              ).is_conformant

              greeter = _query(output, "--name", "Greeter")
              assert len(greeter) == 1
              class_row = greeter[0]
              assert class_row["type"] == "CodeClass"
              assert class_row["child_qualnames"] == ["Greeter.hello"]
              assert len(class_row["child_symbols"]) == 1

              methods = _query(output, "--parent", "Greeter")
              assert len(methods) == 1
              method_row = methods[0]
              assert method_row["type"] == "CodeMethod"
              assert method_row["qualname"] == "Greeter.hello"
              assert method_row["parent_qualname"] == "Greeter"
              assert method_row["parent_line_start"] == "1"
              assert method_row["parent_symbol"] == class_row["path"]
              assert method_row["child_qualnames"] == ["Greeter.hello.normalize"]

              nested = _query(output, "--parent", "Greeter.hello")
              assert len(nested) == 1
              nested_row = nested[0]
              assert nested_row["type"] == "CodeFunction"
              assert nested_row["qualname"] == "Greeter.hello.normalize"
              assert nested_row["parent_symbol"] == method_row["path"]
              assert "child_qualnames" not in nested_row

              class_text = (output / str(class_row["path"])).read_text(encoding="utf-8")
              method_text = (output / str(method_row["path"])).read_text(encoding="utf-8")
              assert Path(str(method_row["path"])).name in class_text
              assert Path(str(class_row["path"])).name in method_text

              before = _snapshot(output)
              repeated = _run(ONE_SHOT, source, output, "--force")
              assert repeated.returncode == 0, repeated.stderr
              assert _snapshot(output) == before
          PYTEST

          cat > changelog/0.45.4/codebase-to-okf-lexical-containment.md <<'NOTE'
          ---
          type: Release Note
          title: expose lexical containment in codebase OKF
          ---

          - Add immediate bidirectional lexical-containment metadata to projected classes, functions, and methods, including definition-line and generated-path identity so same-name redefinitions remain distinct.
          - Add exact `--parent` lookup so agents can retrieve the immediate children of a class or callable without reopening source.
          - Keep containment explicitly syntax-level: it does not claim runtime ownership, inheritance, reachability, descriptor binding, or call dispatch.
          NOTE

      - name: Format and verify focused contract
        shell: bash
        run: |
          uv run ruff format \
            skills/codebase-to-okf/scripts/python_codebase_to_okf.py \
            skills/codebase-to-okf/scripts/query_codebase_okf.py \
            skills/codebase-to-okf/scripts/finalize_codebase_okf.py \
            tests/test_codebase_to_okf_containment.py
          uv run ruff check \
            skills/codebase-to-okf/scripts/python_codebase_to_okf.py \
            skills/codebase-to-okf/scripts/query_codebase_okf.py \
            skills/codebase-to-okf/scripts/finalize_codebase_okf.py \
            tests/test_codebase_to_okf_containment.py
          uv run pytest \
            tests/test_codebase_to_okf_containment.py \
            tests/test_codebase_to_okf_skill.py \
            tests/test_codebase_to_okf_one_shot.py \
            tests/test_codebase_to_okf_project_manifest.py
          uv run okf-parser check . --require-spec 'docs/types/{slug}.md' --normative-spec
      - name: Commit result and remove helper
        shell: bash
        run: |
          rm .github/workflows/_apply-codebase-containment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(skill): expose lexical containment in codebase OKF'
          git push origin HEAD:feat/codebase-okf-dependency-observation
