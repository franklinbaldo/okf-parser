name: Apply OKF init

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  init:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/codebase-to-okf-skill'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/codebase-to-okf-skill
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          python-version: '3.12'
      - name: Install locked repository
        run: uv sync --frozen --all-groups
      - name: Run canonical OKF init and commit result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from importlib.metadata import version
          print('repository okf-parser version:', version('okf-parser'))
          PY
          sed -i 's/okf-parser>=0\.45\.2,<0\.46/okf-parser>=0.45.4,<0.46/g' \
            skills/codebase-to-okf/scripts/python_codebase_to_okf.py \
            skills/codebase-to-okf/scripts/query_codebase_okf.py \
            tests/test_codebase_to_okf_skill.py
          uv run okf-parser init . --spec-template 'docs/types/{slug}.md'
          uv run okf-parser init . --spec-template 'docs/types/{slug}.md' --write
          uv run okf-parser check . --require-spec 'docs/types/{slug}.md' --normative-spec
          uv run ruff format skills/codebase-to-okf/scripts/python_codebase_to_okf.py skills/codebase-to-okf/scripts/query_codebase_okf.py tests/test_codebase_to_okf_skill.py
          uv run ruff check skills/codebase-to-okf/scripts/python_codebase_to_okf.py skills/codebase-to-okf/scripts/query_codebase_okf.py tests/test_codebase_to_okf_skill.py
          git rm .github/workflows/apply-okf-init.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/types skills/codebase-to-okf/scripts tests/test_codebase_to_okf_skill.py
          git commit -m 'fix(skill): scaffold Skill spec with okf-parser init'
          git push origin HEAD:feat/codebase-to-okf-skill
