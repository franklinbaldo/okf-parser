name: DuckDB Rust extension

on:
  pull_request:
    paths:
      - "duckdb-extension/**"
      - "okf-engine/**"
      - ".github/workflows/duckdb-extension.yml"
      - "Cargo.toml"
  push:
    branches: [main]
    paths:
      - "duckdb-extension/**"
      - "okf-engine/**"
      - ".github/workflows/duckdb-extension.yml"
      - "Cargo.toml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path duckdb-extension/Cargo.toml --check
      - name: Check loadable extension crate
        run: cargo check --manifest-path duckdb-extension/Cargo.toml
      - name: Pin DuckDB extension build tooling
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/duckdb/extension-ci-tools.git duckdb-extension/extension-ci-tools
          git -C duckdb-extension/extension-ci-tools checkout --detach a285602bf745d6ceaa704b5df47f08b00ca296ae
      - name: Build loadable development artifact
        run: make -C duckdb-extension configure debug
      - name: Load artifact in stock DuckDB and query full read surface
        shell: bash
        run: |
          duckdb-extension/configure/venv/bin/python - <<'PY'
          import pathlib
          import shutil
          import tempfile

          import duckdb

          source_root = pathlib.Path("duckdb-extension/test/knowledge").resolve()
          temporary = tempfile.TemporaryDirectory(prefix="okf-duckdb-read-surface-")
          root = pathlib.Path(temporary.name)
          shutil.copytree(source_root, root, dirs_exist_ok=True)
          (root / "bad.md").write_text("# Missing frontmatter\n", encoding="utf-8")
          with (root / "node.md").open("a", encoding="utf-8") as handle:
              handle.write("\n[Missing](missing.md)\n")

          extension = pathlib.Path("duckdb-extension/build/debug/okf.duckdb_extension").resolve()
          assert extension.is_file() and extension.stat().st_size > 0

          con = duckdb.connect(config={"allow_unsigned_extensions": "true"})
          con.execute(f"LOAD '{extension.as_posix()}'")

          concepts = con.execute(
              "SELECT concept_id, concept_type, title FROM okf_concepts(?)",
              [str(root)],
          ).fetchall()
          assert concepts == [("node", "Documentation", "Example node")], concepts

          links = con.execute(
              "SELECT source_id, raw_target, target_id, exists FROM okf_links(?)",
              [str(root)],
          ).fetchall()
          assert links == [("node", "missing.md", None, False)], links

          reserved = con.execute(
              "SELECT path, filename FROM okf_reserved(?)",
              [str(root)],
          ).fetchall()
          assert reserved == [("index.md", "index.md")], reserved

          diagnostics = con.execute(
              "SELECT path, severity FROM okf_diagnostics(?) ORDER BY path, severity",
              [str(root)],
          ).fetchall()
          assert diagnostics == [("bad.md", "error"), ("node.md", "warning")], diagnostics
          temporary.cleanup()
          PY
