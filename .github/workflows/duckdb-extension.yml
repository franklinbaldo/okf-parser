name: DuckDB Rust extension

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/duckdb-okf-concepts-115
          fetch-depth: 2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Synchronize 0.39.2 and generated locks
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^version = "0.39.2"$' pyproject.toml; then
            echo '0.39.2 already synchronized'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('pyproject.toml'): [('version = "0.39.1"', 'version = "0.39.2"', 1)],
              Path('typescript/package.json'): [('"version": "0.39.1"', '"version": "0.39.2"', 1)],
              Path('typescript-duckdb/package.json'): [
                  ('"version": "0.39.1"', '"version": "0.39.2"', 1),
                  ('"okf-parser": "^0.39.1"', '"okf-parser": "^0.39.2"', 1),
              ],
              Path('typescript/src/version.ts'): [('"0.39.1"', '"0.39.2"', 1)],
              Path('README.md'): [('franklinbaldo/okf-parser@v0.39.1', 'franklinbaldo/okf-parser@v0.39.2', 1)],
          }
          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new, count in edits:
                  if text.count(old) < count:
                      raise SystemExit(f'{path}: missing {old!r}')
                  text = text.replace(old, new, count)
              path.write_text(text, encoding='utf-8')

          extension_readme = Path('duckdb-extension/README.md')
          text = extension_readme.read_text(encoding='utf-8')
          if not text.startswith('---\n'):
              extension_readme.write_text(
                  '---\ntype: Documentation\ntitle: OKF DuckDB extension\n---\n\n' + text,
                  encoding='utf-8',
              )

          Path('changelog/0.39.2.md').write_text('''---
type: Release
title: okf-parser 0.39.2
---

# okf-parser 0.39.2

- adds the first experimental Rust loadable DuckDB extension slice through the C Extension API;
- exposes `okf_concepts(root)` with canonical `okf-engine` semantics and direct DuckDB data chunks;
- builds a real `.duckdb_extension` with pinned DuckDB tooling and proves it loads in DuckDB 1.5.4;
- keeps the experimental DuckDB crate outside the stable root workspace release graph.
''', encoding='utf-8')
          PY
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          git show HEAD^:.github/workflows/duckdb-extension.yml > .github/workflows/duckdb-extension.yml
          rm -f .github/workflows/tmp-sync-0392.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: synchronize 0.39.2 release metadata'
          git push origin HEAD:feat/duckdb-okf-concepts-115

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --manifest-path duckdb-extension/Cargo.toml --check
      - name: Check loadable extension crate
        run: cargo check --manifest-path duckdb-extension/Cargo.toml
      - name: Pin DuckDB extension build tooling
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/duckdb/extension-ci-tools.git duckdb-extension/extension-ci-tools
          git -C duckdb-extension/extension-ci-tools checkout --detach a285602bf745d6ceaa704b5df47f08b00ca296ae
      - name: Build loadable development artifact
        run: make -C duckdb-extension configure debug
      - name: Load artifact in stock DuckDB and query concepts
        shell: bash
        run: |
          duckdb-extension/configure/venv/bin/python - <<'PY'
          import pathlib
          import duckdb

          root = pathlib.Path("duckdb-extension/test/knowledge").resolve()
          extension = pathlib.Path("duckdb-extension/build/debug/okf.duckdb_extension").resolve()
          assert extension.is_file() and extension.stat().st_size > 0
          con = duckdb.connect(config={"allow_unsigned_extensions": "true"})
          con.execute(f"LOAD '{extension.as_posix()}'")
          rows = con.execute(
              "SELECT concept_id, concept_type, title FROM okf_concepts(?)",
              [str(root)],
          ).fetchall()
          assert rows == [("node", "Node", "Example node")], rows
          PY
