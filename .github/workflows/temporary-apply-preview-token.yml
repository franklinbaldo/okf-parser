name: Temporary apply preview token

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync --frozen
      - name: Add opaque reviewed-preview token to apply
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one marker, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/okf_parser/apply.py')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              'from __future__ import annotations\n\n',
              'from __future__ import annotations\n\nimport hashlib\n',
              'hashlib import',
          )
          text = replace_once(
              text,
              'from typing import TYPE_CHECKING, cast\n',
              'from typing import TYPE_CHECKING, Protocol, cast\n',
              'Protocol import',
          )
          old_write_import = (
              'from okf_parser.write_support import (\n'
              '    ConceptSnapshot as _Concept,\n'
              '    WriteResult as ApplyResult,\n'
              '    WriteSupportError,\n'
              '    snapshot_bundle as _snapshot_bundle,\n'
              '    stage_validate_write as _stage_validate_write,\n'
              ')\n'
          )
          new_write_import = (
              'from okf_parser.write_support import (\n'
              '    BundleSnapshot,\n'
              '    CandidateDocuments,\n'
              '    ConceptSnapshot as _Concept,\n'
              '    WriteResult,\n'
              '    WriteSupportError,\n'
              '    snapshot_bundle as _snapshot_bundle,\n'
              '    stage_validate_write as _stage_validate_write,\n'
              ')\n'
          )
          text = replace_once(text, old_write_import, new_write_import, 'write-support imports')

          apply_error = (
              'class ApplyError(ValueError):\n'
              '    """Raised when `--sql` is malformed or a script violates the v1 contract."""\n\n\n'
          )
          result_class = apply_error + (
              '@dataclass(frozen=True, slots=True)\n'
              'class ApplyResult(WriteResult):\n'
              '    """RFC 0005 result plus an opaque exact-candidate preview token."""\n\n'
              '    preview_token: str | None = None\n\n'
              '    def to_dict(self) -> dict[str, object]:\n'
              '        """Return the stable write result with preview identity when available."""\n'
              '        payload = super().to_dict()\n'
              '        if self.preview_token is not None:\n'
              '            payload["preview_token"] = self.preview_token\n'
              '        return payload\n\n\n'
              'class _PreviewHasher(Protocol):\n'
              '    def update(self, data: bytes, /) -> object:\n'
              '        """Feed bytes into a hash implementation."""\n\n\n'
              'def _feed_preview_token(hasher: _PreviewHasher, value: bytes) -> None:\n'
              '    """Length-frame one byte string so concatenation cannot collide structurally."""\n'
              '    hasher.update(len(value).to_bytes(8, "big"))\n'
              '    hasher.update(value)\n\n\n'
              'def _apply_preview_token(\n'
              '    snapshot: BundleSnapshot,\n'
              '    sql: str,\n'
              '    candidates: CandidateDocuments,\n'
              '    exclude: Sequence[str],\n'
              '    spec_template: str | None,\n'
              ') -> str:\n'
              '    """Commit to the invocation baseline and exact candidate document state."""\n'
              '    hasher = hashlib.sha256()\n'
              '    _feed_preview_token(hasher, b"okf-apply-preview-v1")\n'
              '    _feed_preview_token(hasher, sql.encode("utf-8"))\n'
              '    _feed_preview_token(hasher, (spec_template or "").encode("utf-8"))\n'
              '    for rule in exclude:\n'
              '        _feed_preview_token(hasher, rule.encode("utf-8"))\n'
              '    for relative, (size, mtime_ns) in sorted(snapshot.manifest.items()):\n'
              '        _feed_preview_token(hasher, relative.encode("utf-8"))\n'
              '        _feed_preview_token(hasher, str(size).encode("ascii"))\n'
              '        _feed_preview_token(hasher, str(mtime_ns).encode("ascii"))\n'
              '    for relative, (raw, frontmatter_text, _) in sorted(candidates.items()):\n'
              '        _feed_preview_token(hasher, relative.encode("utf-8"))\n'
              '        _feed_preview_token(hasher, raw.bom)\n'
              '        _feed_preview_token(hasher, b"1" if raw.crlf else b"0")\n'
              '        _feed_preview_token(hasher, frontmatter_text.encode("utf-8"))\n'
              '        _feed_preview_token(hasher, raw.body_text.encode("utf-8"))\n'
              '    return f"okf-apply-preview-v1-sha256:{hasher.hexdigest()}"\n\n\n'
              'def _preview_mismatch_result(\n'
              '    changed_paths: Sequence[str],\n'
              '    preview_token: str,\n'
              ') -> dict[str, object]:\n'
              '    return ApplyResult(\n'
              '        changed_paths=tuple(sorted(changed_paths)),\n'
              '        succeeded=False,\n'
              '        written=False,\n'
              '        conflict_paths=tuple(sorted(changed_paths)),\n'
              '        error="apply candidate no longer matches the reviewed preview",\n'
              '        preview_token=preview_token,\n'
              '    ).to_dict()\n\n\n'
          )
          text = replace_once(text, apply_error, result_class, 'ApplyResult/token helpers')

          old_signature = (
              'def apply_bundle(  # each argument is an independent public CLI flag.\n'
              '    path: str,\n'
              '    *,\n'
              '    sql: str | None = None,\n'
              '    type_name: str | None = None,\n'
              '    field_name: str | None = None,\n'
              '    from_value: str | None = None,\n'
              '    to_value: str | None = None,\n'
              '    write: bool = False,\n'
              '    exclude: Sequence[str] = (),\n'
              '    spec_template: str | None = None,\n'
              ') -> dict[str, object]:\n'
          )
          new_signature = old_signature.replace(
              '    write: bool = False,\n',
              '    write: bool = False,\n    expected_preview_token: str | None = None,\n',
          )
          text = replace_once(text, old_signature, new_signature, 'apply_bundle signature')

          old_noop = (
              '    if outcome.touched_type is None or not outcome.row_diffs:\n'
              '        return ApplyResult().to_dict()\n\n'
          )
          new_noop = (
              '    if outcome.touched_type is None or not outcome.row_diffs:\n'
              '        preview_token = _apply_preview_token(\n'
              '            snapshot, sql, {}, exclude, spec_template\n'
              '        )\n'
              '        if expected_preview_token is not None and expected_preview_token != preview_token:\n'
              '            return _preview_mismatch_result((), preview_token)\n'
              '        return ApplyResult(preview_token=preview_token).to_dict()\n\n'
          )
          text = replace_once(text, old_noop, new_noop, 'no-op token path')

          old_preview_write = (
              '    if skipped_paths:\n'
              '        return ApplyResult(\n'
              '            skipped_paths=tuple(sorted(skipped_paths)),\n'
              '            succeeded=False,\n'
              '            error="one or more matched documents cannot round-trip losslessly",\n'
              '        ).to_dict()\n\n'
              '    if not write:\n'
              '        return ApplyResult(changed_paths=tuple(sorted(changed_paths))).to_dict()\n\n'
              '    touched_hashes = {rel: content_hashes[rel] for rel in candidates}\n'
              '    return _stage_validate_write(\n'
              '        root,\n'
              '        exclude,\n'
              '        candidates,\n'
              '        baseline_keys,\n'
              '        changed_paths,\n'
              '        touched_hashes,\n'
              '        snapshot.manifest,\n'
              '        conflict_error="the bundle changed since apply validated it",\n'
              '        temp_prefix="okf-apply-",\n'
              '    )\n'
          )
          new_preview_write = (
              '    if skipped_paths:\n'
              '        return ApplyResult(\n'
              '            skipped_paths=tuple(sorted(skipped_paths)),\n'
              '            succeeded=False,\n'
              '            error="one or more matched documents cannot round-trip losslessly",\n'
              '        ).to_dict()\n\n'
              '    preview_token = _apply_preview_token(\n'
              '        snapshot, sql, candidates, exclude, spec_template\n'
              '    )\n'
              '    if expected_preview_token is not None and expected_preview_token != preview_token:\n'
              '        return _preview_mismatch_result(changed_paths, preview_token)\n\n'
              '    if not write:\n'
              '        return ApplyResult(\n'
              '            changed_paths=tuple(sorted(changed_paths)),\n'
              '            preview_token=preview_token,\n'
              '        ).to_dict()\n\n'
              '    touched_hashes = {rel: content_hashes[rel] for rel in candidates}\n'
              '    write_result = _stage_validate_write(\n'
              '        root,\n'
              '        exclude,\n'
              '        candidates,\n'
              '        baseline_keys,\n'
              '        changed_paths,\n'
              '        touched_hashes,\n'
              '        snapshot.manifest,\n'
              '        conflict_error="the bundle changed since apply validated it",\n'
              '        temp_prefix="okf-apply-",\n'
              '    )\n'
              '    write_result["preview_token"] = preview_token\n'
              '    return write_result\n'
          )
          text = replace_once(text, old_preview_write, new_preview_write, 'preview/write token path')
          path.write_text(text, encoding='utf-8')

          service_path = Path('src/okf_parser/service.py')
          service = service_path.read_text(encoding='utf-8')
          old_service = (
              'def apply_bundle(  # each argument is an independent public CLI flag.\n'
              '    path: str,\n'
              '    *,\n'
              '    sql: str | None = None,\n'
              '    type_name: str | None = None,\n'
              '    field_name: str | None = None,\n'
              '    from_value: str | None = None,\n'
              '    to_value: str | None = None,\n'
              '    write: bool = False,\n'
              '    exclude: Sequence[str] = (),\n'
              '    spec_template: str | None = None,\n'
              ') -> dict[str, object]:\n'
          )
          new_service = old_service.replace(
              '    write: bool = False,\n',
              '    write: bool = False,\n    expected_preview_token: str | None = None,\n',
          )
          service = replace_once(service, old_service, new_service, 'service signature')
          old_forward = (
              '        write=write,\n'
              '        exclude=exclude,\n'
              '        spec_template=spec_template,\n'
          )
          new_forward = (
              '        write=write,\n'
              '        expected_preview_token=expected_preview_token,\n'
              '        exclude=exclude,\n'
              '        spec_template=spec_template,\n'
          )
          service = replace_once(service, old_forward, new_forward, 'service forwarding')
          service_path.write_text(service, encoding='utf-8')
          PY
      - name: Canonicalize and test Python contract
        run: |
          uv run ruff check --fix src/okf_parser/apply.py src/okf_parser/service.py tests/test_apply_preview_token.py
          uv run ruff format src/okf_parser/apply.py src/okf_parser/service.py tests/test_apply_preview_token.py
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run ty check src tests
          uv run vulture src tests --min-confidence 100
          uv run pytest -q
      - name: Commit clean implementation
        run: |
          git rm -f .github/workflows/temporary-apply-preview-token.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/okf_parser/apply.py src/okf_parser/service.py tests/test_apply_preview_token.py
          git commit -m 'feat(apply): bind write to reviewed preview candidate'
          git push
