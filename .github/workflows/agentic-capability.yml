name: Agentic capability benchmark

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "BenchmarkTask ids, comma-separated, or all"
        required: true
        default: all
      tools:
        description: "Rival titles, comma-separated, or all (baseline-none always runs first when selected)"
        required: true
        default: all
      repetitions:
        description: "Independent repetitions per task/tool (1-3)"
        required: true
        default: "1"
      model:
        description: "OpenRouter model id used identically for every trial"
        required: true
        default: openai/gpt-5.6-terra
      timeout_seconds:
        description: "Wall-clock budget for each individual agent trial"
        required: true
        default: "180"

permissions:
  contents: read

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install repository environment
        run: uv sync --frozen

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pinned Cline harness
        run: npm install -g cline@3.0.60

      - name: Record fixed harness version
        run: cline --version

      - name: Run serial benchmark round
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASKS: ${{ inputs.tasks }}
          TOOLS: ${{ inputs.tools }}
          REPETITIONS: ${{ inputs.repetitions }}
          MODEL: ${{ inputs.model }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::error::Configure the repository Actions secret OPENROUTER_API_KEY before running this benchmark."
            exit 2
          fi

          uv run python benchmarks/agentic/run.py \
            --tasks "$TASKS" \
            --tools "$TOOLS" \
            --repetitions "$REPETITIONS" \
            --model "$MODEL" \
            --timeout "$TIMEOUT_SECONDS" \
            --output "$RUNNER_TEMP/agentic-results"

      - name: Validate generated BenchmarkRun bundle
        if: always()
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/agentic-results/okf" ]]; then
            uv run okf-parser check "$RUNNER_TEMP/agentic-results/okf"
          fi

      - name: Upload canonical OKF run evidence and raw artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-round-${{ github.run_id }}
          path: ${{ runner.temp }}/agentic-results/
          if-no-files-found: warn
          retention-days: 90
