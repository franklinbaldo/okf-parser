name: Agentic capability benchmark

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Task ids, comma-separated, or all"
        required: true
        default: all
      tools:
        description: "Tool ids, comma-separated, or all (includes baseline-none)"
        required: true
        default: all
      harnesses:
        description: "Harness ids, comma-separated, or all"
        required: true
        default: all
      repetitions:
        description: "Independent repetitions per task/tool/harness (1-10)"
        required: true
        default: "1"
      model:
        description: "OpenRouter model id"
        required: true
        default: openai/gpt-5.6-terra
      timeout_seconds:
        description: "Wall-clock budget for each individual trial"
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tools: ${{ steps.plan.outputs.tools }}
      repetitions: ${{ steps.plan.outputs.repetitions }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: plan
        name: Validate selections and build bounded matrix
        shell: bash
        env:
          TASKS: ${{ inputs.tasks }}
          TOOLS: ${{ inputs.tools }}
          HARNESSES: ${{ inputs.harnesses }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          common=(--tasks "$TASKS" --tools "$TOOLS" --harnesses "$HARNESSES" --repetitions "$REPETITIONS")
          matrix=$(python benchmarks/agentic/build_matrix.py "${common[@]}" --mode matrix)
          tools=$(python benchmarks/agentic/build_matrix.py "${common[@]}" --mode tools)
          repetitions=$(python benchmarks/agentic/build_matrix.py "${common[@]}" --mode repetitions)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'tools=%s\n' "$tools" >> "$GITHUB_OUTPUT"
          printf 'repetitions=%s\n' "$repetitions" >> "$GITHUB_OUTPUT"
          echo "$matrix" | python -m json.tool
          echo "$tools" | python -m json.tool

  trial:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.task }} / ${{ matrix.harness }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install selected harness
        shell: bash
        env:
          HARNESS: ${{ matrix.harness }}
        run: bash benchmarks/agentic/install_harness.sh "$HARNESS"

      - name: Resolve OpenRouter credential for Ori
        if: startsWith(matrix.harness, 'ori-')
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          ori auth >/dev/null

      - name: Run isolated tool trials
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASK: ${{ matrix.task }}
          HARNESS: ${{ matrix.harness }}
          MODEL: ${{ inputs.model }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          TOOLS_JSON: ${{ needs.plan.outputs.tools }}
          REPETITIONS: ${{ needs.plan.outputs.repetitions }}
        run: |
          set -euo pipefail
          mkdir -p trial-results
          mapfile -t tools < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["TOOLS_JSON"])))')
          for tool in "${tools[@]}"; do
            for repetition in $(seq 1 "$REPETITIONS"); do
              out="trial-results/${TASK}__${tool}__${HARNESS}__${repetition}.jsonl"
              python benchmarks/agentic/run_trial.py \
                --task "$TASK" \
                --tool "$tool" \
                --harness "$HARNESS" \
                --model "$MODEL" \
                --repetition "$repetition" \
                --timeout "$TIMEOUT_SECONDS" \
                --output "$out"
            done
          done

      - name: Upload raw trial evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-${{ matrix.task }}-${{ matrix.harness }}
          path: trial-results/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    if: always()
    needs: [plan, trial]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all trial evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: agentic-*
          path: downloaded-results

      - name: Aggregate JSONL and Markdown report
        run: |
          python benchmarks/agentic/aggregate.py downloaded-results \
            --jsonl published/agentic-runs.jsonl \
            --markdown published/agentic-summary.md

      - name: Upload aggregated round
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-round-${{ github.run_id }}
          path: published/
          if-no-files-found: error
          retention-days: 90
