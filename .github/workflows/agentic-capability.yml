name: Agentic capability benchmark

on:
  workflow_dispatch:
    inputs:
      tasks:
        description: "Task ids, comma-separated, or all"
        required: true
        default: all
      tools:
        description: "Tool ids, comma-separated, or all (baseline-none runs first)"
        required: true
        default: all
      repetitions:
        description: "Independent repetitions per task/tool (1-10)"
        required: true
        default: "1"
      model:
        description: "OpenRouter model id"
        required: true
        default: openai/gpt-5.6-terra
      timeout_seconds:
        description: "Wall-clock budget for each individual trial"
        required: true
        default: "300"

permissions:
  contents: read

jobs:
  round:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install pinned Cline harness
        run: npm install -g cline@3.0.60

      - name: Record harness version
        run: cline --version

      - name: Run the round serially by rival
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASK_SELECTION: ${{ inputs.tasks }}
          TOOL_SELECTION: ${{ inputs.tools }}
          MODEL: ${{ inputs.model }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENROUTER_API_KEY:-}" ]]; then
            echo "::error::Repository secret OPENROUTER_API_KEY is not configured."
            exit 2
          fi

          python - <<'PY' > selections.json
          import json, os
          from pathlib import Path

          root = Path('benchmarks/agentic')
          tasks = [x['id'] for x in json.loads((root/'tasks.json').read_text())['tasks']]
          tools = [x['id'] for x in json.loads((root/'tools.json').read_text())['tools']]

          def pick(raw, available):
              if raw == 'all':
                  return available
              wanted = [x.strip() for x in raw.split(',') if x.strip()]
              unknown = sorted(set(wanted) - set(available))
              if unknown:
                  raise SystemExit(f'unknown ids: {unknown}')
              return wanted

          chosen_tasks = pick(os.environ['TASK_SELECTION'], tasks)
          chosen_tools = pick(os.environ['TOOL_SELECTION'], tools)
          if 'baseline-none' in chosen_tools:
              chosen_tools = ['baseline-none', *[x for x in chosen_tools if x != 'baseline-none']]
          repetitions = int(os.environ['REPETITIONS'])
          if repetitions < 1 or repetitions > 10:
              raise SystemExit('repetitions must be between 1 and 10')
          print(json.dumps({'tasks': chosen_tasks, 'tools': chosen_tools, 'repetitions': repetitions}))
          PY

          mkdir -p trial-results published
          mapfile -t tools < <(python -c 'import json; print("\n".join(json.load(open("selections.json"))["tools"]))')
          mapfile -t tasks < <(python -c 'import json; print("\n".join(json.load(open("selections.json"))["tasks"]))')

          for tool in "${tools[@]}"; do
            echo "::group::Rival $tool"
            mkdir -p "trial-results/$tool"
            for task in "${tasks[@]}"; do
              for repetition in $(seq 1 "$REPETITIONS"); do
                out="trial-results/$tool/${task}__${tool}__cline__${repetition}.jsonl"
                python benchmarks/agentic/run_trial.py \
                  --task "$task" \
                  --tool "$tool" \
                  --harness cline \
                  --model "$MODEL" \
                  --repetition "$repetition" \
                  --timeout "$TIMEOUT_SECONDS" \
                  --output "$out"
              done
            done
            python benchmarks/agentic/aggregate.py "trial-results/$tool" \
              --jsonl "published/${tool}.jsonl" \
              --markdown "published/${tool}.md"
            echo "::endgroup::"
          done

          python benchmarks/agentic/aggregate.py trial-results \
            --jsonl published/agentic-runs.jsonl \
            --markdown published/agentic-summary.md

      - name: Upload raw trial evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-raw-${{ github.run_id }}
          path: trial-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload aggregated round
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-round-${{ github.run_id }}
          path: published/
          if-no-files-found: warn
          retention-days: 90
