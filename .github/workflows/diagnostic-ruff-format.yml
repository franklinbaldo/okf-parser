name: Diagnostic Ruff Format

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - name: Format and emit exact sources
        shell: bash
        run: |
          set -euo pipefail
          files=(
            skills/codebase-to-okf/scripts/python_codebase_to_okf.py
            skills/codebase-to-okf/scripts/query_codebase_okf.py
            tests/test_codebase_to_okf_skill.py
          )
          uv run ruff format "${files[@]}"
          for file in "${files[@]}"; do
            echo "FORMATTED_FILE_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_FILE_END:$file"
          done
