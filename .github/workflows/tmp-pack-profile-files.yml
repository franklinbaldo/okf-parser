name: Temporary include journalism profile references

on:
  push:
    branches: [feat/type-packs-dogfood]
    paths:
      - .github/workflows/tmp-pack-profile-files.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/type-packs-dogfood
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          python-version: '3.12'
      - name: Include profile reference files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/okf_parser/type_packs.py')
          text = path.read_text()
          old = '''def journalism_pack() -> TypePack:\n    """Return the journalism starter built by dogfooding IPTC ninjs examples through init."""\n    return TypePack(\n        name="journalism",\n        version="1",\n        description="Journalism types based on the IPTC ninjs 3.2 news model.",\n        types=("NewsItem",),\n        files=_packaged_files("packs/journalism/specs", destination_prefix="specs"),\n        standard="IPTC ninjs",\n        standard_version="3.2",\n        standard_schema="https://www.iptc.org/std/ninjs/ninjs-schema_3.2.json",\n    )\n'''
          new = '''def journalism_pack() -> TypePack:\n    """Return the journalism starter built by dogfooding IPTC ninjs examples through init."""\n    resources = _packaged_files("packs/journalism")\n    profile_files = tuple(\n        item\n        for item in resources\n        if item.path == "ninjs-mapping.json"\n        or item.path.startswith("specs/")\n        or item.path.startswith("standards/")\n    )\n    return TypePack(\n        name="journalism",\n        version="1",\n        description="Journalism types based on the IPTC ninjs 3.2 news model.",\n        types=("NewsItem",),\n        files=profile_files,\n        standard="IPTC ninjs",\n        standard_version="3.2",\n        standard_schema="https://www.iptc.org/std/ninjs/ninjs-schema_3.2.json",\n    )\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/test_type_packs.py')
          text = path.read_text()
          old = '''    assert journalism["files"] == ["specs/newsitem.md", "specs/newsitem.schema.sql"]\n'''
          new = '''    assert journalism["files"] == [\n        "ninjs-mapping.json",\n        "specs/newsitem.md",\n        "specs/newsitem.schema.sql",\n        "standards/GeoJSON.json",\n        "standards/ninjs-schema_3.2.json",\n    ]\n'''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    assert preview["planned"] == ["specs/newsitem.md", "specs/newsitem.schema.sql"]\n'''
          new = '''    assert preview["planned"] == [\n        "ninjs-mapping.json",\n        "specs/newsitem.md",\n        "specs/newsitem.schema.sql",\n        "standards/GeoJSON.json",\n        "standards/ninjs-schema_3.2.json",\n    ]\n'''
          assert old in text
          path.write_text(text.replace(old, new, 1))
          PY
          uv sync --frozen --all-groups
          uv run ruff check --fix src/okf_parser/type_packs.py tests/test_type_packs.py
          uv run ruff format src/okf_parser/type_packs.py tests/test_type_packs.py
          uv run pytest tests/test_type_packs.py tests/test_journalism_pack.py -q
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-pack-profile-files.yml
          git add src/okf_parser/type_packs.py tests/test_type_packs.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(packs): ship ninjs profile references with journalism'
          git push origin HEAD:feat/type-packs-dogfood
