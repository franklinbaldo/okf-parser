name: Refresh RFC lockfile

on:
  push:
    branches:
      - rfc/typescript-sibling-package

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: rfc/typescript-sibling-package

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Refresh lock and remove this one-shot workflow
        run: |
          set -euo pipefail
          uv lock
          rm .github/workflows/refresh-rfc-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock .github/workflows/refresh-rfc-lock.yml
          git commit -m "chore: refresh lockfile for RFC version"
          git push origin HEAD:rfc/typescript-sibling-package
