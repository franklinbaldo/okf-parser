name: Temporary type-packs release sync

on:
  push:
    branches: [feat/type-packs-ninjs]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/type-packs-ninjs
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Synchronize release metadata and generated locks
        shell: bash
        run: |
          set -euo pipefail
          old=0.45.8
          new=0.45.9
          sed -i "s/${old}/${new}/g" \
            pyproject.toml \
            rust-core/Cargo.toml \
            okf-engine/Cargo.toml \
            typescript/package.json \
            typescript/package-lock.json \
            typescript-duckdb/package.json \
            typescript-duckdb/package-lock.json \
            native-npm-linux-x64/package.json \
            typescript/src/version.ts
          mkdir -p "changelog/${new}"
          git mv "changelog/${old}/type-packs.md" "changelog/${new}/type-packs.md"
          uv lock
          cargo generate-lockfile --manifest-path rust-core/Cargo.toml
          uv sync --frozen --all-groups
          uv run ruff format src/okf_parser/type_packs.py tests/test_type_packs.py
          rm .github/workflows/tmp-type-packs-release-sync.yml
      - name: Commit synchronized bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: synchronize 0.45.9 release metadata'
          git push origin HEAD:feat/type-packs-ninjs
