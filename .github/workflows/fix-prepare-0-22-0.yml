name: Fix 0.22.0 preparer

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'feat/explain-bundle-classification-0.22.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Let Ruff canonicalize the inserted service import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/prepare-0-22-0.yml')
          text = path.read_text(encoding='utf-8')
          old = '          uv run ruff format .\n          uv run ruff check .\n'
          new = '          uv run ruff format .\n          uv run ruff check --fix src/okf_parser/service.py\n          uv run ruff check .\n'
          if old not in text:
              raise SystemExit('validation block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-prepare-0-22-0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: let Ruff canonicalize classification wiring"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
