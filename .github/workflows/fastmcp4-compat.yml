name: FastMCP 4 compatibility

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/okf_parser/cli.py"
      - "tests/test_mcp.py"
      - ".github/workflows/fastmcp4-compat.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: Resolve canonical lockfile
        run: uv lock --upgrade-package fastmcp --upgrade-package cyclopts
      - uses: actions/upload-artifact@v6
        with:
          name: fastmcp4-lock
          path: uv.lock
          retention-days: 1
      - name: Commit resolved lockfile on same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh lock for FastMCP 4"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
      - name: Create isolated compatibility environment
        run: |
          uv venv --python 3.13 .venv-fastmcp4
          uv pip install             --python .venv-fastmcp4/bin/python             -e .             "fastmcp==4.0.5"             "cyclopts==4.25.2"             "pytest>=8,<10"
      - name: Exercise MCP contract on FastMCP 4
        run: |
          .venv-fastmcp4/bin/python -m pytest -q tests/test_mcp.py
