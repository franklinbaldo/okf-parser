name: Prepare 0.23.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'feat/revision-digests-0.23.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Apply deterministic 0.23.0 patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_0_23.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_revision_digests.py")
          text = path.read_text(encoding="utf-8")
          old = '    [revision] = payload["revisions"]\n'
          new = '    [revision] = cast("list[dict[str, str]]", payload["revisions"])\n'
          if old not in text:
              raise SystemExit("revision service cast marker not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Refresh derived metadata and dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb

      - name: Run full stack gate
        shell: bash
        run: |
          set -euo pipefail
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run pytest
          uv run python scripts/release_contract.py verify-source --root .
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb

      - name: Publish final branch state
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/prepare_0_23.py .github/workflows/prepare-0-23-0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add deterministic concept revision identity"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
