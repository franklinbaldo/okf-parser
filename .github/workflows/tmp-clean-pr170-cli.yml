name: PR170 CLI cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'feat/import-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/import-preview-token
      - name: Remove incidental CLI wording drift
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/okf_parser/cli.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'def schema(  # each argument is an independent public schema flags.',
              'def schema(  # each argument is an independent public CLI flag.',
          )
          text = text.replace(
              '"""Materialize the bundle into a persistent DuckDB database file."""',
              '"""Materialize the bundle into a persistent DuckDB database."""',
          )
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- src/okf_parser/cli.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/okf_parser/cli.py
          git diff --cached --quiet && exit 0
          git commit -m "chore: drop incidental CLI wording changes"
          git push origin HEAD:feat/import-preview-token
