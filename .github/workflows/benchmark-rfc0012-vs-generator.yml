name: Benchmark RFC0012 vs okf-generator

on:
  push:
    branches: [bench/rfc0012-vs-okf-generator]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv
      - name: Install both implementations
        run: |
          uv sync
          uv pip install --python .venv/bin/python 'git+https://github.com/UmairBaig8/okf-generator.git@5fb73be73814ec75b5c5f48ccbbecf348ff277d3'
      - name: Run equivalent-query benchmark
        run: |
          uv run python - <<'PY'
          import json, statistics, tempfile, time
          from pathlib import Path
          import duckdb
          from okf.storage import open_store
          from okf_parser.duckdb import attach_okf

          SIZES=(10000,50000)
          ROUNDS=500
          def avg_us(fn, rounds=ROUNDS):
              fn()
              t=time.perf_counter_ns()
              for _ in range(rounds): fn()
              return (time.perf_counter_ns()-t)/rounds/1e3
          def write_bundle(root,n):
              (root/'index.md').write_text('# Benchmark bundle\n',encoding='utf-8')
              for i in range(n):
                  nxt=(i+1)%n; typ='BenchmarkA' if i%2==0 else 'BenchmarkB'
                  (root/f'concept-{i:06d}.md').write_text(
                      '---\n'+f'type: {typ}\n'+f'title: Concept {i:06d}\n'+f'description: Synthetic concept {i}\n'+'---\n'+
                      f'# Concept {i:06d}\n\n## Related\n\n- [next](/concept-{nxt:06d}.md)\n\nSynthetic benchmark body.\n',encoding='utf-8')

          for n in SIZES:
              with tempfile.TemporaryDirectory(prefix=f'okf-query-{n}-') as td:
                  root=Path(td); write_bundle(root,n); target=f'concept-{n//2:06d}'
                  gs=open_store(root)
                  dc=duckdb.connect(str(root/'parser.duckdb')); attach_okf(dc,root)
                  s=gs._conn
                  row={'concepts':n}
                  row['sqlite_point_us']=avg_us(lambda:s.execute('SELECT concept_id,title FROM concepts WHERE concept_id=?',(target,)).fetchall())
                  row['duckdb_point_us']=avg_us(lambda:dc.execute('SELECT concept_id,title FROM okf.concepts WHERE concept_id=?',[target]).fetchall())
                  row['sqlite_type_limit_us']=avg_us(lambda:s.execute("SELECT concept_id,title FROM concepts WHERE type='BenchmarkA' ORDER BY concept_id LIMIT 80").fetchall())
                  row['duckdb_type_limit_us']=avg_us(lambda:dc.execute("SELECT concept_id,title FROM okf.concepts WHERE concept_type='BenchmarkA' ORDER BY concept_id LIMIT 80").fetchall())
                  row['sqlite_type_count_us']=avg_us(lambda:s.execute("SELECT count(*) FROM concepts WHERE type='BenchmarkA'").fetchall())
                  row['duckdb_type_count_us']=avg_us(lambda:dc.execute("SELECT count(*) FROM okf.concepts WHERE concept_type='BenchmarkA'").fetchall())
                  row['sqlite_neighbors_us']=avg_us(lambda:s.execute('SELECT source,target FROM edges WHERE source=? OR target=?',(target,target)).fetchall())
                  row['duckdb_neighbors_us']=avg_us(lambda:dc.execute('SELECT source_id,target_id FROM okf.links WHERE source_id=? OR target_id=?',[target,target]).fetchall())
                  print('EQUIV_ROW '+json.dumps(row,sort_keys=True),flush=True)
                  gs.close(); dc.close()
          PY
