name: Temporary 0.45.10 bump

on:
  push:
    branches: [fix/engine-loader-service-duckdb]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/engine-loader-service-duckdb
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Synchronize source versions
        shell: python
        run: |
          from pathlib import Path

          old = "0.45.9"
          new = "0.45.10"
          paths = [
              Path("pyproject.toml"),
              Path("okf-engine/Cargo.toml"),
              Path("rust-core/Cargo.toml"),
              Path("typescript/package.json"),
              Path("typescript-duckdb/package.json"),
              Path("native-npm-linux-x64/package.json"),
              Path("typescript/src/version.ts"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected {old} in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old_ref = "franklinbaldo/okf-parser@v0.45.9"
          new_ref = "franklinbaldo/okf-parser@v0.45.10"
          if text.count(old_ref) != 1:
              raise SystemExit(f"expected exactly one {old_ref} in README.md")
          readme.write_text(text.replace(old_ref, new_ref), encoding="utf-8", newline="\n")

      - name: Regenerate locked and derived files
        run: |
          uv lock
          cargo generate-lockfile
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          uv run --script scripts/pypi_readme.py
          uv run --script scripts/release_contract.py verify-source

      - name: Commit generated bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pyproject.toml uv.lock Cargo.lock \
            okf-engine/Cargo.toml rust-core/Cargo.toml \
            typescript/package.json typescript/package-lock.json typescript/src/version.ts \
            typescript-duckdb/package.json typescript-duckdb/package-lock.json \
            native-npm-linux-x64/package.json \
            README.md README.pypi.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): bump 0.45.10"
          git push origin HEAD:fix/engine-loader-service-duckdb
