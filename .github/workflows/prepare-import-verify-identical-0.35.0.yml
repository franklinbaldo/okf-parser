name: Prepare replay-safe import 0.35.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/import-verify-identical'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/import-verify-identical
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Apply replay-safe import delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/import-verify-identical-0.24.0
          git checkout origin/archive/import-verify-identical-0.24.0 -- \
            src/okf_parser/bundle_import.py \
            tests/test_bundle_import.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Service forwarding only; parsed equality stays owned by bundle_import.
          replace_once(
              'src/okf_parser/service.py',
              '''    id_column: str | None = None,\n    write: bool = False,\n    overwrite: bool = False,\n) -> dict[str, object]:\n    """Materialize every row of a DuckDB-readable source as one concept document."""\n    return _import_bundle(\n        source, path, concept_type, id_column=id_column, write=write, overwrite=overwrite\n    )\n''',
              '''    id_column: str | None = None,\n    write: bool = False,\n    overwrite: bool = False,\n    on_conflict: Literal["skip", "verify-identical"] = "skip",\n) -> dict[str, object]:\n    """Materialize every row of a DuckDB-readable source as one concept document."""\n    return _import_bundle(\n        source,\n        path,\n        concept_type,\n        id_column=id_column,\n        write=write,\n        overwrite=overwrite,\n        on_conflict=on_conflict,\n    )\n''',
          )
          replace_once(
              'src/okf_parser/service.py',
              'from typing import TYPE_CHECKING\n',
              'from typing import TYPE_CHECKING, Literal\n',
          )

          # Cyclopts/FastMCP need the enum at runtime, so keep one tiny public alias here.
          replace_once(
              'src/okf_parser/cli.py',
              'type CliSchemaFormat = Annotated[SchemaFormat, Parameter(name="format")]\n',
              'type CliSchemaFormat = Annotated[SchemaFormat, Parameter(name="format")]\ntype ImportConflictPolicy = Literal["skip", "verify-identical"]\n',
          )
          replace_once(
              'src/okf_parser/cli.py',
              '''    id_column: str | None = None,\n    write: bool = False,\n    overwrite: bool = False,\n) -> CliResult[JsonPayload]:\n    """Materialize every row of a DuckDB-readable source (CSV, Parquet, JSON) as a concept."""\n    payload = import_bundle(\n        source, path, type, id_column=id_column, write=write, overwrite=overwrite\n    )\n    return CliResult(payload, 1 if payload["duplicate_ids"] else 0)\n''',
              '''    id_column: str | None = None,\n    write: bool = False,\n    overwrite: bool = False,\n    on_conflict: ImportConflictPolicy = "skip",\n) -> CliResult[JsonPayload]:\n    """Materialize every row of a DuckDB-readable source (CSV, Parquet, JSON) as a concept."""\n    payload = import_bundle(\n        source,\n        path,\n        type,\n        id_column=id_column,\n        write=write,\n        overwrite=overwrite,\n        on_conflict=on_conflict,\n    )\n    failed = bool(payload["duplicate_ids"]) or bool(payload["conflicting_existing"])\n    return CliResult(payload, 1 if failed else 0)\n''',
          )
          replace_once(
              'src/okf_parser/cli.py',
              '''    *,\n    id_column: str | None = None,\n    overwrite: bool = False,\n) -> dict[str, object]:\n    """Plan a tabular import without creating or replacing concept files."""\n    return import_bundle(\n        source,\n        path,\n        type,\n        id_column=id_column,\n        write=False,\n        overwrite=overwrite,\n    )\n''',
              '''    *,\n    id_column: str | None = None,\n    overwrite: bool = False,\n    on_conflict: ImportConflictPolicy = "skip",\n) -> dict[str, object]:\n    """Plan a tabular import without creating or replacing concept files."""\n    return import_bundle(\n        source,\n        path,\n        type,\n        id_column=id_column,\n        write=False,\n        overwrite=overwrite,\n        on_conflict=on_conflict,\n    )\n''',
          )
          replace_once(
              'src/okf_parser/cli.py',
              '''    *,\n    id_column: str | None = None,\n    overwrite: bool = False,\n) -> dict[str, object]:\n    """Commit a tabular import using the existing import service."""\n    return import_bundle(\n        source,\n        path,\n        type,\n        id_column=id_column,\n        write=True,\n        overwrite=overwrite,\n    )\n''',
              '''    *,\n    id_column: str | None = None,\n    overwrite: bool = False,\n    on_conflict: ImportConflictPolicy = "skip",\n) -> dict[str, object]:\n    """Commit a tabular import using the existing import service."""\n    return import_bundle(\n        source,\n        path,\n        type,\n        id_column=id_column,\n        write=True,\n        overwrite=overwrite,\n        on_conflict=on_conflict,\n    )\n''',
          )

          # CLI exit code regression.
          replace_once(
              'tests/test_cli.py',
              'from okf_parser.cli import app, format_command\n',
              'from okf_parser.cli import app, format_command, import_command\n',
          )
          cli_test = '''\n\ndef test_import_exits_nonzero_for_a_divergent_existing_identity(tmp_path: Path) -> None:\n    source = tmp_path / "source.csv"\n    source.write_text("id,name\\nr1,Expected\\n", encoding="utf-8")\n    bundle = tmp_path / "bundle"\n    destination = bundle / "example" / "r1.md"\n    destination.parent.mkdir(parents=True)\n    destination.write_text(\n        "---\\ntype: Example\\nid: r1\\nname: Different\\n---\\n", encoding="utf-8"\n    )\n\n    result = import_command(\n        str(source),\n        str(bundle),\n        type="Example",\n        id_column="id",\n        on_conflict="verify-identical",\n    )\n\n    assert result.exit_code == 1\n    assert result.payload["conflicting_existing"] == ["example/r1.md"]\n'''
          replace_once(
              'tests/test_cli.py',
              '\n\n@pytest.mark.parametrize("schema_format", ["zod", "pydantic"])\n',
              cli_test + '\n\n@pytest.mark.parametrize("schema_format", ["zod", "pydantic"])\n',
          )

          # FastMCP schema + preview/write parity.
          replace_once(
              'tests/test_mcp.py',
              '''    assert import_preview == import_write\n    assert "write" not in import_preview["properties"]\n\n    assert "classify" in tools["check"].inputSchema["properties"]\n''',
              '''    assert import_preview == import_write\n    assert "write" not in import_preview["properties"]\n    assert import_preview["properties"]["on_conflict"]["enum"] == [\n        "skip",\n        "verify-identical",\n    ]\n\n    assert "classify" in tools["check"].inputSchema["properties"]\n''',
          )
          replace_once(
              'tests/test_mcp.py',
              '''    preview = cli.mcp_import_preview("source.csv", "bundle", "Pessoa")\n    written = cli.mcp_import_write("source.csv", "bundle", "Pessoa")\n''',
              '''    preview = cli.mcp_import_preview(\n        "source.csv", "bundle", "Pessoa", on_conflict="verify-identical"\n    )\n    written = cli.mcp_import_write(\n        "source.csv", "bundle", "Pessoa", on_conflict="verify-identical"\n    )\n''',
          )

          # Public docs: one progressive-disclosure flag on the existing import command.
          replace_once(
              'docs/cli.md',
              'uv run okf-parser import SOURCE path/to/bundle --type TYPE [--id-column COLUMN] [--write] [--overwrite]',
              'uv run okf-parser import SOURCE path/to/bundle --type TYPE [--id-column COLUMN] [--write] [--overwrite] [--on-conflict skip|verify-identical]',
          )
          replace_once(
              'docs/cli.md',
              '''- `--overwrite` — permit replacement of an existing destination; without it,\n  collisions are reported rather than silently replaced.\n\nExits `1` when the import plan contains duplicate ids. Other invalid inputs are\nreported as command errors.\n\nMCP tools: `import_preview`; `import_write` with `--allow-write`.\n''',
              '''- `--overwrite` — permit replacement of an existing destination; without it,\n  collisions use the selected conflict policy rather than being replaced.\n- `--on-conflict skip|verify-identical` — default `skip` preserves the existing\n  behavior. `verify-identical` parses the destination and candidate through the\n  official parser and compares canonical `parsed_digest`; matching parsed values\n  are idempotent `matched_existing` rows, while any divergence is\n  `conflicting_existing` and aborts the batch before writes. It cannot be\n  combined with `--overwrite`.\n\nExits `1` when the import plan contains duplicate ids or conflicting existing\nidentities. Other invalid inputs are reported as command errors.\n\nMCP tools: `import_preview`; `import_write` with `--allow-write`. Both expose the\nsame optional `on_conflict` policy through FastMCP.\n''',
          )

          replacements = {
              'pyproject.toml': [('version = "0.34.0"', 'version = "0.35.0"')],
              'typescript/package.json': [('"version": "0.34.0"', '"version": "0.35.0"')],
              'typescript-duckdb/package.json': [
                  ('"version": "0.34.0"', '"version": "0.35.0"'),
                  ('"okf-parser": "^0.34.0"', '"okf-parser": "^0.35.0"'),
              ],
              'typescript/src/version.ts': [
                  ('PROTOCOL_VERSION = "0.34.0"', 'PROTOCOL_VERSION = "0.35.0"'),
              ],
              'README.md': [
                  ('franklinbaldo/okf-parser@v0.34.0', 'franklinbaldo/okf-parser@v0.35.0'),
              ],
          }
          for name, pairs in replacements.items():
              target = Path(name)
              text = target.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected one {old!r}, found {count}')
                  text = text.replace(old, new)
              target.write_text(text, encoding='utf-8')

          Path('changelog/0.35.0.md').write_text('''---\ntype: Release\ntitle: okf-parser 0.35.0\ndescription: make tabular imports replay-safe with explicit verify-identical conflict handling\n---\n\n# okf-parser 0.35.0\n\n- add `import --on-conflict verify-identical` to distinguish idempotent replay from reuse of the same derived id with different content;\n- reuse canonical 0.34 `parsed_digest` for equality instead of maintaining a second structural comparison or canonicalizer;\n- ignore incidental YAML key order and equivalent scalar quoting while failing closed on extra/null frontmatter, unexpected body, malformed documents or any other parsed-value divergence;\n- abort a mixed batch before writes when any existing destination conflicts, while reporting matches separately as `matched_existing`;\n- keep `--overwrite` mutually exclusive with `verify-identical` and preserve historical `skip` as the default;\n- expose the policy through the existing service, CLI and FastMCP import preview/write pair with no new tool.\n''', encoding='utf-8')
          PY

      - name: Refresh locks
        run: |
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb

      - name: Validate full stack
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run vulture src tests --min-confidence 100
          uv run pytest -q
          uv run python scripts/release_contract.py verify-source --root .
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb
          cargo fmt --manifest-path rust-core/Cargo.toml --check
          cargo test --locked --manifest-path rust-core/Cargo.toml

      - name: Publish clean review head
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/prepare-import-verify-identical-0.35.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(import): verify idempotent conflicts'
          git push origin HEAD:agent/import-verify-identical
