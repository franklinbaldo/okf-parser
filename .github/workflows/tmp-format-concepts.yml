name: Temporary Ruff formatting

on:
  push:
    branches:
      - feat/concept-relation-resolution
    paths:
      - .github/workflows/tmp-format-concepts.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/concept-relation-resolution
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.21
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format tests/test_concepts.py
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_concepts.py
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:feat/concept-relation-resolution
