name: PR170 generated artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/import-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/import-preview-token
      - uses: astral-sh/setup-uv@v6
      - name: Generate canonical lockfiles and formatting
        run: |
          cargo generate-lockfile
          uv lock
          uv sync --locked
          uv run ruff format .
          git status --short
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock uv.lock src/okf_parser/bundle_import.py
          git diff --cached --quiet && exit 0
          git commit -m "chore: regenerate 0.45.0 locks and formatting"
          git push origin HEAD:feat/import-preview-token
