name: PR170 generated artifacts

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/import-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@v6
      - name: Generate canonical lockfiles and formatting
        run: |
          cargo generate-lockfile
          uv lock
          uv sync --locked
          uv run ruff format .
          git status --short
          mkdir -p .generated
          git diff --name-only > .generated/files.txt
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            mkdir -p ".generated/$(dirname "$file")"
            cp "$file" ".generated/$file"
          done < .generated/files.txt
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: pr170-generated
          path: .generated
          if-no-files-found: error
          retention-days: 1
