name: PR170 Ruff diff

on:
  pull_request:
    paths:
      - 'tests/test_mcp.py'
      - '.github/workflows/tmp-pr170-ruff-diff.yml'

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - name: Print canonical Ruff diff
        run: uv run ruff format --diff tests/test_mcp.py
