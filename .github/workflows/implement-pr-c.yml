name: Temporary PR C implementation

on:
  push:
    branches:
      - feat/typed-duckdb-materialization
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  implement:
    if: (github.head_ref == 'feat/typed-duckdb-materialization' || github.ref_name == 'feat/typed-duckdb-materialization') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/typed-duckdb-materialization
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Implement, lock, validate, and clean
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_implement_pr_c.py

          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          uv sync --frozen --all-groups

          uv run ruff format src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
          uv run python scripts/release_contract.py verify-source

          git rm -f .github/workflows/implement-pr-c.yml scripts/_implement_pr_c.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize declared types in persistent DuckDB"
          git push origin HEAD:feat/typed-duckdb-materialization
