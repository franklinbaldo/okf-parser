name: Generate bootstrapped native npm lock

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-native-lock.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/declared-relational-constraints
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Add unpublished optional companion to the lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("typescript/package-lock.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload["packages"]["node_modules/okf-parser-native-linux-x64"] = {
              "version": "0.42.0",
              "resolved": "file:../native-npm-linux-x64",
              "cpu": ["x64"],
              "license": "MIT",
              "optional": True,
              "os": ["linux"],
              "bin": {"okf-core": "bin/okf-core"},
          }
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          npm ci --prefix typescript --ignore-scripts
      - name: Create unattached validated lock blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -Rs '{content: ., encoding: "utf-8"}' typescript/package-lock.json > "$RUNNER_TEMP/blob.json"
          sha=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"$RUNNER_TEMP/blob.json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" | jq -r .sha)
          printf 'LOCK_BLOB=%s\n' "$sha" | tee "$RUNNER_TEMP/blob-sha.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrapped-native-lock-blob
          path: ${{ runner.temp }}/blob-sha.txt
