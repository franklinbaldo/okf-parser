name: Generate bootstrapped native npm lock

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-native-lock.yml]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/declared-relational-constraints
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Bootstrap unpublished optional companion
        run: |
          npm install --prefix typescript --package-lock-only --ignore-scripts --no-save "$GITHUB_WORKSPACE/native-npm-linux-x64"
          npm ci --prefix typescript --ignore-scripts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrapped-native-lock
          path: typescript/package-lock.json
