name: Prepare import 0.24.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/import-verify-identical'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/import-verify-identical
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Apply 0.24.0 patch
        run: python scripts/prepare_import_0_24.py
      - name: Refresh derived release files
        run: |
          set -euo pipefail
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
      - name: Validate full stack
        run: |
          set -euo pipefail
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run pytest
          uv run python scripts/release_contract.py verify-source --root .
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
      - name: Publish clean draft head
        run: |
          set -euo pipefail
          rm scripts/prepare_import_0_24.py .github/workflows/prepare-import-0-24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(import): verify idempotent conflicts'
          git push origin HEAD:agent/import-verify-identical
