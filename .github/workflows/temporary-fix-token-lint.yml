name: Temporary fix reviewed token lint

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
      - name: Apply local lint decisions
        run: |
          python - <<'PY'
          from pathlib import Path

          apply = Path('src/okf_parser/apply.py')
          text = apply.read_text(encoding='utf-8')
          old = 'def apply_bundle(  # each argument is an independent public CLI flag.\n'
          new = 'def apply_bundle(  # noqa: C901, PLR0911 - snapshot-coherent RFC 0005 orchestration\n'
          if text.count(old) != 1:
              raise SystemExit('expected one apply_bundle definition marker')
          apply.write_text(text.replace(old, new, 1), encoding='utf-8')

          for name, description in (
              ('tests/test_apply_preview_token.py', 'Reviewed-preview token tests for RFC 0005 apply.'),
              ('tests/test_apply_preview_token_noop.py', 'Reviewed-preview token no-op conflict tests.'),
          ):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if not text.startswith('"""'):
                  text = f'"""{description}"""\n\n' + text
              old_import = 'from pathlib import Path\n\n'
              replacement = 'from typing import TYPE_CHECKING\n\nif TYPE_CHECKING:\n    from pathlib import Path\n\n'
              if text.count(old_import) != 1:
                  raise SystemExit(f'{name}: expected one Path import')
              path.write_text(text.replace(old_import, replacement, 1), encoding='utf-8')
          PY
      - name: Commit source/test normalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/okf_parser/apply.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          git commit -m 'test(apply): normalize reviewed preview token gates'
          git push
