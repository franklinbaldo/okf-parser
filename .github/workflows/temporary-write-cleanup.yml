name: Temporary write cleanup

on:
  pull_request:
    branches:
      - feat/revision-digests-0.23.0

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/single-concept-edit-0.24.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/single-concept-edit-0.24.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync --frozen
      - name: Canonicalize write modules
        run: |
          uv run ruff check --fix src/okf_parser/apply.py src/okf_parser/edit.py src/okf_parser/write_support.py
          uv run ruff format src/okf_parser/apply.py src/okf_parser/edit.py src/okf_parser/write_support.py
          uv run ruff check src/okf_parser/apply.py src/okf_parser/edit.py src/okf_parser/write_support.py
      - name: Remove temporary workflows and commit clean head
        run: |
          git rm -f .github/workflows/temporary-write-quality-fix.yml .github/workflows/temporary-write-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/okf_parser/apply.py src/okf_parser/edit.py src/okf_parser/write_support.py
          git commit -m 'style(write): finalize shared write support'
          git push
