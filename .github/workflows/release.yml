name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release set
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Verify tagged source contract
        run: python scripts/release_contract.py verify-source --tag "$GITHUB_REF_NAME"

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm ci --prefix typescript-duckdb

      - name: Build release artifacts once
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/python release/native-python release/npm release/native-npm
          uv build --out-dir release/python
          uv build --wheel native-python-stub --out-dir release/native-python
          uv build --wheel rust-core --out-dir release/native-python
          rm -f release/python/.gitignore release/native-python/.gitignore
          cargo build --release --locked --manifest-path rust-core/Cargo.toml
          mkdir -p native-npm-linux-x64/bin
          cp target/release/okf-core native-npm-linux-x64/bin/okf-core
          chmod +x native-npm-linux-x64/bin/okf-core
          (cd native-npm-linux-x64 && npm pack --pack-destination ../release/native-npm --silent)
          (cd typescript && npm pack --pack-destination ../release/npm --silent)
          (cd typescript-duckdb && npm pack --pack-destination ../release/npm --silent)

      - name: Verify companion artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          stub=$(find release/native-python -maxdepth 1 -type f -name "okf_parser_native-${version}-py3-none-any.whl" -print -quit)
          native=$(find release/native-python -maxdepth 1 -type f -name "okf_parser_native-${version}-*.whl" ! -name '*-py3-none-any.whl' -print -quit)
          npm_native="release/native-npm/okf-parser-native-linux-x64-${version}.tgz"
          test -n "$stub"
          test -n "$native"
          test -f "$npm_native"
          NATIVE_WHEEL="$native" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["NATIVE_WHEEL"])
          with zipfile.ZipFile(wheel) as archive:
              scripts = [name for name in archive.namelist() if name.endswith('/scripts/okf-core')]
              if len(scripts) != 1:
                  raise SystemExit(f"expected one okf-core wheel script, found {scripts}")
          PY
          listing="$(tar -tzf "$npm_native")"
          grep -qx 'package/bin/okf-core' <<<"$listing"
          grep -qx 'package/package.json' <<<"$listing"

      - name: Generate immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_contract.py build-manifest \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --ref "$GITHUB_REF_NAME" \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --uv-version "$(uv --version | awk '{print $2}')"
          python scripts/release_contract.py verify-local --manifest release/manifest.json
          python scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Inspect public registry state
        run: python -m scripts.registry_state --manifest release/manifest.json --output release/registry-state.json

      - name: Upload exact tested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tested release set
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download tested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/

      - name: Re-verify exact bytes before publication
        run: |
          python scripts/release_contract.py verify-local --manifest release/manifest.json
          python scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Publish Python native companion first
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple
        run: uv publish release/native-python/*.whl

      - name: Publish Python parser
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple
        run: uv publish release/python/*

      - name: Publish npm native companion first
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./typescript/package.json').version")
          package="okf-parser-native-linux-x64"
          tarball="release/native-npm/${package}-${version}.tgz"
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            echo "${package}@${version} already exists; refusing to overwrite immutable npm state"
          else
            npm publish "$tarball" --access public
          fi

      - name: Publish npm parser
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./typescript/package.json').version")
          if npm view "okf-parser@${version}" version >/dev/null 2>&1; then
            echo "okf-parser@${version} already exists; refusing to overwrite immutable npm state"
          else
            npm publish "release/npm/okf-parser-${version}.tgz" --access public
          fi

      - name: Publish npm DuckDB adapter
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./typescript-duckdb/package.json').version")
          if npm view "okf-parser-duckdb@${version}" version >/dev/null 2>&1; then
            echo "okf-parser-duckdb@${version} already exists; refusing to overwrite immutable npm state"
          else
            npm publish "release/npm/okf-parser-duckdb-${version}.tgz" --access public
          fi

  finalize:
    name: Finalize GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release after registry publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="changelog/${version}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "okf-parser ${version}" --notes-file "$notes"
          fi
