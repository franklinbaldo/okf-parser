name: Temporary PR C persistence correction

on:
  push:
    branches:
      - feat/typed-duckdb-materialization
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: (github.head_ref == 'feat/typed-duckdb-materialization' || github.ref_name == 'feat/typed-duckdb-materialization') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/typed-duckdb-materialization
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Correct persistence semantics and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_fix_pr_c_persistence.py
          uv sync --frozen --all-groups
          uv run ruff format src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
          uv run python scripts/release_contract.py verify-source
          git rm -f .github/workflows/fix-pr-c-persistence.yml scripts/_fix_pr_c_persistence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: persist typed DuckDB snapshot values"
          git push origin HEAD:feat/typed-duckdb-materialization
