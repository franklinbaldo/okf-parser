name: Temporary release sync

on:
  push:
    branches: [tmp/type-packs-release-sync-final]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/type-packs-release-sync-final
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Synchronize 0.45.9 release metadata and locks
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^version = "0\.45\.8"$/version = "0.45.9"/' pyproject.toml
          sed -i 's/version = "0\.45\.8"/version = "0.45.9"/g' okf-engine/Cargo.toml rust-core/Cargo.toml
          sed -i 's/0\.45\.8/0.45.9/g' \
            typescript/package.json \
            typescript-duckdb/package.json \
            native-npm-linux-x64/package.json \
            typescript/src/version.ts
          sed -i 's/@v0\.45\.8/@v0.45.9/g' README.md

          uv lock
          cargo check --manifest-path rust-core/Cargo.toml
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb

          uv run --script scripts/release_contract.py verify-source
          uv lock --check
          cargo check --locked --manifest-path rust-core/Cargo.toml
          npm ci --ignore-scripts --prefix typescript
          npm ci --ignore-scripts --prefix typescript-duckdb

          rm .github/workflows/tmp-release-sync.yml
      - name: Commit synchronized release state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'chore(release): synchronize 0.45.9 metadata and locks'
          git push origin HEAD:tmp/type-packs-release-sync-final
