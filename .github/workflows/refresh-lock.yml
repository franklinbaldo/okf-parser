name: Refresh lockfile

on:
  push:
    branches: [refactor/string-first-schema-inference]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/string-first-schema-inference

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Refresh and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh lockfile"
          git push origin HEAD:refactor/string-first-schema-inference
