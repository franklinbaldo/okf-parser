name: Generate relational public-surface blobs

on:
  push:
    branches: [main]
    paths: [.github/workflows/relational-surface-blobs.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/declared-relational-constraints
      - name: Wire public relational validation surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/okf_parser/bundle.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from okf_parser.rust_core import rust_load_bundle\n',
              'from okf_parser.relational_schema import validate_relations\nfrom okf_parser.rust_core import rust_load_bundle\n',
          )
          text = text.replace(
              '    *,\n    normative_spec: bool = False,\n) -> ValidationReport:\n',
              '    *,\n    normative_spec: bool = False,\n    relational_schema: Path | None = None,\n) -> ValidationReport:\n',
              1,
          )
          text = text.replace(
              '    diagnostics = list(bundle.diagnostics)\n    if require_spec is not None:\n',
              '    diagnostics = list(bundle.diagnostics)\n'
              '    if relational_schema is not None:\n'
              '        schema_path = (\n'
              '            relational_schema\n'
              '            if relational_schema.is_absolute()\n'
              '            else bundle.root / relational_schema\n'
              '        )\n'
              '        diagnostics.extend(validate_relations(bundle, schema_path))\n'
              '    if require_spec is not None:\n',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/okf_parser/service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    *,\n    normative_spec: bool = False,\n    classify: bool = False,\n) -> dict[str, object]:\n',
              '    *,\n    normative_spec: bool = False,\n    classify: bool = False,\n    relational_schema: str | None = None,\n) -> dict[str, object]:\n',
              1,
          )
          text = text.replace(
              '    report = validate_path(Path(path), exclude, require_spec, normative_spec=normative_spec)\n',
              '    report = validate_path(\n'
              '        Path(path),\n'
              '        exclude,\n'
              '        require_spec,\n'
              '        normative_spec=normative_spec,\n'
              '        relational_schema=Path(relational_schema) if relational_schema is not None else None,\n'
              '    )\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('src/okf_parser/cli.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    require_spec: str | None = None,\n    normative_spec: bool = False,\n    classify: bool = False,\n',
              '    require_spec: str | None = None,\n    normative_spec: bool = False,\n    relational_schema: str | None = None,\n    classify: bool = False,\n',
              1,
          )
          text = text.replace(
              '        normative_spec=normative_spec,\n        classify=classify,\n',
              '        normative_spec=normative_spec,\n        classify=classify,\n        relational_schema=relational_schema,\n',
              1,
          )
          # Keep MCP check at parity with the service.
          marker = '''def mcp_check(\n    path: str,\n    exclude: RepeatableStrings = None,\n    require_spec: str | None = None,\n    *,\n    normative_spec: bool = False,\n    classify: bool = False,\n) -> dict[str, object]:'''
          replacement = '''def mcp_check(\n    path: str,\n    exclude: RepeatableStrings = None,\n    require_spec: str | None = None,\n    *,\n    normative_spec: bool = False,\n    relational_schema: str | None = None,\n    classify: bool = False,\n) -> dict[str, object]:'''
          text = text.replace(marker, replacement, 1)
          mcp_call = '''        normative_spec=normative_spec,\n        classify=classify,\n    )\n\n\ndef mcp_inventory'''
          mcp_replacement = '''        normative_spec=normative_spec,\n        classify=classify,\n        relational_schema=relational_schema,\n    )\n\n\ndef mcp_inventory'''
          text = text.replace(mcp_call, mcp_replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_relational_schema.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from okf_parser.bundle import load_bundle\n', 'from okf_parser.bundle import load_bundle, validate_path\n')
          if 'test_validate_path_applies_explicit_relational_schema' not in text:
              text += '''\n\ndef test_validate_path_applies_explicit_relational_schema(tmp_path: Path) -> None:\n    _write(tmp_path / "regra.md", _concept("Regra", nome="regra-a"))\n    _write(tmp_path / "fund.md", _concept("Fundamentacao", id="f1", regra="ausente"))\n    _write(tmp_path / "okf.schema.sql", RELATIONAL_SQL)\n\n    report = validate_path(tmp_path, relational_schema=Path("okf.schema.sql"))\n\n    assert not report.is_conformant\n    assert [item.code for item in report.violations] == ["OKF022"]\n'''
          path.write_text(text, encoding='utf-8')

          path = Path('README.md')
          text = path.read_text(encoding='utf-8').replace('franklinbaldo/okf-parser@v0.41.3', 'franklinbaldo/okf-parser@v0.42.0')
          text = text.replace(
              'uv run okf-parser check path/to/bundle\n',
              'uv run okf-parser check path/to/bundle\nuv run okf-parser check path/to/bundle --relational-schema okf.schema.sql\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('changelog/0.42.0.md')
          text = path.read_text(encoding='utf-8')
          if '`check --relational-schema`' not in text:
              text += '\n- exposes the trusted bundle relational contract through `check --relational-schema` and the shared Python/MCP validation surface.\n'
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Create unattached blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(src/okf_parser/bundle.py src/okf_parser/service.py src/okf_parser/cli.py tests/test_relational_schema.py README.md changelog/0.42.0.md)
          : > "$RUNNER_TEMP/blobs.tsv"
          for file in "${files[@]}"; do
            jq -Rs '{content: ., encoding: "utf-8"}' "$file" > "$RUNNER_TEMP/blob.json"
            sha=$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @"$RUNNER_TEMP/blob.json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs" | jq -r .sha)
            printf '%s\t%s\n' "$file" "$sha" | tee -a "$RUNNER_TEMP/blobs.tsv"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relational-public-surface-blobs
          path: ${{ runner.temp }}/blobs.tsv
