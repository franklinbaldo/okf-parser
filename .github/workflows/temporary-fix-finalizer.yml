name: Temporary fix apply finalizer

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
      - name: Preserve Python indentation in transported helper block
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/temporary-finalize-apply-token.yml')
          text = path.read_text(encoding='utf-8')
          old = '          helpers = "\\n".join(line[10:] if line.startswith("          ") else line for line in helpers.splitlines()) + "\\n"\n'
          new = '          helpers = helpers + ("" if helpers.endswith("\\n") else "\\n")\n'
          if text.count(old) != 1:
              raise SystemExit('expected finalizer indentation marker exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit finalizer fix and remove this helper
        run: |
          git rm -f .github/workflows/temporary-fix-finalizer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/temporary-finalize-apply-token.yml
          git commit -m 'chore(ci): preserve apply helper indentation'
          git push
