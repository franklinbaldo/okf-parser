name: Format codebase manifest projector

on:
  push:
    branches:
      - feat/codebase-okf-project-manifest

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/codebase-okf-project-manifest
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - run: uv sync --frozen --all-groups
      - run: uv run ruff format skills/codebase-to-okf/scripts/python_project_metadata_to_okf.py
      - name: Commit canonical formatting and remove helper workflow
        run: |
          rm .github/workflows/_format-codebase-projector.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(skill): apply canonical Ruff formatting'
          git push origin HEAD:feat/codebase-okf-project-manifest
