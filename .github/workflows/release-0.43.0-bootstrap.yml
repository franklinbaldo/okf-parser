name: Bootstrap v0.43.0 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-0.43.0-bootstrap.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag exact reviewed source and dispatch Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          target=522cd5c12303c19e784a7645569094f54f73854e
          tag=v0.43.0
          git cat-file -e "${target}^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            remote=$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')
            if [ -z "$remote" ]; then
              remote=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
            fi
            test "$remote" = "$target"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$tag" "$target" -m "okf-parser 0.43.0"
            git push origin "refs/tags/${tag}"
          fi
          gh workflow run publish.yml --ref "$tag"
