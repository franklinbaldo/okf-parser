name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check formatting
        run: cargo fmt --manifest-path rust-core/Cargo.toml --check

      - name: Run tests
        run: cargo test --locked --manifest-path rust-core/Cargo.toml

      - name: Build release MVP
        run: cargo build --release --locked --manifest-path rust-core/Cargo.toml

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install and build TypeScript
        run: npm ci --prefix typescript && npm run build --prefix typescript

      - name: Prove native and Rust full bundles equivalent
        shell: bash
        run: |
          OKF_CORE=target/release/okf-parser uv run pytest tests/test_rust_core.py
          uv run python benchmarks/python_parser.py --sizes 10 --rounds 1 --rust-core target/release/okf-parser > "$RUNNER_TEMP/python-rust-benchmark.json"
          node benchmarks/typescript-parser.mjs --sizes=10 --rounds=1 --rust-core=target/release/okf-parser > "$RUNNER_TEMP/typescript-rust-benchmark.json"

  version-bump:
    name: Version bump and changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a version bump and matching changelog
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          read_version() {
            sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p'
          }

          git fetch --quiet origin "$BASE"
          head_version=$(read_version < pyproject.toml)
          if git cat-file -e "origin/$BASE:pyproject.toml" 2>/dev/null; then
            base_version=$(git show "origin/$BASE:pyproject.toml" | read_version)
          else
            base_version="0.0.0"
          fi

          if [[ -z "$head_version" ]]; then
            echo "::error file=pyproject.toml::A versão SemVer não foi encontrada."
            exit 1
          fi
          if [[ "$head_version" == "$base_version" ]]; then
            echo "::error file=pyproject.toml::A versão continua $head_version; faça o bump."
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -1)
          if [[ "$highest" != "$head_version" ]]; then
            echo "::error file=pyproject.toml::A versão $head_version não supera $base_version."
            exit 1
          fi

          for manifest in typescript/package.json typescript-duckdb/package.json; do
            if [[ -f "$manifest" ]]; then
              package_version=$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)",$/\1/p' "$manifest")
              if [[ "$package_version" != "$head_version" ]]; then
                echo "::error file=$manifest::A versão npm $package_version difere da versão Python $head_version."
                exit 1
              fi
            fi
          done

          expected_changelog="changelog/$head_version.md"
          mapfile -t added_changelogs < <(
            git diff --diff-filter=A --name-only "origin/$BASE...HEAD" -- "changelog/*.md"
          )
          if [[ "${#added_changelogs[@]}" -ne 1 ]]; then
            echo "::error file=changelog::Cada PR deve adicionar exatamente um changelog."
            printf 'Encontrado: %s\n' "${added_changelogs[@]}"
            exit 1
          fi
          if [[ "${added_changelogs[0]}" != "$expected_changelog" ]]; then
            echo "::error file=${added_changelogs[0]}::Esperado $expected_changelog."
            exit 1
          fi

          echo "OK: $base_version -> $head_version; $expected_changelog presente."

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Check lockfile
        run: uv lock --check

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Check types
        run: uv run ty check src tests

      - name: Find dead code
        run: uv run vulture src --min-confidence 90

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=85

      - name: Validate this repository with okf-parser
        run: uv run okf-parser check . --require-spec "docs/types/{slug}.md" --normative-spec

      - name: Build distributions
        run: uv build

      - name: Smoke-test the Python benchmark harness
        run: uv run python benchmarks/python_parser.py --sizes 10 --rounds 1 > "$RUNNER_TEMP/python-benchmark.json"

  typescript-quality:
    name: TypeScript / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefix typescript

      - name: Check TypeScript
        run: npm run check --prefix typescript

      - name: Run TypeScript and shared conformance tests
        run: npm test --prefix typescript

      - name: Build ESM and declarations
        run: npm run build --prefix typescript

      - name: Smoke-test the TypeScript benchmark harness
        run: node benchmarks/typescript-parser.mjs --sizes=10 --rounds=1 > "$RUNNER_TEMP/typescript-benchmark.json"

      - name: Dogfood the TypeScript CLI
        run: node typescript/dist/cli.js check . > "$RUNNER_TEMP/okf-check.json"

      - name: Exercise the TypeScript formatter
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/format-fixture"
          printf '# Heading\n\n-   item\n' > "$RUNNER_TEMP/format-fixture/concept.md"
          if node typescript/dist/cli.js format "$RUNNER_TEMP/format-fixture" > "$RUNNER_TEMP/format-check.json"; then
            echo "formatter check unexpectedly succeeded before rewrite"
            exit 1
          fi
          node typescript/dist/cli.js format "$RUNNER_TEMP/format-fixture" --write > "$RUNNER_TEMP/format-write.json"
          node typescript/dist/cli.js format "$RUNNER_TEMP/format-fixture" > "$RUNNER_TEMP/format-clean.json"
          grep -qx -- '- item' "$RUNNER_TEMP/format-fixture/concept.md"

      - name: Exercise the MCP stdio binary
        run: node typescript/scripts/smoke-mcp-stdio.mjs

      - name: Pack and install into a clean project
        shell: bash
        run: |
          set -euo pipefail
          expected_version=$(node -p "require('./typescript/package.json').version")
          tarball=$(cd typescript && npm pack --pack-destination "$RUNNER_TEMP" --silent)
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP/$tarball" >/dev/null
          EXPECTED_VERSION="$expected_version" node --input-type=module -e "import('okf-parser').then(({ capabilityManifest }) => { if (capabilityManifest.protocol_version !== process.env.EXPECTED_VERSION || capabilityManifest.capabilities.format !== 'stable') process.exit(1) })"
          ./node_modules/.bin/okf-parser-ts --help >/dev/null
          mkdir format-fixture
          printf '# Heading\n\n-   item\n' > format-fixture/concept.md
          if ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null; then
            echo "installed formatter check unexpectedly succeeded before rewrite"
            exit 1
          fi
          ./node_modules/.bin/okf-parser-ts format format-fixture --write >/dev/null
          ./node_modules/.bin/okf-parser-ts format format-fixture >/dev/null
          grep -qx -- '- item' format-fixture/concept.md
          node "$GITHUB_WORKSPACE/typescript/scripts/smoke-mcp-stdio.mjs" ./node_modules/.bin/okf-parser-ts-mcp

  typescript-duckdb-quality:
    name: TypeScript DuckDB / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Build the parser package
        run: |
          npm ci --prefix typescript
          npm run build --prefix typescript

      - name: Install adapter dependencies
        run: npm ci --prefix typescript-duckdb

      - name: Check adapter TypeScript
        run: npm run check --prefix typescript-duckdb

      - name: Run adapter integration tests
        run: npm test --prefix typescript-duckdb

      - name: Build adapter ESM and declarations
        run: npm run build --prefix typescript-duckdb

      - name: Pack both packages and install into a clean project
        shell: bash
        run: |
          set -euo pipefail
          parser_tarball=$(cd typescript && npm pack --pack-destination "$RUNNER_TEMP" --silent)
          adapter_tarball=$(cd typescript-duckdb && npm pack --pack-destination "$RUNNER_TEMP" --silent)
          mkdir "$RUNNER_TEMP/duckdb-consumer"
          cd "$RUNNER_TEMP/duckdb-consumer"
          npm init -y >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP/$parser_tarball" >/dev/null
          npm install --ignore-scripts "$RUNNER_TEMP/$adapter_tarball" >/dev/null
          mkdir knowledge
          printf '%s\n' '---' 'type: Node' '---' '# Node' > knowledge/node.md
          ./node_modules/.bin/okf-parser-ts-duckdb knowledge --database bundle.duckdb > report.json
          node --input-type=module -e "import('okf-parser-duckdb').then(async ({ exportDuckDb }) => { const result = await exportDuckDb('knowledge', { database: 'second.duckdb' }); if (result.concept_count !== 1) process.exit(1) })"
