name: Finalize Registry Preflight

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-registry-preflight
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/registry-preflight
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Complete implementation and synchronized metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/registry_state.py")
          text = path.read_text(encoding="utf-8")
          old = "import json\nfrom dataclasses import dataclass\nfrom typing import TYPE_CHECKING, BinaryIO, Callable, Final, Literal, Never, cast\nfrom urllib.error import HTTPError, URLError\n"
          new = "import argparse\nimport json\nimport sys\nfrom collections.abc import Callable\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import BinaryIO, Final, Never, cast\nfrom urllib.error import HTTPError\n"
          if old not in text:
              raise SystemExit("unexpected registry-state imports")
          text = text.replace(old, new, 1)
          text = text.replace("\nif TYPE_CHECKING:\n    from pathlib import Path\n", "", 1)
          alias = "RegistryStatus = Literal[\n    \"absent\",\n    \"present_expected\",\n    \"present_conflict\",\n    \"unverifiable\",\n]\n"
          if alias not in text:
              raise SystemExit("registry status alias not found")
          text = text.replace(alias, "", 1)
          text = text.replace(
              'NPM_BASE: Final = "https://registry.npmjs.org"\n',
              'NPM_BASE: Final = "https://registry.npmjs.org"\nHTTP_OK: Final = 200\nHTTP_NOT_FOUND: Final = 404\n',
              1,
          )
          target_class = "\n\n@dataclass(frozen=True)\nclass RegistryTarget:\n    \"\"\"One registry package/version endpoint pair.\"\"\"\n\n    registry: str\n    package: str\n    version: str\n    version_url: str\n    package_url: str\n"
          marker = "\n\nFetch = Callable[[str, float], HttpResult]\n"
          if marker not in text:
              raise SystemExit("fetch alias marker not found")
          text = text.replace(marker, target_class + marker, 1)
          text = text.replace(
              '    request = Request(url, headers={"Accept": "application/json", "User-Agent": USER_AGENT})\n',
              '    request = Request(  # noqa: S310 -- HTTPS is enforced immediately above.\n        url, headers={"Accept": "application/json", "User-Agent": USER_AGENT}\n    )\n',
              1,
          )
          text = text.replace(
              "    except (OSError, TimeoutError, URLError) as exc:\n        raise RegistryStateError(f\"cannot fetch {url}: {exc}\") from exc\n",
              "    except OSError as exc:\n        message = f\"cannot fetch {url}: {exc}\"\n        raise RegistryStateError(message) from exc\n",
              1,
          )
          text = text.replace("result.status == 404", "result.status == HTTP_NOT_FOUND")
          text = text.replace("result.status == 200", "result.status == HTTP_OK")
          text = text.replace("result.status != 200", "result.status != HTTP_OK")
          old_absent = "def _absent_entry(\n    *,\n    registry: str,\n    package: str,\n    version: str,\n    version_url: str,\n    package_url: str,\n    fetch: Fetch,\n    timeout: float,\n) -> RegistryEntry:\n    package_exists, bootstrap_reason = _probe_package(package_url, fetch, timeout)\n    return {\n        \"registry\": registry,\n        \"package\": package,\n        \"version\": version,\n        \"state\": \"absent\",\n        \"reason\": \"target version is not published\",\n        \"version_url\": version_url,\n        \"package_exists\": package_exists,\n        \"bootstrap_reason\": bootstrap_reason,\n    }\n"
          new_absent = "def _absent_entry(target: RegistryTarget, fetch: Fetch, timeout: float) -> RegistryEntry:\n    package_exists, bootstrap_reason = _probe_package(target.package_url, fetch, timeout)\n    return {\n        \"registry\": target.registry,\n        \"package\": target.package,\n        \"version\": target.version,\n        \"state\": \"absent\",\n        \"reason\": \"target version is not published\",\n        \"version_url\": target.version_url,\n        \"package_exists\": package_exists,\n        \"bootstrap_reason\": bootstrap_reason,\n    }\n"
          if old_absent not in text:
              raise SystemExit("absent entry function not found")
          text = text.replace(old_absent, new_absent, 1)
          old_pypi = "        return _absent_entry(\n            registry=\"pypi\",\n            package=package,\n            version=version,\n            version_url=version_url,\n            package_url=package_url,\n            fetch=fetch,\n            timeout=timeout,\n        )\n"
          new_pypi = "        target = RegistryTarget(\"pypi\", package, version, version_url, package_url)\n        return _absent_entry(target, fetch, timeout)\n"
          if old_pypi not in text:
              raise SystemExit("PyPI absent call not found")
          text = text.replace(old_pypi, new_pypi, 1)
          old_npm = "        return _absent_entry(\n            registry=\"npm\",\n            package=package,\n            version=version,\n            version_url=version_url,\n            package_url=package_url,\n            fetch=fetch,\n            timeout=timeout,\n        )\n"
          new_npm = "        target = RegistryTarget(\"npm\", package, version, version_url, package_url)\n        return _absent_entry(target, fetch, timeout)\n"
          if old_npm not in text:
              raise SystemExit("npm absent call not found")
          text = text.replace(old_npm, new_npm, 1)
          path.write_text(text, encoding="utf-8")

          tests = Path("tests/test_registry_state.py")
          text = tests.read_text(encoding="utf-8")
          text = text.replace("from typing import cast\n", "from collections.abc import Callable\nfrom typing import cast\n", 1)
          text = text.replace(
              "def _fetcher(routes: dict[str, HttpResult], failures: set[str] | None = None):\n",
              "def _fetcher(\n    routes: dict[str, HttpResult], failures: set[str] | None = None\n) -> Callable[[str, float], HttpResult]:\n",
              1,
          )
          text = text.replace(
              '            raise RegistryStateError(f"network failure for {url}")\n',
              '            message = f"network failure for {url}"\n            raise RegistryStateError(message)\n',
              1,
          )
          tests.write_text(text, encoding="utf-8")

          docs = Path("docs/releasing.md")
          text = docs.read_text(encoding="utf-8")
          text = text.replace("## Current capability: dry run only", "## Current capability: dry run and read-only preflight", 1)
          text = text.replace("├── manifest.json\n└── SHA256SUMS", "├── manifest.json\n├── registry-state.json\n└── SHA256SUMS", 1)
          text = text.replace(
              "python scripts/release_contract.py verify-local --manifest release/manifest.json\n```",
              "python scripts/release_contract.py verify-local --manifest release/manifest.json\npython -m scripts.registry_state --manifest release/manifest.json \\\n  --output release/registry-state.json\n```",
              1,
          )
          doc_marker = "The manifest command fails on missing, duplicate or unexpected artifacts. The\nverification command rejects path traversal, archive identity drift, changed\nsizes or digests, and a `SHA256SUMS` file that no longer matches the manifest.\n"
          section = "\n## Public registry preflight\n\nThe registry command performs anonymous HTTPS reads only. It compares the\nmanifest with PyPI SHA-256 file digests and npm SRI integrity, then classifies\neach target as `absent`, `present_expected`, `present_conflict` or\n`unverifiable`. Its plan uses `publish`, `skip` or `block`, which is the state\nmachine later consumed by the privileged workflow.\n\nWhen a target version is absent, the report also probes the package root. This\ndistinguishes a genuinely available bootstrap name from a package that already\nexists at another version. Conflicts, incomplete releases and unverifiable\nresponses return a non-zero status; no registry mutation is attempted.\n"
          if doc_marker not in text:
              raise SystemExit("documentation insertion marker not found")
          text = text.replace(doc_marker, doc_marker + section, 1)
          text = text.replace(
              "6. review a second PR that adds idempotent registry-state checks and publication\n   jobs using the already-tested artifact set.",
              "6. review a privileged PR that consumes the tested registry-state model and adds\n   publication jobs using the already-tested artifact set.",
              1,
          )
          docs.write_text(text, encoding="utf-8")

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          if 'version = "0.12.0"' not in text:
              raise SystemExit("unexpected Python version")
          pyproject.write_text(text.replace('version = "0.12.0"', 'version = "0.13.0"', 1), encoding="utf-8")

          version_file = Path("typescript/src/version.ts")
          text = version_file.read_text(encoding="utf-8")
          if '"0.12.0"' not in text:
              raise SystemExit("unexpected protocol version")
          version_file.write_text(text.replace('"0.12.0"', '"0.13.0"', 1), encoding="utf-8")
          PY

          cat >> scripts/registry_state.py <<'PYCODE'


          def _read_manifest(path: Path) -> dict[str, object]:
              try:
                  value = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  _fail(f"cannot read manifest {path}: {exc}")
              if not isinstance(value, dict):
                  _fail(f"manifest {path} is not a JSON object")
              return cast("dict[str, object]", value)


          def _parser() -> argparse.ArgumentParser:
              parser = argparse.ArgumentParser(description=__doc__)
              parser.add_argument("--manifest", type=Path, default=Path("release/manifest.json"))
              parser.add_argument("--output", type=Path, default=Path("release/registry-state.json"))
              parser.add_argument("--timeout", type=float, default=15.0)
              return parser


          def main(argv: list[str] | None = None) -> int:
              """Run the read-only registry preflight CLI."""
              arguments = _parser().parse_args(argv)
              try:
                  report = inspect_registry_state(
                      _read_manifest(arguments.manifest.resolve()),
                      timeout=arguments.timeout,
                  )
                  write_registry_report(arguments.output.resolve(), report)
              except RegistryStateError as exc:
                  sys.stderr.write(f"registry preflight error: {exc}\n")
                  return 2
              sys.stdout.write(json.dumps(report, indent=2, sort_keys=True) + "\n")
              return 0 if report["safe_to_publish"] is True else 3


          if __name__ == "__main__":
              raise SystemExit(main())
          PYCODE

          npm --prefix typescript version 0.13.0 --no-git-tag-version
          npm --prefix typescript-duckdb version 0.13.0 --no-git-tag-version
          npm --prefix typescript-duckdb pkg set 'peerDependencies.okf-parser=^0.13.0'
          uv lock
          npm install --prefix typescript --package-lock-only --ignore-scripts
          npm install --prefix typescript-duckdb --package-lock-only --ignore-scripts
          mv .github/release-dry-run.final.yml .github/workflows/release-dry-run.yml
          rm -f .github/workflows/consolidate-registry-preflight.yml

      - name: Verify Python implementation
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format .
          uv run ruff check .
          uv run ty check src tests scripts
          uv run vulture src --min-confidence 90
          uv run pytest
          python scripts/release_contract.py verify-source
          uv run okf-parser check .

      - name: Verify TypeScript packages
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix typescript
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb

      - name: Exercise live read-only registry preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/python release/npm
          uv build --out-dir release/python
          rm -f release/python/.gitignore
          (cd typescript && npm pack --pack-destination ../release/npm --silent)
          (cd typescript-duckdb && npm pack --pack-destination ../release/npm --silent)
          python scripts/release_contract.py build-manifest \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --ref feat/registry-preflight \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --uv-version "$(uv --version | awk '{print $2}')"
          python scripts/release_contract.py verify-local --manifest release/manifest.json
          python -m scripts.registry_state --manifest release/manifest.json --output release/registry-state.json
          cat release/registry-state.json
          rm -rf release dist typescript/dist typescript-duckdb/dist

      - name: Restore CI and commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(release): add read-only registry preflight"
          git push origin HEAD:feat/registry-preflight
