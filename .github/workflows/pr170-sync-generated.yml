name: PR 170 sync generated files

on:
  push:
    branches: [feat/import-preview-token]
    paths:
      - .github/workflows/pr170-sync-generated.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/import-preview-token
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.21
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate deterministic artifacts
        run: |
          uv lock
          uv sync --frozen --all-groups
          uv run ruff format src/okf_parser/bundle_import.py tests/test_import_preview_token.py
          cargo generate-lockfile --manifest-path rust-core/Cargo.toml
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
      - name: Commit generated changes to this PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock Cargo.lock typescript/package-lock.json typescript-duckdb/package-lock.json src/okf_parser/bundle_import.py tests/test_import_preview_token.py
          git diff --cached --quiet && exit 0
          git commit -m 'chore: regenerate formatted and locked artifacts'
          git push origin HEAD:feat/import-preview-token
