name: Prepare 0.21.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.pull_request.head.ref == 'feat/public-typed-relations-0.21.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Wire public API and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/okf_parser/bundle.py",
              "from okf_parser.type_specs import missing_type_specs\n",
              "from okf_parser.type_specs import missing_type_specs\nfrom okf_parser.typed_relations import TypedRelations, compile_bundle_types\n",
          )
          marker = '''    @property\n    def is_conformant(self) -> bool:\n        """Whether the bundle has no normative errors."""\n'''
          replacement = '''    def compile_types(self, spec_template: str | None = None) -> TypedRelations:\n        """Compile declared concept types into live in-process Ibis relations."""\n        return compile_bundle_types(self, spec_template)\n\n    @property\n    def is_conformant(self) -> bool:\n        """Whether the bundle has no normative errors."""\n'''
          replace("src/okf_parser/bundle.py", marker, replacement)

          readme_marker = '''report = validate_path(Path("knowledge"))\nassert report.markdown_count == report.concept_count + report.reserved_count\nassert report.is_conformant\n```\n'''
          readme_replacement = readme_marker + '''\nDeclared RFC 0006 types can be queried directly as Ibis relations without a CLI or database-file round trip:\n\n```python\nbundle = load_bundle(Path("knowledge"))\nwith bundle.compile_types("docs/types/{slug}.md") as typed:\n    routines = typed["Rotina"]\n    print(routines.filter(routines.custo.notnull()).execute())\n```\n\n`TypedRelations` owns an ephemeral DuckDB/Ibis backend; use it as a context manager or call `close()` explicitly. With no matching declarations, `tables` is empty rather than silently inventing an inferred physical schema.\n'''
          replace("README.md", readme_marker, readme_replacement)
          replace("README.md", "franklinbaldo/okf-parser@v0.20.1", "franklinbaldo/okf-parser@v0.21.0")

          replace("pyproject.toml", 'version = "0.20.1"', 'version = "0.21.0"')
          replace("typescript/package.json", '"version": "0.20.1"', '"version": "0.21.0"')
          replace("typescript-duckdb/package.json", '"version": "0.20.1"', '"version": "0.21.0"')
          replace("typescript-duckdb/package.json", '"okf-parser": "^0.20.1"', '"okf-parser": "^0.21.0"')
          replace(
              "typescript/src/version.ts",
              'export const PROTOCOL_VERSION = "0.20.1";',
              'export const PROTOCOL_VERSION = "0.21.0";',
          )
          Path("changelog/0.21.0.md").write_text('''---\ntype: Release\ntitle: okf-parser 0.21.0\ndescription: expose RFC 0006 typed materialization as a public in-process Ibis API\n---\n\n# okf-parser 0.21.0\n\n- `Bundle.compile_types(spec_template)` exposes the same RFC 0006 typed-table compiler used by persistent DuckDB export as live Ibis relations (#51).\n- `TypedRelations` owns its ephemeral DuckDB/Ibis backend, supports context-manager cleanup, deterministic type iteration and `typed[concept_type]` lookup.\n- Declared DuckDB logical types remain visible through the returned Ibis table schema and typed query results; raw-plus-typed semantics are unchanged.\n- Bundle diagnostics remain separately inspectable, while declaration/materialization failures continue to raise their existing structured exceptions.\n- A bundle with no declarations returns an empty typed relation set rather than creating a second inferred type system.\n- No MCP tool was added for live Ibis handles: MCP stays on serializable service operations and continues to rely on FastMCP for transport/schema behavior.\n''', encoding="utf-8")
          PY

      - name: Refresh derived metadata and validate
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          uv sync --frozen --all-groups
          uv run ruff format .
          uv run ruff check .
          uv run ty check src tests
          uv run pytest
          uv run python scripts/release_contract.py verify-source --root .

      - name: Commit final patch and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-0-21-0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expose public typed Ibis relations"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
