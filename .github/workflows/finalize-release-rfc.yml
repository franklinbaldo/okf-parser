name: Finalize Release RFC

on:
  push:
    branches:
      - rfc/atomic-multi-registry-release

permissions:
  contents: write

concurrency:
  group: finalize-release-rfc
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out RFC branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: rfc/atomic-multi-registry-release
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Synchronize version metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = text.replace('version = "0.11.0"', 'version = "0.11.1"', 1)
          pyproject.write_text(text, encoding="utf-8")

          protocol = Path("typescript/src/version.ts")
          text = protocol.read_text(encoding="utf-8")
          text = text.replace('"0.11.0"', '"0.11.1"', 1)
          protocol.write_text(text, encoding="utf-8")
          PY
          npm --prefix typescript version 0.11.1 --no-git-tag-version
          npm --prefix typescript-duckdb version 0.11.1 --no-git-tag-version
          npm --prefix typescript-duckdb pkg set 'peerDependencies.okf-parser=^0.11.1'
          uv lock
          npm install --prefix typescript --package-lock-only --ignore-scripts
          npm install --prefix typescript-duckdb --package-lock-only --ignore-scripts

      - name: Verify Python distribution
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run vulture src --min-confidence 90
          uv run pytest
          uv run okf-parser check .
          uv build

      - name: Verify TypeScript distribution
        run: |
          set -euo pipefail
          npm ci --prefix typescript
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          node typescript/dist/cli.js check . > "$RUNNER_TEMP/okf-check.json"
          node typescript/scripts/smoke-mcp-stdio.mjs

      - name: Verify DuckDB adapter
        run: |
          set -euo pipefail
          npm ci --prefix typescript-duckdb
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb

      - name: Commit verified RFC metadata
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-release-rfc.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            pyproject.toml \
            uv.lock \
            typescript/package.json \
            typescript/package-lock.json \
            typescript/src/version.ts \
            typescript-duckdb/package.json \
            typescript-duckdb/package-lock.json
          git add -u .github/workflows/finalize-release-rfc.yml
          git commit -m "docs: synchronize release RFC version"
          git push origin HEAD:rfc/atomic-multi-registry-release
