name: tmp sync 0.45.9 locks
on:
  push:
    branches: [feat/bundle-relations-sql]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bundle-relations-sql
      - uses: astral-sh/setup-uv@v6
      - name: Sync lock metadata
        run: |
          cargo update --offline -p okf-core -p okf-engine
          uv lock --offline
          git diff --check
      - name: Commit lock updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock uv.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(release): sync 0.45.9 lockfiles'
          git push origin HEAD:feat/bundle-relations-sql
