name: Clean Release Contract Tree

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: clean-release-contract-tree
  cancel-in-progress: true

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/release-contract-dry-run
          fetch-depth: 0

      - name: Remove generated dependencies and protect the tree
        shell: bash
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch typescript/node_modules typescript-duckdb/node_modules
          if ! grep -qxF 'node_modules/' .gitignore; then
            printf '\n# JavaScript dependencies\nnode_modules/\n' >> .gitignore
          fi
          rm .github/workflows/cleanup-release-contract-tree.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .gitignore
          git add -u .github/workflows/cleanup-release-contract-tree.yml
          git commit -m "fix(release): exclude generated dependencies"
          git push origin HEAD:feat/release-contract-dry-run
