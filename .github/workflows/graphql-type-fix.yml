name: GraphQL type fix

on:
  push:
    branches: [feat/graphql-read-adapter]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/graphql-read-adapter

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Apply patch
        run: python scripts/graphql_type_fix.py

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Validate type-safe GraphQL slice
        run: |
          uv run ruff format src/okf_parser/graphql_adapter.py tests/test_graphql_adapter.py
          uv run ruff check src/okf_parser/graphql_adapter.py tests/test_graphql_adapter.py
          uv run ty check src tests
          uv run pytest tests/test_graphql_adapter.py -q

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/okf_parser/graphql_adapter.py tests/test_graphql_adapter.py
          git commit -m "fix(graphql): narrow JSON result types explicitly"
          git push origin HEAD:feat/graphql-read-adapter
