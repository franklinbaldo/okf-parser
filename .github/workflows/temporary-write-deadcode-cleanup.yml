name: Temporary write dead-code cleanup

on:
  pull_request:
    branches:
      - feat/revision-digests-0.23.0

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'feat/single-concept-edit-0.24.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/single-concept-edit-0.24.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync --frozen
      - name: Remove moved dead code
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/okf_parser/apply.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import re\n', '', 1)
          text = text.replace('    RawDocument as _RawDocument,\n', '', 1)
          marker = '_FRONTMATTER_RE = re.compile(\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('old frontmatter regex marker not found')
          end = text.find('\n\n', start)
          if end < 0:
              raise SystemExit('old frontmatter regex end not found')
          text = text[:start] + text[end + 2:]
          p.write_text(text, encoding='utf-8')
          PY
      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Ty
        run: uv run ty check src tests
      - name: Vulture
        run: uv run vulture src tests --min-confidence 100
      - name: Commit clean head
        run: |
          git rm -f .github/workflows/temporary-write-deadcode-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/okf_parser/apply.py
          git commit -m 'refactor(write): remove moved apply dead code'
          git push
