name: Finish Pydantic source implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finish:
    if: github.head_ref == 'feat/pydantic-schema-source' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/pydantic-schema-source
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Regenerate derived files and validate
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          npm install --prefix typescript --package-lock-only --ignore-scripts
          npm install --prefix typescript-duckdb --package-lock-only --ignore-scripts
          uv sync --frozen --all-groups
          uv run ruff format src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
          uv run okf-parser check .
          uv build
          git rm -f .github/workflows/finish-pydantic-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: regenerate 0.20.0 derived artifacts"
          git push origin HEAD:feat/pydantic-schema-source
