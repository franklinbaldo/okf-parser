name: Fix inventory docs once

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'restack/content-digests-0.34.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: restack/content-digests-0.34.0
      - name: Align inventory docs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/cli.md')
          text = path.read_text(encoding='utf-8')
          old = '''Counts concepts by type using an Ibis relation over the parsed bundle. Always
exits `0`.

MCP tool: `inventory`.
'''
          new = '''Counts concepts by producer-defined `type`.

MCP tool: `inventory`.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one current inventory docs block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cli.md
          git commit -m 'chore: reconcile digest preparer with inventory docs'
          git push origin HEAD:restack/content-digests-0.34.0
