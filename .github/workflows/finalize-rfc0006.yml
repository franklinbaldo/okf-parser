name: Temporary final RFC 0006 cleanup

on:
  push:
    branches:
      - docs/accept-rfc0006

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/accept-rfc0006
          fetch-depth: 0
      - name: Finalize accepted RFC wording
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_final_rfc0006_cleanup.py
          git rm -f .github/workflows/finalize-rfc0006.yml scripts/_final_rfc0006_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize accepted RFC 0006 wording"
          git push origin HEAD:docs/accept-rfc0006
