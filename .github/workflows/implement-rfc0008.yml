name: Temporary RFC 0008 implementation

on:
  push:
    branches:
      - feat/rfc0008-effect-aware-mcp

concurrency:
  group: implement-rfc0008
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/rfc0008-effect-aware-mcp
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Implement, lock, validate, and clean
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_implement_rfc0008.py
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          uv sync --frozen --all-groups
          uv run ruff format src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run pytest --cov --cov-report=term-missing --cov-fail-under=85
          uv run python scripts/release_contract.py verify-source
          git rm -f .github/workflows/implement-rfc0008.yml scripts/_implement_rfc0008.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement effect-aware MCP writes"
          git push origin HEAD:feat/rfc0008-effect-aware-mcp
