name: Temporary type-pack package smoke

on:
  push:
    branches: [feat/type-packs-dogfood]

permissions:
  contents: write

jobs:
  smoke:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/type-packs-dogfood
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Verify source, embedded bundle, and installed wheel
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run pytest tests/test_type_packs.py
          uv run okf-parser check . --require-spec 'docs/types/{slug}.md' --normative-spec
          uv run okf-parser check src/okf_parser/packs/journalism \
            --require-spec 'specs/{slug}.md' --normative-spec

          rm -rf dist
          uv build
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          uv venv "$RUNNER_TEMP/type-pack-venv"
          uv pip install --python "$RUNNER_TEMP/type-pack-venv/bin/python" "$wheel"

          "$RUNNER_TEMP/type-pack-venv/bin/okf-parser" packs > "$RUNNER_TEMP/packs.json"
          grep -q 'journalism' "$RUNNER_TEMP/packs.json"
          mkdir "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/type-pack-venv/bin/okf-parser" add-pack journalism "$RUNNER_TEMP/consumer" --write \
            > "$RUNNER_TEMP/add-pack.json"
          test -f "$RUNNER_TEMP/consumer/specs/newsitem.md"
          test -f "$RUNNER_TEMP/consumer/specs/newsitem.schema.sql"
          grep -q '^pack: journalism$' "$RUNNER_TEMP/consumer/specs/newsitem.md"
          grep -q '^pack_version: "1"$' "$RUNNER_TEMP/consumer/specs/newsitem.md"

          rm .github/workflows/tmp-type-pack-package-smoke.yml
      - name: Remove temporary smoke workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test(packs): prove wheel carries journalism resources'
          git push origin HEAD:feat/type-packs-dogfood
