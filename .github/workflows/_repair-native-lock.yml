name: Repair native npm lock

on:
  push:
    branches: [perf/release-pipeline-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'perf/release-pipeline-hardening' || github.ref_name == 'perf/release-pipeline-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/release-pipeline-hardening
          fetch-depth: 0

      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Bootstrap local optional dependency in lockfile
        shell: bash
        run: |
          set -euo pipefail
          cp typescript/package.json "$RUNNER_TEMP/package.json"
          npm install --package-lock-only --ignore-scripts --prefix typescript --save-optional ../native-npm-linux-x64
          cp "$RUNNER_TEMP/package.json" typescript/package.json
          npm ci --ignore-scripts --prefix typescript
          git diff --exit-code -- typescript/package.json
          grep -q 'node_modules/okf-parser-native-linux-x64' typescript/package-lock.json
          grep -q '"version": "0.42.8"' typescript/package-lock.json

      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add typescript/package-lock.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: keep native optional dependency locked"
          git push origin HEAD:perf/release-pipeline-hardening
