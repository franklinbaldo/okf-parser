name: Temporary bump 0.45.8

on:
  push:
    branches:
      - docs/rfc-0012-relational-agent-surfaces
    paths:
      - .github/workflows/tmp-bump-0.45.8.yml

permissions:
  contents: write

jobs:
  bump:
    if: github.repository == 'franklinbaldo/okf-parser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/rfc-0012-relational-agent-surfaces
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: 0.11.21
          python-version: '3.12'
      - name: Bump synchronized release metadata
        shell: bash
        run: |
          set -euo pipefail
          files=(
            pyproject.toml
            okf-engine/Cargo.toml
            rust-core/Cargo.toml
            Cargo.lock
            native-npm-linux-x64/package.json
            typescript/package.json
            typescript/package-lock.json
            typescript/src/version.ts
            typescript-duckdb/package.json
            typescript-duckdb/package-lock.json
            README.md
            README.pypi.md
            uv.lock
          )
          for file in "${files[@]}"; do
            sed -i 's/0\.45\.7/0.45.8/g' "$file"
          done
          mkdir -p changelog/0.45.8
          mv changelog/0.45.7/rfc0012-relational-agent-surfaces.md changelog/0.45.8/
          uv lock
          git rm .github/workflows/tmp-bump-0.45.8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(release): open 0.45.8 release line'
          git push origin HEAD:docs/rfc-0012-relational-agent-surfaces
