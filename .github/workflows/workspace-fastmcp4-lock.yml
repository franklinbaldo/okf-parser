name: Workspace FastMCP 4 lock helper

on:
  push:
    branches:
      - ci/workspace-fastmcp4-lock

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/workspace-fastmcp4-lock
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Resolve exact workspace environment
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workspace-lock"
          mkdir -p "$root"
          cat > "$root/pyproject.toml" <<'TOML'
          [project]
          name = "workspace"
          version = "0.0.0"
          description = "Agent workspace configuration and portfolio orchestration"
          requires-python = ">=3.12"
          dependencies = [
              "cyclopts==4.25.2",
              "fastmcp==4.0.5",
              "okf-parser==0.45.10",
              "rich==15.0.0",
              "wisk>=0.3.0",
          ]

          [tool.uv]
          package = false
          TOML
          cd "$root"
          uv lock
          uv lock --check
          cp uv.lock "$GITHUB_WORKSPACE/workspace-fastmcp4.uv.lock"
      - name: Persist resolved lock on helper branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- workspace-fastmcp4.uv.lock && git ls-files --error-unmatch workspace-fastmcp4.uv.lock >/dev/null 2>&1; then
            echo "helper lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workspace-fastmcp4.uv.lock
          git commit -m "ci: persist workspace FastMCP 4 lock"
          git push origin HEAD:ci/workspace-fastmcp4-lock
