name: Workspace FastMCP 4 lock helper

on:
  push:
    branches:
      - ci/workspace-fastmcp4-lock

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Resolve exact workspace environment
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/workspace-lock"
          mkdir -p "$root"
          cat > "$root/pyproject.toml" <<'TOML'
          [project]
          name = "workspace"
          version = "0.0.0"
          description = "Agent workspace configuration and portfolio orchestration"
          requires-python = ">=3.12"
          dependencies = [
              "cyclopts==4.25.2",
              "fastmcp==4.0.5",
              "okf-parser==0.45.10",
              "rich==15.0.0",
              "wisk>=0.3.0",
          ]

          [tool.uv]
          package = false
          TOML
          cd "$root"
          uv lock
          uv lock --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workspace-fastmcp4-lock
          path: ${{ runner.temp }}/workspace-lock/uv.lock
          if-no-files-found: error
          retention-days: 1
