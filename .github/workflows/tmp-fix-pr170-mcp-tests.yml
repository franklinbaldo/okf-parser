name: PR170 MCP contract tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/import-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/import-preview-token
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - name: Update MCP preview/write contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_mcp.py')
          text = path.read_text(encoding='utf-8')
          old_schema = '''    import_preview = tools["import_preview"].inputSchema\n    import_write = tools["import_write"].inputSchema\n    assert import_preview == import_write\n    assert "write" not in import_preview["properties"]\n    assert import_preview["properties"]["on_conflict"]["enum"] == [\n'''
          new_schema = '''    import_preview = tools["import_preview"].inputSchema\n    import_write = tools["import_write"].inputSchema\n    preview_properties = import_preview["properties"]\n    write_properties = import_write["properties"]\n    assert "expected_preview_token" not in preview_properties\n    assert "expected_preview_token" in write_properties\n    assert write_properties | {}\n    assert {\n        key: value for key, value in write_properties.items() if key != "expected_preview_token"\n    } == preview_properties\n    assert "write" not in preview_properties\n    assert preview_properties["on_conflict"]["enum"] == [\n'''
          old_call = '''    written = cli.mcp_import_write("source.csv", "bundle", "Pessoa", on_conflict="verify-identical")\n\n    assert preview == {"written": False}\n    assert written == {"written": True}\n    assert calls[0] | {"write": True} == calls[1]\n'''
          new_call = '''    written = cli.mcp_import_write(\n        "source.csv",\n        "bundle",\n        "Pessoa",\n        on_conflict="verify-identical",\n        expected_preview_token="reviewed-token",\n    )\n\n    assert preview == {"written": False}\n    assert written == {"written": True}\n    assert calls[0] | {\n        "write": True,\n        "expected_preview_token": "reviewed-token",\n    } == calls[1]\n'''
          if old_schema not in text or old_call not in text:
              raise SystemExit('expected MCP test shape not found')
          text = text.replace(old_schema, new_schema, 1).replace(old_call, new_call, 1)
          path.write_text(text, encoding='utf-8')
          PY
          uv run ruff format tests/test_mcp.py
          uv run ruff check tests/test_mcp.py
          uv run pytest tests/test_mcp.py tests/test_import_preview_token.py
          git diff --check
      - name: Commit contract tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_mcp.py
          git diff --cached --quiet && exit 0
          git commit -m "test(import): pin preview-token MCP asymmetry"
          git push origin HEAD:feat/import-preview-token
