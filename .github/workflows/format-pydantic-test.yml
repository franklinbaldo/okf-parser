name: Format final Pydantic tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/pydantic-schema-source' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/pydantic-schema-source
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format tests/test_pydantic_source.py
          git rm .github/workflows/format-pydantic-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_pydantic_source.py
          git commit -m "style: format final Pydantic regressions"
          git push origin HEAD:feat/pydantic-schema-source
