name: Refresh 0.41 release metadata

on:
  push:
    branches:
      - release/npm-native-core
  pull_request:
    branches:
      - release/python-native-core

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/npm-native-core
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: Synchronize 0.41 source identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'pyproject.toml': [('version = "0.40.0"', 'version = "0.41.0"'), ('okf-parser-native==0.40.0', 'okf-parser-native==0.41.0')],
              'native-python-stub/pyproject.toml': [('version = "0.40.0"', 'version = "0.41.0"')],
              'rust-core/pyproject.toml': [('version = "0.40.0"', 'version = "0.41.0"')],
              'rust-core/Cargo.toml': [('version = "0.40.0"', 'version = "0.41.0"')],
              'typescript-duckdb/package.json': [('"version": "0.40.0"', '"version": "0.41.0"'), ('"okf-parser": "^0.40.0"', '"okf-parser": "^0.41.0"')],
              'typescript/src/version.ts': [('"0.40.0"', '"0.41.0"')],
              'README.md': [('@v0.40.0', '@v0.41.0')],
          }
          for raw, pairs in replacements.items():
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected {old!r} in {raw}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          lock = Path('rust-core/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          old = 'name = "okf-core"\nversion = "0.40.0"'
          new = 'name = "okf-core"\nversion = "0.41.0"'
          if old not in text:
              raise SystemExit('missing okf-core 0.40.0 root identity in rust-core/Cargo.lock')
          lock.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cat > changelog/0.41.0.md <<'EOF'
          ---
          type: Release
          title: okf-parser 0.41.0
          ---

          # okf-parser 0.41.0

          - ships the release-matched `okf-core` through an optional Linux x64 npm companion package;
          - lets ordinary `loadBundle()` discover the installed native package automatically;
          - keeps the portable TypeScript fallback when no compatible native package is available;
          - compiles Rust only in release automation, never during npm install or application startup.
          EOF
          uv lock
          npm install --prefix typescript --package-lock-only --ignore-scripts
          npm install --prefix typescript-duckdb --package-lock-only --ignore-scripts
          rm -f .github/workflows/refresh-041-metadata.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock native-python-stub/pyproject.toml rust-core/pyproject.toml rust-core/Cargo.toml rust-core/Cargo.lock typescript/package.json typescript/package-lock.json typescript-duckdb/package.json typescript-duckdb/package-lock.json typescript/src/version.ts README.md changelog/0.41.0.md .github/workflows/refresh-041-metadata.yml
          git commit -m 'chore: synchronize 0.41.0 release metadata'
          git pull --rebase origin release/npm-native-core
          git push origin HEAD:release/npm-native-core
