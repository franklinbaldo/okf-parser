name: Temporary PR lock refresh

on:
  push:
    branches:
      - fix/rfc0006-declared-schema-correctness

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/rfc0006-declared-schema-correctness

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Refresh lockfiles and formatting
        run: |
          uv lock
          uv sync --frozen --all-groups
          uv run ruff format src/okf_parser/declared_schema.py src/okf_parser/schema_export.py tests/test_declared_schema_correctness.py
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock typescript/package-lock.json typescript-duckdb/package-lock.json \
            src/okf_parser/declared_schema.py src/okf_parser/schema_export.py \
            tests/test_declared_schema_correctness.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh generated lockfiles"
          git push origin HEAD:fix/rfc0006-declared-schema-correctness
