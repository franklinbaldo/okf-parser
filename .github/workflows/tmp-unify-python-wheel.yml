name: Bootstrap unified Python wheel

on:
  push:
    branches:
      - fix/reuse-trusted-publisher-0.41.3

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reuse-trusted-publisher-0.41.3
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: python scripts/tmp_unify_python_wheel.py
      - run: uv lock
      - run: npm install --package-lock-only --ignore-scripts --prefix typescript
      - run: npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
      - name: Commit generated state
        run: |
          rm .github/workflows/tmp-unify-python-wheel.yml
          rm scripts/tmp_unify_python_wheel.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: fold native engine into okf-parser wheel"
          git push origin HEAD:fix/reuse-trusted-publisher-0.41.3
