name: Temporary regenerate PyPI README

on:
  push:
    branches: [tmp/type-packs-pypi-readme]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/type-packs-pypi-readme
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Regenerate derived PyPI README
        run: |
          set -euo pipefail
          uv run --script scripts/pypi_readme.py
          uv run --script scripts/pypi_readme.py --check
          rm .github/workflows/tmp-regenerate-pypi-readme.yml
      - name: Commit and update feature branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'docs: regenerate PyPI README for 0.45.9'
          git push origin HEAD:feat/type-packs-dogfood
