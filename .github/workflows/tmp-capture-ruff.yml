name: Temporary capture Ruff

on:
  push:
    branches: [fix/engine-loader-service-duckdb]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/engine-loader-service-duckdb
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          uv run --frozen ruff check \
            src/okf_parser/engine.py \
            src/okf_parser/duckdb.py \
            src/okf_parser/service.py \
            src/okf_parser/__init__.py \
            tests/test_engine_resolution.py \
            > RUFF_RESULT.tmp 2>&1
          cat RUFF_RESULT.tmp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUFF_RESULT.tmp
          git commit -m "chore: capture Ruff output" || true
          git push origin HEAD:fix/engine-loader-service-duckdb
