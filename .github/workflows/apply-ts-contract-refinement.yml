name: Apply TypeScript contract refinement

on:
  push:
    branches:
      - feat/typescript-core

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/typescript-core

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Rewrite the two integration modules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core_path = Path("typescript/src/core.ts")
          core = core_path.read_text(encoding="utf-8")
          yaml_import = 'import { parseDocument as parseYamlDocument } from "yaml";\n'
          if 'from "./lexemes.js"' not in core:
              if yaml_import not in core:
                  raise SystemExit("YAML import anchor not found")
              core = core.replace(
                  yaml_import,
                  yaml_import
                  + '\nimport { isIsoDateLexeme } from "./lexemes.js";\n'
                  + 'import { compareText, compareTextTuple } from "./ordering.js";\n',
                  1,
              )

          replacements = {
              '.sort(([left], [right]) => left.localeCompare(right, "en"))':
                  '.sort(([left], [right]) => compareText(left, right))',
              'entries.sort((left, right) => left.name.localeCompare(right.name, "en"));':
                  'entries.sort((left, right) => compareText(left.name, right.name));',
              'output.sort((left, right) => left.localeCompare(right, "en"))':
                  'output.sort(compareText)',
              'for (const targets of result.values()) targets.sort((left, right) => left.localeCompare(right, "en"));':
                  'for (const targets of result.values()) targets.sort(compareText);',
              '!isRealIsoDate(heading)': '!isIsoDateLexeme(heading)',
          }
          for old, new in replacements.items():
              if old not in core:
                  raise SystemExit(f"core anchor not found: {old}")
              core = core.replace(old, new)

          core, count = re.subn(
              r'  diagnostics\.sort\(\(left, right\) =>\n.*?\n  \);',
              '''  diagnostics.sort((left, right) =>
            compareTextTuple(
              [left.path, left.severity, left.code, left.message],
              [right.path, right.severity, right.code, right.message],
            ),
          );''',
              core,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"diagnostic sort replacement count: {count}")
          core, count = re.subn(
              r'function isRealIsoDate\(value: string\): boolean \{.*?\n\}\n\n',
              '',
              core,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"legacy date validator replacement count: {count}")
          if "localeCompare" in core or "isRealIsoDate" in core:
              raise SystemExit("legacy core ordering/date code remains")
          core_path.write_text(core, encoding="utf-8")

          schema_path = Path("typescript/src/schema.ts")
          schema = schema_path.read_text(encoding="utf-8")
          core_import_end = '} from "./core.js";\n'
          if 'from "./lexemes.js"' not in schema:
              if core_import_end not in schema:
                  raise SystemExit("schema core-import anchor not found")
              schema = schema.replace(
                  core_import_end,
                  core_import_end
                  + 'import {\n'
                  + '  type LexemeKind,\n'
                  + '  canClassifyAs,\n'
                  + '  classifyLexemes,\n'
                  + '} from "./lexemes.js";\n'
                  + 'import { compareText } from "./ordering.js";\n',
                  1,
              )
          old_type = 'export type CastKind = "string" | "boolean" | "integer" | "number" | "date" | "datetime";'
          if old_type not in schema:
              raise SystemExit("CastKind anchor not found")
          schema = schema.replace(old_type, 'export type CastKind = LexemeKind;', 1)
          schema, count = re.subn(
              r'^const (?:INTEGER_RE|NUMBER_RE|DATE_RE|DATETIME_RE) = .*;\n',
              '',
              schema,
              flags=re.M,
          )
          if count != 4:
              raise SystemExit(f"legacy scalar constant replacement count: {count}")
          schema, count = re.subn(
              r'function realDate\(value: string\): boolean \{.*?\n\}\n\n(?=function scalarContract)',
              '',
              schema,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"legacy inference block replacement count: {count}")
          schema = schema.replace('canCast(values, explicit)', 'canClassifyAs(values, explicit)')
          schema = schema.replace('canCast([value], explicit)', 'canClassifyAs([value], explicit)')
          schema = schema.replace('classify(values)', 'classifyLexemes(values)')
          schema = schema.replace(
              '.sort(([left], [right]) => left.localeCompare(right, "en"))',
              '.sort(([left], [right]) => compareText(left, right))',
          )
          schema = schema.replace(
              '.sort((left, right) => left.localeCompare(right, "en"))',
              '.sort(compareText)',
          )
          schema, count = re.subn(
              r'function titleFor\(name: string\): string \{.*?\n\}',
              '''function titleFor(name: string): string {
            return name
              .replaceAll("_", " ")
              .replace(/(^|\\s)(\\p{L})/gu, (_, prefix: string, letter: string) =>
                `${prefix}${letter.toUpperCase()}`,
              );
          }''',
              schema,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"title formatter replacement count: {count}")
          forbidden = (
              "localeCompare",
              "Date.parse",
              "Number.isFinite",
              "function classify(",
              "function canCast(",
              "function realDate(",
          )
          if any(item in schema for item in forbidden):
              raise SystemExit("legacy schema inference or ordering code remains")
          schema_path.write_text(schema, encoding="utf-8")
          PY

      - name: Verify the rewritten source
        run: |
          npm ci --prefix typescript
          npm run check --prefix typescript
          npm test --prefix typescript

      - name: Commit the verified rewrite
        run: |
          rm .github/workflows/apply-ts-contract-refinement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add typescript/src/core.ts typescript/src/schema.ts .github/workflows/apply-ts-contract-refinement.yml
          git commit -m "refactor(ts): make ordering and inference deterministic"
          git push origin HEAD:feat/typescript-core
