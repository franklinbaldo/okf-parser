name: Run Pydantic canonical fix

on:
  push:
    branches:
      - feat/pydantic-schema-source

permissions:
  contents: write

jobs:
  run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pydantic-schema-source
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.21
          python-version: '3.12'
      - name: Execute staged fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-pydantic-canonical.yml').read_text(encoding='utf-8')
          block = source.split('        run: |\n', 1)[1]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/fix-pydantic.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/fix-pydantic.sh
          rm .github/workflows/run-pydantic-canonical-fix.yml
          git add .github/workflows/run-pydantic-canonical-fix.yml
          git commit -m 'chore: remove canonical-output helper workflow'
          git push origin HEAD:feat/pydantic-schema-source
