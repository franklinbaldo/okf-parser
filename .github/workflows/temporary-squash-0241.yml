name: Temporary squash 0.24.1

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  squash:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Validate final tree
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version = "0.24.1"' pyproject.toml
          grep -q 'expected_preview_token' src/okf_parser/apply.py
          test -f changelog/0.24.1.md
          uv sync --frozen --all-groups
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run vulture src --min-confidence 90
          uv run pytest -q
          uv build
          npm ci --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb
      - name: Rebuild as one semantic commit on #85
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-*.yml .github/workflows/temporary-*.yaml
          git status --porcelain
          git add -A
          git fetch origin feat/single-concept-edit-0.24.0
          git reset --soft origin/feat/single-concept-edit-0.24.0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(apply): bind commits to the exact reviewed preview'
          git push --force-with-lease origin HEAD:feat/apply-reviewed-preview-token
