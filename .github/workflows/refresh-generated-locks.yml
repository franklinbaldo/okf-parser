name: Refresh generated release metadata

on:
  push:
    branches:
      - feat/auto-rust-engine

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/auto-rust-engine
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Regenerate canonical metadata
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "franklinbaldo/okf-parser@v0.38.0"
          new = "franklinbaldo/okf-parser@v0.39.0"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one {old!r}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/refresh-generated-locks.yml
      - name: Commit generated files and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock typescript/package-lock.json typescript-duckdb/package-lock.json README.md .github/workflows/refresh-generated-locks.yml
          git commit -m "chore: refresh 0.39.0 generated release metadata"
          git push origin HEAD:feat/auto-rust-engine
