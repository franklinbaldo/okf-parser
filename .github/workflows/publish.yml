name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels-linux:
    name: Build wheel (linux-${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --locked --out dist --no-default-features
          docker-options: -e DUCKDB_DOWNLOAD_LIB=1

      - name: Bundle prebuilt libduckdb into wheel
        shell: bash
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" dist target 2>/dev/null || true
          sudo apt-get update -qq && sudo apt-get install -y -qq patchelf
          lib=$(find target -path '*/duckdb-download/*' -name 'libduckdb.so' -print -quit)
          test -n "$lib"
          for wheel in dist/*.whl; do
            python3 scripts/bundle_duckdb.py --wheel "$wheel" --lib "$lib" --platform linux
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  wheels-windows:
    name: Build wheel (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Windows wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
        with:
          target: x64
          args: --release --locked --out dist --no-default-features

      - name: Bundle prebuilt libduckdb into wheel
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find target -path '*/duckdb-download/*' -name 'duckdb.dll' -print -quit)
          test -n "$lib"
          for wheel in dist/*.whl; do
            python scripts/bundle_duckdb.py --wheel "$wheel" --lib "$lib" --platform windows
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-windows-x64
          path: dist/*.whl
          if-no-files-found: error

  wheels-macos:
    name: Build wheel (macos-${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build macOS wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          DUCKDB_DOWNLOAD_LIB: "1"
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --no-default-features

      - name: Bundle prebuilt libduckdb into wheel
        shell: bash
        run: |
          set -euo pipefail
          lib=$(find target -path '*/duckdb-download/*' -name 'libduckdb.dylib' -print -quit)
          test -n "$lib"
          for wheel in dist/*.whl; do
            python3 scripts/bundle_duckdb.py --wheel "$wheel" --lib "$lib" --platform macos
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build:
    name: Collect wheels and verify release set
    needs: [wheels-linux, wheels-windows, wheels-macos, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Verify tagged source contract
        run: python scripts/release_contract.py verify-source --tag "$GITHUB_REF_NAME"

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --all-groups --no-install-project
          npm ci --prefix typescript
          npm ci --prefix typescript-duckdb

      - name: Download built wheels and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheel-*"
          path: release/python
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: release/python

      - name: Build npm-native and npm release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/npm release/native-npm
          cargo build --release --locked --manifest-path rust-core/Cargo.toml
          mkdir -p native-npm-linux-x64/bin
          cp target/release/okf-parser native-npm-linux-x64/bin/okf-core
          chmod +x native-npm-linux-x64/bin/okf-core
          (cd native-npm-linux-x64 && npm pack --pack-destination ../release/native-npm --silent)
          (cd typescript && npm pack --pack-destination ../release/npm --silent)
          (cd typescript-duckdb && npm pack --pack-destination ../release/npm --silent)

      - name: Verify bundled native artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          wheel_count=$(find release/python -maxdepth 1 -type f -name "okf_parser-${version}-*.whl" | wc -l)
          sdist_count=$(find release/python -maxdepth 1 -type f -name "okf_parser-${version}.tar.gz" | wc -l)
          npm_native="release/native-npm/okf-parser-native-linux-x64-${version}.tgz"
          test "$wheel_count" -eq 5
          test "$sdist_count" -eq 1
          test -f "$npm_native"
          for wheel in release/python/okf_parser-"${version}"-*.whl; do
            PYTHON_WHEEL="$wheel" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["PYTHON_WHEEL"])
          with zipfile.ZipFile(wheel) as archive:
              scripts = [name for name in archive.namelist() if name.endswith(('.data/scripts/okf-parser', '.data/scripts/okf-parser.exe'))]
              if len(scripts) != 1:
                  raise SystemExit(f"{wheel.name}: expected one unified okf-parser script, found {scripts}")
          PY
          done
          listing="$(tar -tzf "$npm_native")"
          grep -qx 'package/bin/okf-core' <<<"$listing"
          grep -qx 'package/package.json' <<<"$listing"

      - name: Generate immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_contract.py build-manifest \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --ref "$GITHUB_REF_NAME" \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --uv-version "$(uv --version | awk '{print $2}')"
          python scripts/release_contract.py verify-local --manifest release/manifest.json
          python scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Inspect public registry state
        run: python -m scripts.registry_state --manifest release/manifest.json --output release/registry-state.json

      - name: Smoke test each wheel installs without a Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup self uninstall -y 2>/dev/null || true
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for wheel in release/python/okf_parser-"${version}"-py3-none-manylinux*_x86_64.whl; do
            python -m venv /tmp/smoke-wheel
            /tmp/smoke-wheel/bin/pip install --quiet "$wheel"
            /tmp/smoke-wheel/bin/okf-parser --version
            /tmp/smoke-wheel/bin/okf-parser check . --exclude .git --exclude node_modules >/dev/null
            rm -rf /tmp/smoke-wheel
          done

      - name: Upload exact tested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tested release set
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js for npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download tested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/

      - name: Re-verify exact bytes before publication
        run: |
          python scripts/release_contract.py verify-local --manifest release/manifest.json
          python scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Publish Python parser (all platform wheels + sdist)
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple
        run: uv publish release/python/*

      - name: Publish npm native companion first
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./typescript/package.json').version")
          package="okf-parser-native-linux-x64"
          tarball="release/native-npm/${package}-${version}.tgz"
          if npm view "${package}@${version}" version >/dev/null 2>&1; then
            echo "${package}@${version} already exists; refusing to overwrite immutable npm state"
          else
            npm publish "$tarball" --access public
          fi

      - name: Publish npm parser
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./typescript/package.json').version")
          if npm view "okf-parser@${version}" version >/dev/null 2>&1; then
            echo "okf-parser@${version} already exists; refusing to overwrite immutable npm state"
          else
            npm publish "release/npm/okf-parser-${version}.tgz" --access public
          fi

      - name: Publish npm DuckDB adapter
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./typescript-duckdb/package.json').version")
          if npm view "okf-parser-duckdb@${version}" version >/dev/null 2>&1; then
            echo "okf-parser-duckdb@${version} already exists; refusing to overwrite immutable npm state"
          else
            npm publish "release/npm/okf-parser-duckdb-${version}.tgz" --access public
          fi

  smoke-test-public-index:
    name: Install from the public PyPI index in a clean environment
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Wait for PyPI index propagation
        shell: bash
        run: sleep 30

      - name: Remove the preinstalled Rust toolchain
        shell: bash
        # A hosted runner ships rustup/cargo by default. Removing it makes this
        # job a real regression test for okf-parser#147: if pip ever falls back
        # to a source build (missing/incompatible wheel for this platform), the
        # install fails loudly here instead of silently succeeding via a slow
        # from-source compile that masks the wheel gap.
        run: rustup self uninstall -y

      - name: Install okf-parser from PyPI (no Rust toolchain present)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m venv .smoke
          if [ -f .smoke/bin/activate ]; then . .smoke/bin/activate; else . .smoke/Scripts/activate; fi
          pip install --quiet "okf-parser==${version}"
          okf-parser --version

  finalize:
    name: Finalize GitHub release
    needs: smoke-test-public-index
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release after registry publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="changelog/${version}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "okf-parser ${version}" --notes-file "$notes"
          fi
