name: Finalize v0.41.3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release and v0.41.3 tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.41.3 >/dev/null 2>&1; then
            echo "GitHub Release v0.41.3 already exists"
          else
            gh release create v0.41.3 \
              --target 1ab91592da59697d2d400606d16f35038eae9ad2 \
              --title "okf-parser 0.41.3" \
              --notes-file changelog/0.41.3.md
          fi
