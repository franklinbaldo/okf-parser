name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels-linux:
    name: Build wheel (linux-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: ubuntu-latest
          - target: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: 2_28
          args: --release --locked --out dist --compatibility pypi

      - name: Prove the executable does not link DuckDB
        shell: bash
        run: python3 scripts/check_no_duckdb_link.py dist/*.whl

      - name: Install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/smoke"
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then bin="$RUNNER_TEMP/smoke/Scripts"; else bin="$RUNNER_TEMP/smoke/bin"; fi
          "$bin/python" -m pip install --quiet dist/*.whl
          mkdir -p "$RUNNER_TEMP/fixture"
          {
            echo '---'
            echo 'type: Note'
            echo '---'
            echo '# Note'
          } > "$RUNNER_TEMP/fixture/note.md"
          "$bin/okf-parser" --version
          "$bin/okf-parser" check "$RUNNER_TEMP/fixture"
          "$bin/okf-parser" duckdb "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/bundle.duckdb"
          BUNDLE="$RUNNER_TEMP/bundle.duckdb" "$bin/python" - <<'PY'
          import os
          import duckdb

          with duckdb.connect(os.environ["BUNDLE"], read_only=True) as connection:
              assert connection.sql("SELECT concept_type FROM okf.concepts").fetchone() == ("Note",)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  wheels-windows:
    name: Build wheel (windows-x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Windows wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: x64
          args: --release --locked --out dist --compatibility pypi

      - name: Prove the executable does not link DuckDB
        shell: bash
        run: python3 scripts/check_no_duckdb_link.py dist/*.whl

      - name: Install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/smoke"
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then bin="$RUNNER_TEMP/smoke/Scripts"; else bin="$RUNNER_TEMP/smoke/bin"; fi
          "$bin/python" -m pip install --quiet dist/*.whl
          mkdir -p "$RUNNER_TEMP/fixture"
          {
            echo '---'
            echo 'type: Note'
            echo '---'
            echo '# Note'
          } > "$RUNNER_TEMP/fixture/note.md"
          "$bin/okf-parser" --version
          "$bin/okf-parser" check "$RUNNER_TEMP/fixture"
          "$bin/okf-parser" duckdb "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/bundle.duckdb"
          BUNDLE="$RUNNER_TEMP/bundle.duckdb" "$bin/python" - <<'PY'
          import os
          import duckdb

          with duckdb.connect(os.environ["BUNDLE"], read_only=True) as connection:
              assert connection.sql("SELECT concept_type FROM okf.concepts").fetchone() == ("Note",)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-windows-x64
          path: dist/*.whl
          if-no-files-found: error

  wheels-macos:
    name: Build wheel (macos-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            runner: macos-15-intel
          - target: aarch64
            runner: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build macOS wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          args: --release --locked --out dist --compatibility pypi

      - name: Prove the executable does not link DuckDB
        shell: bash
        run: python3 scripts/check_no_duckdb_link.py dist/*.whl

      - name: Install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/smoke"
          if [ -d "$RUNNER_TEMP/smoke/Scripts" ]; then bin="$RUNNER_TEMP/smoke/Scripts"; else bin="$RUNNER_TEMP/smoke/bin"; fi
          "$bin/python" -m pip install --quiet dist/*.whl
          mkdir -p "$RUNNER_TEMP/fixture"
          {
            echo '---'
            echo 'type: Note'
            echo '---'
            echo '# Note'
          } > "$RUNNER_TEMP/fixture/note.md"
          "$bin/okf-parser" --version
          "$bin/okf-parser" check "$RUNNER_TEMP/fixture"
          "$bin/okf-parser" duckdb "$RUNNER_TEMP/fixture" "$RUNNER_TEMP/bundle.duckdb"
          BUNDLE="$RUNNER_TEMP/bundle.duckdb" "$bin/python" - <<'PY'
          import os
          import duckdb

          with duckdb.connect(os.environ["BUNDLE"], read_only=True) as connection:
              assert connection.sql("SELECT concept_type FROM okf.concepts").fetchone() == ("Note",)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-macos-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build:
    name: Collect wheels and verify release set
    needs: [wheels-linux, wheels-windows, wheels-macos, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            typescript/package-lock.json
            typescript-duckdb/package-lock.json

      - name: Verify tagged source contract
        run: python scripts/release_contract.py verify-source --tag "$GITHUB_REF_NAME"

      - name: Install locked build dependencies
        run: |
          uv sync --frozen --all-groups --no-install-project
          npm ci --prefix typescript
          npm ci --prefix typescript-duckdb

      - name: Download built wheels and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheel-*"
          path: release/python
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: release/python

      - name: Build npm-native and npm release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/npm release/native-npm native-npm-linux-x64/bin
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          wheel=$(find release/python -maxdepth 1 -type f -name "okf_parser-${version}-py3-none-manylinux*_x86_64.whl" -print -quit)
          test -n "$wheel"
          python scripts/native_from_wheel.py extract "$wheel" native-npm-linux-x64/bin/okf-core
          (cd native-npm-linux-x64 && npm pack --pack-destination ../release/native-npm --silent)
          (cd typescript && npm pack --pack-destination ../release/npm --silent)
          (cd typescript-duckdb && npm pack --pack-destination ../release/npm --silent)

      - name: Verify bundled native artifacts
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          wheel_count=$(find release/python -maxdepth 1 -type f -name "okf_parser-${version}-*.whl" | wc -l)
          sdist_count=$(find release/python -maxdepth 1 -type f -name "okf_parser-${version}.tar.gz" | wc -l)
          npm_native="release/native-npm/okf-parser-native-linux-x64-${version}.tgz"
          test "$wheel_count" -eq 5
          test "$sdist_count" -eq 1
          test -f "$npm_native"
          for wheel in release/python/okf_parser-"${version}"-*.whl; do
            PYTHON_WHEEL="$wheel" python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          wheel = Path(os.environ["PYTHON_WHEEL"])
          with zipfile.ZipFile(wheel) as archive:
              scripts = [name for name in archive.namelist() if name.endswith(('.data/scripts/okf-parser', '.data/scripts/okf-parser.exe'))]
              if len(scripts) != 1:
                  raise SystemExit(f"{wheel.name}: expected one unified okf-parser script, found {scripts}")
          PY
          done
          listing="$(tar -tzf "$npm_native")"
          grep -qx 'package/bin/okf-core' <<<"$listing"
          grep -qx 'package/package.json' <<<"$listing"
          wheel=$(find release/python -maxdepth 1 -type f -name "okf_parser-${version}-py3-none-manylinux*_x86_64.whl" -print -quit)
          python scripts/native_from_wheel.py verify "$wheel" "$npm_native"

      - name: Generate immutable manifest
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_contract.py build-manifest \
            --directory release \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$(git rev-parse HEAD)" \
            --ref "$GITHUB_REF_NAME" \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --node-version "$(node --version)" \
            --npm-version "$(npm --version)" \
            --uv-version "$(uv --version | awk '{print $2}')"
          python scripts/release_contract.py verify-local --manifest release/manifest.json
          python scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Inspect public registry state
        run: python -m scripts.registry_state --manifest release/manifest.json --output release/registry-state.json

      - name: Re-smoke the host wheel without a Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup self uninstall -y 2>/dev/null || true
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for wheel in release/python/okf_parser-"${version}"-py3-none-manylinux*_x86_64.whl; do
            python -m venv /tmp/smoke-wheel
            /tmp/smoke-wheel/bin/pip install --quiet "$wheel"
            /tmp/smoke-wheel/bin/okf-parser --version
            /tmp/smoke-wheel/bin/okf-parser check . --exclude .git --exclude node_modules >/dev/null
            rm -rf /tmp/smoke-wheel
          done

      - name: Upload exact tested release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish tested release set
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Download tested release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: release/

      - name: Re-verify exact bytes before publication
        run: |
          python scripts/release_contract.py verify-local --manifest release/manifest.json
          python scripts/release_contract.py verify-contents --manifest release/manifest.json

      - name: Publish Python parser (all platform wheels + sdist)
        env:
          UV_PUBLISH_CHECK_URL: https://pypi.org/simple
        run: uv publish release/python/*

  smoke-test-public-index:
    name: Install from the public PyPI index in a clean environment
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15, macos-15-intel]
    steps:
      - name: Wait for PyPI index propagation
        shell: bash
        # A flat `sleep 30` raced the index: the v0.45.2 run published fine and
        # then failed here with "Could not find a version that satisfies the
        # requirement", because the file was on PyPI but not yet in the simple
        # index this runner read. Poll the release endpoint instead of guessing
        # a duration.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 30); do
            if curl -sfL -o /dev/null "https://pypi.org/pypi/okf-parser/${version}/json"; then
              echo "okf-parser ${version} visible on PyPI after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::okf-parser ${version} did not appear on PyPI within 5 minutes"
          exit 1

      - name: Remove the preinstalled Rust toolchain
        shell: bash
        # A hosted runner ships rustup/cargo by default. Removing it makes this
        # job a real regression test for okf-parser#147: if pip ever falls back
        # to a source build (missing/incompatible wheel for this platform), the
        # install fails loudly here instead of silently succeeding via a slow
        # from-source compile that masks the wheel gap.
        #
        # Best-effort: the Homebrew rustup on the macOS runners answers
        # "self-uninstall is disabled for this build of rustup" and exits 1,
        # which failed both macOS smoke jobs of v0.45.2 before pip ever ran and
        # skipped the Finalize job. The guarantee itself no longer depends on
        # this step succeeding -- the install below passes
        # `--only-binary=:all:`, which forbids a source build outright and on
        # every platform.
        run: rustup self uninstall -y || true

      - name: Install okf-parser from PyPI (no Rust toolchain present)
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python -m venv .smoke
          if [ -f .smoke/bin/activate ]; then . .smoke/bin/activate; else . .smoke/Scripts/activate; fi
          pip install --quiet --only-binary=:all: "okf-parser==${version}"
          okf-parser --version
          mkdir -p "$RUNNER_TEMP/public-fixture"
          printf '%s\n' '---' 'type: Note' '---' '# Note' > "$RUNNER_TEMP/public-fixture/note.md"
          okf-parser check "$RUNNER_TEMP/public-fixture" >/dev/null
          okf-parser duckdb "$RUNNER_TEMP/public-fixture" "$RUNNER_TEMP/public.duckdb" >/dev/null
          BUNDLE="$RUNNER_TEMP/public.duckdb" python - <<'PY'
          import os
          import duckdb

          with duckdb.connect(os.environ["BUNDLE"], read_only=True) as connection:
              assert connection.sql("SELECT concept_type FROM okf.concepts").fetchone() == ("Note",)
          PY

  finalize:
    name: Finalize GitHub release
    needs: smoke-test-public-index
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release after registry publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="changelog/${version}.md"
          test -f "$notes"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "okf-parser ${version}" --notes-file "$notes"
          fi
