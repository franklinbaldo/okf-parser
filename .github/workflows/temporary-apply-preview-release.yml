name: Temporary apply preview release

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Require reviewed-preview implementation
        run: |
          grep -F 'expected_preview_token' src/okf_parser/apply.py
          grep -F 'okf-apply-preview-v1-sha256:' src/okf_parser/apply.py
      - name: Synchronize 0.24.1 release metadata
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('pyproject.toml'): [('version = "0.24.0"', 'version = "0.24.1"')],
              Path('typescript/package.json'): [('"version": "0.24.0"', '"version": "0.24.1"')],
              Path('typescript-duckdb/package.json'): [
                  ('"version": "0.24.0"', '"version": "0.24.1"'),
                  ('"okf-parser": "^0.24.0"', '"okf-parser": "^0.24.1"'),
              ],
              Path('typescript/src/version.ts'): [
                  ('PROTOCOL_VERSION = "0.24.0"', 'PROTOCOL_VERSION = "0.24.1"'),
              ],
              Path('README.md'): [
                  ('franklinbaldo/okf-parser@v0.24.0', 'franklinbaldo/okf-parser@v0.24.1'),
              ],
          }
          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          uv lock
          npm --prefix typescript install --package-lock-only --ignore-scripts
          npm --prefix typescript-duckdb install --package-lock-only --ignore-scripts
      - name: Validate release tree
        run: |
          uv sync --frozen
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run ty check src tests
          uv run vulture src tests --min-confidence 100
          uv run pytest -q
          uv build
          npm --prefix typescript ci
          npm --prefix typescript test
          npm --prefix typescript run build
          npm --prefix typescript-duckdb ci
          npm --prefix typescript-duckdb test
          npm --prefix typescript-duckdb run build
      - name: Commit clean release head
        run: |
          git rm -f .github/workflows/temporary-apply-preview-release.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock README.md changelog/0.24.1.md \
            typescript/package.json typescript/package-lock.json typescript/src/version.ts \
            typescript-duckdb/package.json typescript-duckdb/package-lock.json
          git commit -m 'chore(release): sync reviewed apply preview 0.24.1'
          git push
