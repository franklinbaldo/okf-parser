name: Prepare reconciled single-concept edit 0.36.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'feat/single-concept-edit-0.24.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/single-concept-edit-0.24.0
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Extract and reconcile PR 85 semantic delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin archive/single-concept-edit-0.24.0
          git checkout origin/archive/single-concept-edit-0.24.0 -- \
            src/okf_parser/apply.py \
            src/okf_parser/edit.py \
            src/okf_parser/write_support.py \
            tests/test_edit.py

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one marker, found {count}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Preserve PR 85's shared write-safety refactor, but reconcile it with
          # the current single linear frontmatter scanner and canonical digests.
          replace_once("src/okf_parser/write_support.py", "import re\n", "")
          replace_once(
              "src/okf_parser/write_support.py",
              "from okf_parser.bundle import validate_path\n",
              "from okf_parser.bundle import validate_path\nfrom okf_parser.digests import normalize_newlines\n",
          )
          replace_once(
              "src/okf_parser/write_support.py",
              '''from okf_parser.parser import (\n    DocumentParseError,\n    concept_id,\n    is_reserved_document,\n    parse_document_text,\n)\n''',
              '''from okf_parser.parser import (\n    DocumentParseError,\n    _split_frontmatter_source,\n    concept_id,\n    is_reserved_document,\n    parse_document_text,\n)\n''',
          )
          replace_once(
              "src/okf_parser/write_support.py",
              '''_FRONTMATTER_RE = re.compile(\n    r"\\A---[ \\t]*\\r?\\n(.*?)(?:\\r?\\n)?---[ \\t]*(?:\\r?\\n(.*))?\\Z",\n    re.DOTALL,\n)\n\n\n''',
              "",
          )
          replace_once(
              "src/okf_parser/write_support.py",
              '''    crlf = "\\r\\n" in text\n    normalized = text.replace("\\r\\n", "\\n")\n    match = _FRONTMATTER_RE.match(normalized)\n    if match is None:\n        return None\n    return RawDocument(\n        bom=bom,\n        crlf=crlf,\n        frontmatter_text=match.group(1),\n        body_text=match.group(2) or "",\n    )\n''',
              '''    crlf = "\\r\\n" in text\n    split = _split_frontmatter_source(normalize_newlines(text))\n    if split is None:\n        return None\n    frontmatter_text, body_text = split\n    return RawDocument(\n        bom=bom,\n        crlf=crlf,\n        frontmatter_text=frontmatter_text,\n        body_text=body_text,\n    )\n''',
          )
          replace_once(
              "src/okf_parser/write_support.py",
              '''    body: str\n    content_hash: str\n    raw: RawDocument\n''',
              '''    body: str\n    source_digest: str\n    parsed_digest: str\n    content_hash: str\n    raw: RawDocument\n''',
          )
          replace_once(
              "src/okf_parser/write_support.py",
              '''        frontmatter=dict(parsed.frontmatter),\n        body=parsed.body,\n        content_hash=hashlib.sha256(raw).hexdigest(),\n''',
              '''        frontmatter=dict(parsed.frontmatter),\n        body=parsed.body,\n        source_digest=parsed.source_digest,\n        parsed_digest=parsed.parsed_digest,\n        content_hash=hashlib.sha256(raw).hexdigest(),\n''',
          )

          # Canonical identities are already part of the coherent snapshot.
          replace_once("src/okf_parser/edit.py", "from okf_parser.parser import parse_document_text\n", "")
          replace_once(
              "src/okf_parser/edit.py",
              '''def _snapshot_parsed_digest(concept: _Concept) -> str:\n    """Compute parsed identity from the snapshot bytes without rereading disk."""\n    text = "---\\n" + concept.raw.frontmatter_text\n    if not text.endswith("\\n"):\n        text += "\\n"\n    text += "---\\n" + concept.raw.body_text\n    return parse_document_text(concept.path, text).parsed_digest\n\n\n''',
              "",
          )
          replace_once(
              "src/okf_parser/edit.py",
              '''    current_source_digest = f"sha256:{concept.content_hash}"\n    current_parsed_digest = _snapshot_parsed_digest(concept)\n''',
              '''    current_source_digest = concept.source_digest\n    current_parsed_digest = concept.parsed_digest\n''',
          )

          # Old branch predates current lint policy. These two internal helpers
          # deliberately accept independent write-contract inputs rather than a
          # public request object, so document that fact locally.
          replace_once(
              "src/okf_parser/edit.py",
              "def _edit_concept(\n",
              "def _edit_concept(  # noqa: PLR0913 -- independent edit safety inputs.\n",
          )
          replace_once(
              "src/okf_parser/write_support.py",
              "def stage_validate_write(\n",
              "def stage_validate_write(  # noqa: PLR0913 -- shared write safety inputs.\n",
          )
          replace_once(
              "src/okf_parser/write_support.py",
              '''            if before_stat != after_stat:\n                raise WriteSupportError(f"file changed while it was being read: {posix}")\n''',
              '''            if before_stat != after_stat:\n                message = f"file changed while it was being read: {posix}"\n                raise WriteSupportError(message)\n''',
          )

          # Public Python/core service only, exactly as #65 specifies. Transport
          # adapters remain a later concern.
          replace_once(
              "src/okf_parser/__init__.py",
              "from okf_parser.bundle import Bundle, load_bundle, validate_path\n",
              "from okf_parser.bundle import Bundle, load_bundle, validate_path\nfrom okf_parser.edit import EditError, preview_concept_edit, write_concept_edit\n",
          )
          replace_once("src/okf_parser/__init__.py", '    "Bundle",\n', '    "Bundle",\n    "EditError",\n')
          replace_once(
              "src/okf_parser/__init__.py",
              '    "load_bundle",\n',
              '    "load_bundle",\n    "preview_concept_edit",\n',
          )
          replace_once(
              "src/okf_parser/__init__.py",
              '    "validate_path",\n',
              '    "validate_path",\n    "write_concept_edit",\n',
          )
          replace_once(
              "src/okf_parser/service.py",
              "from okf_parser.duckdb import attach_okf\n",
              "from okf_parser.duckdb import attach_okf\nfrom okf_parser.edit import preview_concept_edit as _preview_concept_edit\nfrom okf_parser.edit import write_concept_edit as _write_concept_edit\n",
          )
          service_methods = '''\n\ndef preview_concept_edit(\n    path: str,\n    concept_id: str,\n    body: str,\n    expected_source_digest: str,\n    exclude: Sequence[str] = (),\n) -> dict[str, object]:\n    """Preview one conflict-safe Markdown body replacement."""\n    return _preview_concept_edit(\n        path, concept_id, body, expected_source_digest, exclude=exclude\n    )\n\n\ndef write_concept_edit(\n    path: str,\n    concept_id: str,\n    body: str,\n    expected_source_digest: str,\n    exclude: Sequence[str] = (),\n) -> dict[str, object]:\n    """Commit one conflict-safe Markdown body replacement."""\n    return _write_concept_edit(\n        path, concept_id, body, expected_source_digest, exclude=exclude\n    )\n'''
          replace_once(
              "src/okf_parser/service.py",
              "\n\ndef export_duckdb(\n",
              service_methods + "\n\ndef export_duckdb(\n",
          )

          # Bring the old test module up to current repo hygiene.
          replace_once(
              "tests/test_edit.py",
              "from __future__ import annotations\n\nfrom pathlib import Path\n\nimport pytest\n",
              '''"""Regression tests for conflict-safe single-concept editing."""\n\nfrom __future__ import annotations\n\nfrom typing import TYPE_CHECKING\n\nimport pytest\n\nif TYPE_CHECKING:\n    from pathlib import Path\n''',
          )

          # The physical writer must recognize exactly the same legal delimiters
          # as the parser, while retaining original BOM/newline convention.
          with Path("tests/test_edit.py").open("a", encoding="utf-8") as handle:
              handle.write('''\n\ndef test_edit_uses_canonical_linear_frontmatter_boundaries(tmp_path: Path) -> None:\n    concept = tmp_path / "note.md"\n    concept.write_bytes(\n        b"\\xef\\xbb\\xbf---   \\r\\ntype: Note\\r\\ntitle: Kept\\r\\n---\\t\\r\\nold\\r\\n"\n    )\n    source = load_bundle(tmp_path).concepts.execute().iloc[0]["source_digest"]\n\n    result = write_concept_edit(str(tmp_path), "note", "new\\n", str(source))\n\n    assert result["succeeded"] is True\n    assert result["written"] is True\n    written = concept.read_bytes()\n    assert written.startswith(b"\\xef\\xbb\\xbf---\\r\\n")\n    assert b"title: Kept\\r\\n" in written\n    assert written.endswith(b"---\\r\\nnew\\r\\n")\n''')

          replacements = {
              "pyproject.toml": [('version = "0.35.0"', 'version = "0.36.0"')],
              "typescript/package.json": [('"version": "0.35.0"', '"version": "0.36.0"')],
              "typescript-duckdb/package.json": [
                  ('"version": "0.35.0"', '"version": "0.36.0"'),
                  ('"okf-parser": "^0.35.0"', '"okf-parser": "^0.36.0"'),
              ],
              "typescript/src/version.ts": [('PROTOCOL_VERSION = "0.35.0"', 'PROTOCOL_VERSION = "0.36.0"')],
              "README.md": [("franklinbaldo/okf-parser@v0.35.0", "franklinbaldo/okf-parser@v0.36.0")],
          }
          for name, pairs in replacements.items():
              target = Path(name)
              text = target.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{name}: expected one {old!r}, found {count}")
                  text = text.replace(old, new)
              target.write_text(text, encoding="utf-8")

          Path("changelog/0.36.0.md").write_text('''---\ntype: Release\ntitle: okf-parser 0.36.0\ndescription: add conflict-safe single-concept Markdown body preview and commit services\n---\n\n# okf-parser 0.36.0\n\n- add public/service `preview_concept_edit` and `write_concept_edit` for bounded body-only editing of one existing concept;\n- require canonical `expected_source_digest` so stale editor forms fail closed instead of overwriting newer source;\n- preserve authored frontmatter text, BOM and newline convention while replacing only the Markdown body;\n- return exact candidate `source_digest` and `parsed_digest` during preview;\n- extract coherent snapshotting, physical reconstruction, candidate staging, validation and whole-bundle freshness checks into package-internal `write_support.py` shared by `apply` and `edit`;\n- reconcile that shared writer with the current linear frontmatter scanner and canonical digest identities rather than keeping apply's historical regex splitter/reparse path;\n- keep transport out of the core contract as required by #65: no GraphQL/MCP/REST choice is introduced here.\n''', encoding="utf-8")
          PY

      - name: Refresh locks
        run: |
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb

      - name: Validate full write stack
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run vulture src tests --min-confidence 100
          uv run pytest -q
          uv run python scripts/release_contract.py verify-source --root .
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb
          cargo fmt --manifest-path rust-core/Cargo.toml --check
          cargo test --locked --manifest-path rust-core/Cargo.toml

      - name: Publish clean review head
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/prepare-single-concept-edit-0.36.0-v2.yml
          rm -f .edit-036-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(edit): add conflict-safe single-concept body preview/write'
          git push origin HEAD:feat/single-concept-edit-0.24.0
