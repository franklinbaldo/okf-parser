name: Temporary restack reviewed apply token

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  restack:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Preserve semantic delta and restack
        shell: bash
        run: |
          set -euo pipefail
          old_parent=e4b5dc83079ea366ab76d7943956b0924be2df09
          new_parent=$(git rev-parse origin/feat/single-concept-edit-0.24.0)
          git diff --binary "$old_parent" HEAD -- . ':(exclude).github/workflows/temporary-*' > "$RUNNER_TEMP/token.patch"
          git reset --hard "$new_parent"
          git apply --3way "$RUNNER_TEMP/token.patch"
          rm -f .github/workflows/temporary-*.yml .github/workflows/temporary-*.yaml
          grep -q 'version = "0.24.1"' pyproject.toml
          grep -q 'expected_preview_token' src/okf_parser/apply.py
          test -f changelog/0.24.1.md
          test -f tests/test_apply_preview_token.py
          test -f tests/test_apply_preview_token_noop.py
      - name: Validate final 0.24.1 tree
        run: |
          uv sync --frozen --all-groups
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run vulture src --min-confidence 90
          uv run pytest -q
          uv build
          npm ci --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb
      - name: Commit as one semantic slice
        shell: bash
        run: |
          git add -A
          git reset --soft origin/feat/single-concept-edit-0.24.0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'feat(apply): bind commits to the exact reviewed preview'
          git push --force-with-lease origin HEAD:feat/apply-reviewed-preview-token
