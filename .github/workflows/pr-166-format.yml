name: PR 166 format regression test

on:
  push:
    branches:
      - fix/registry-state-native-npm

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/registry-state-native-npm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Format only the new regression test
        run: uvx ruff@0.15.22 format tests/test_registry_state_native_npm.py
      - name: Commit formatted test if needed
        shell: bash
        run: |
          set -euo pipefail
          git add tests/test_registry_state_native_npm.py
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format native npm registry regression test'
          git push origin HEAD:fix/registry-state-native-npm
