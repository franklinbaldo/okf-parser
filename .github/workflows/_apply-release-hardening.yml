name: Apply release hardening

on:
  push:
    branches: [perf/release-pipeline-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'perf/release-pipeline-hardening' || github.ref_name == 'perf/release-pipeline-hardening'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: perf/release-pipeline-hardening

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Apply source and workflow changes
        run: |
          python .github/scripts/apply_release_hardening.py
          cp .github/scripts/native_from_wheel_source.py scripts/native_from_wheel.py
          python .github/scripts/clippy_cleanup.py

      - name: Regenerate synchronized lockfiles
        shell: bash
        run: |
          set -euo pipefail
          cargo check --workspace
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb

      - name: Format and validate the changed contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          uv sync --frozen --all-groups
          uv run ruff format scripts/native_from_wheel.py scripts/release_contract.py tests/test_native_from_wheel.py tests/test_release_contract.py
          uv run ruff check scripts/native_from_wheel.py scripts/release_contract.py tests/test_native_from_wheel.py tests/test_release_contract.py --fix
          cargo clippy --workspace --all-targets --locked -- -D warnings
          uv run pytest tests/test_release_contract.py tests/test_native_from_wheel.py
          uv run python scripts/release_contract.py verify-source

      - name: Remove migration-only files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_release_hardening.py .github/scripts/native_from_wheel_source.py .github/scripts/clippy_cleanup.py .github/workflows/_apply-release-hardening.yml
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "perf: harden and deduplicate release artifacts"
          git push origin HEAD:perf/release-pipeline-hardening
