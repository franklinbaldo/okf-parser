name: Prepare content digests 0.34.0

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'restack/content-digests-0.34.0'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: restack/content-digests-0.34.0
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.21'
          python-version: '3.12'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Apply digest contract to current architecture
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/revision-digests-0.23.0
          git checkout origin/feat/revision-digests-0.23.0 -- \
            conformance/content-digests.json \
            src/okf_parser/digests.py \
            tests/test_content_digests.py \
            typescript/test/content-digests.test.ts \
            typescript-duckdb/test/digests.test.ts

          cat > typescript/src/digests.ts <<'EOF'
          import { createHash } from "node:crypto";

          import type { FrontmatterObject, FrontmatterValue } from "./core.js";

          function sha256(text: string): string {
            return createHash("sha256").update(text, "utf8").digest("hex");
          }

          export function normalizeNewlines(text: string): string {
            return text.replaceAll("\r\n", "\n").replaceAll("\r", "\n");
          }

          function assertJcsString(value: string): void {
            for (let index = 0; index < value.length; index += 1) {
              const unit = value.charCodeAt(index);
              if (unit >= 0xd800 && unit <= 0xdbff) {
                const next = value.charCodeAt(index + 1);
                if (next < 0xdc00 || next > 0xdfff) {
                  throw new TypeError("JCS strings must not contain lone UTF-16 surrogates");
                }
                index += 1;
              } else if (unit >= 0xdc00 && unit <= 0xdfff) {
                throw new TypeError("JCS strings must not contain lone UTF-16 surrogates");
              }
            }
          }

          function jcsString(value: string): string {
            assertJcsString(value);
            return JSON.stringify(value);
          }

          export function canonicalJson(value: FrontmatterValue): string {
            if (value === null) return "null";
            if (typeof value === "string") return jcsString(value);
            if (Array.isArray(value)) return `[${value.map(canonicalJson).join(",")}]`;
            const object = value as FrontmatterObject;
            const properties = Object.keys(object).sort();
            return `{${properties
              .map((property) => `${jcsString(property)}:${canonicalJson(object[property] ?? null)}`)
              .join(",")}}`;
          }

          export function sourceDigest(content: string): string {
            return `sha256:${sha256(content)}`;
          }

          export function parsedDigest(
            frontmatter: Readonly<Record<string, FrontmatterValue>>,
            body: string,
          ): string {
            const payload: FrontmatterValue = [frontmatter, normalizeNewlines(body)];
            return `okf-parsed-v1-jcs-sha256:${sha256(canonicalJson(payload))}`;
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Python domain records.
          replace_once(
              'src/okf_parser/models.py',
              '    description: str | None\n    frontmatter_json: str\n',
              '    description: str | None\n    source_digest: str\n    parsed_digest: str\n    frontmatter_json: str\n',
          )
          replace_once(
              'src/okf_parser/models.py',
              '    path: Path\n    frontmatter: dict[str, YamlValue]\n    body: str\n',
              '    path: Path\n    frontmatter: dict[str, YamlValue]\n    body: str\n    source_digest: str\n    parsed_digest: str\n',
          )

          # Python parser: hash exact valid UTF-8 source, but preserve existing
          # universal-newline parsed/body semantics before the linear splitter.
          replace_once(
              'src/okf_parser/parser.py',
              'from okf_parser.discovery import is_markdown_filename\n',
              'from okf_parser.digests import normalize_newlines, parsed_digest, source_digest\nfrom okf_parser.discovery import is_markdown_filename\n',
          )
          replace_once(
              'src/okf_parser/parser.py',
              '''    try:\n        text = path.read_text(encoding="utf-8")\n    except UnicodeDecodeError as exc:\n''',
              '''    try:\n        text = path.read_bytes().decode("utf-8")\n    except UnicodeDecodeError as exc:\n''',
          )
          replace_once(
              'src/okf_parser/parser.py',
              '''    split = _split_frontmatter_source(text)\n    if split is None:\n        msg = "concept must start with YAML frontmatter delimited by ---"\n        raise DocumentParseError(msg)\n    frontmatter, body = split\n\n    return ParsedDocument(\n        path=path,\n        frontmatter=_load_frontmatter(frontmatter) or {},\n        body=body,\n    )\n''',
              '''    source_identity = source_digest(text)\n    split = _split_frontmatter_source(normalize_newlines(text))\n    if split is None:\n        msg = "concept must start with YAML frontmatter delimited by ---"\n        raise DocumentParseError(msg)\n    frontmatter_block, body = split\n    frontmatter = _load_frontmatter(frontmatter_block) or {}\n\n    return ParsedDocument(\n        path=path,\n        frontmatter=frontmatter,\n        body=body,\n        source_digest=source_identity,\n        parsed_digest=parsed_digest(frontmatter, body),\n    )\n''',
          )

          # Canonical Bundle relation.
          replace_once(
              'src/okf_parser/bundle.py',
              '        "description": "string",\n        "frontmatter_json": "string",\n',
              '        "description": "string",\n        "source_digest": "string",\n        "parsed_digest": "string",\n        "frontmatter_json": "string",\n',
          )
          replace_once(
              'src/okf_parser/bundle.py',
              '''        title=parsed.title,\n        description=parsed.description,\n        frontmatter_json=parsed.frontmatter_json,\n''',
              '''        title=parsed.title,\n        description=parsed.description,\n        source_digest=parsed.source_digest,\n        parsed_digest=parsed.parsed_digest,\n        frontmatter_json=parsed.frontmatter_json,\n''',
          )

          # Inventory stays simple by default; digest rows are opt-in.
          replace_once(
              'src/okf_parser/service.py',
              'def inventory_bundle(path: str, exclude: Sequence[str] = ()) -> dict[str, object]:\n',
              'def inventory_bundle(\n    path: str, exclude: Sequence[str] = (), *, digests: bool = False\n) -> dict[str, object]:\n',
          )
          replace_once(
              'src/okf_parser/service.py',
              '''    return {"root": str(bundle.root), "types": rows}\n\n\ndef graph_bundle''',
              '''    payload: dict[str, object] = {"root": str(bundle.root), "types": rows}\n    if digests:\n        payload["digests"] = (\n            bundle.concepts.select("concept_id", "path", "source_digest", "parsed_digest")\n            .order_by("path")\n            .execute()\n            .to_dict(orient="records")\n        )\n    return payload\n\n\ndef graph_bundle''',
          )
          replace_once(
              'src/okf_parser/cli.py',
              '''@app.command\ndef inventory(path: str, *, exclude: RepeatableStrings = None) -> CliResult[JsonPayload]:\n    """Count concepts by type using an Ibis relation."""\n    return CliResult(inventory_bundle(path, exclude or ()))\n''',
              '''@app.command\ndef inventory(\n    path: str, *, exclude: RepeatableStrings = None, digests: bool = False\n) -> CliResult[JsonPayload]:\n    """Count concepts by type and optionally expose deterministic content digests."""\n    return CliResult(inventory_bundle(path, exclude or (), digests=digests))\n''',
          )
          replace_once(
              'src/okf_parser/cli.py',
              '''def mcp_inventory(\n    path: str, exclude: RepeatableStrings = None\n) -> dict[str, object]:\n    """Count concepts by type."""\n    return inventory_bundle(path, exclude or ())\n''',
              '''def mcp_inventory(\n    path: str, exclude: RepeatableStrings = None, *, digests: bool = False\n) -> dict[str, object]:\n    """Count concepts by type and optionally expose deterministic content digests."""\n    return inventory_bundle(path, exclude or (), digests=digests)\n''',
          )

          # Capability-driven ingestion: exact source identity is available in
          # the same content read, but identity-only discovery still opens no files.
          replace_once(
              'src/okf_parser/ingestion.py',
              'from okf_parser.discovery import discover_markdown\n',
              'from okf_parser.digests import normalize_newlines, parsed_digest, source_digest\nfrom okf_parser.discovery import discover_markdown\n',
          )
          replace_once(
              'src/okf_parser/ingestion.py',
              '    MARKDOWN_FACTS = "markdown_facts"\n',
              '    MARKDOWN_FACTS = "markdown_facts"\n    DIGESTS = "digests"\n',
          )
          replace_once(
              'src/okf_parser/ingestion.py',
              '    facts: MarkdownFacts | None = None\n    error: str | None = None\n',
              '    facts: MarkdownFacts | None = None\n    source_digest: str | None = None\n    parsed_digest: str | None = None\n    error: str | None = None\n',
          )
          replace_once(
              'src/okf_parser/ingestion.py',
              '''            text = path.read_text(encoding="utf-8")\n            frontmatter, body = split_optional_frontmatter(text)\n''',
              '''            text = path.read_bytes().decode("utf-8")\n            frontmatter, body = split_optional_frontmatter(normalize_newlines(text))\n''',
          )
          replace_once(
              'src/okf_parser/ingestion.py',
              '''            facts = (\n                markdown_facts(body) if IngestionCapability.MARKDOWN_FACTS in requested else None\n            )\n            yield DocumentEnvelope(\n''',
              '''            facts = (\n                markdown_facts(body) if IngestionCapability.MARKDOWN_FACTS in requested else None\n            )\n            wants_digests = IngestionCapability.DIGESTS in requested\n            source_identity = source_digest(text) if wants_digests else None\n            parsed_identity = (\n                parsed_digest(frontmatter, body)\n                if wants_digests and frontmatter is not None\n                else None\n            )\n            yield DocumentEnvelope(\n''',
          )
          replace_once(
              'src/okf_parser/ingestion.py',
              '''                frontmatter=(frontmatter if IngestionCapability.FRONTMATTER in requested else None),\n                facts=facts,\n            )\n''',
              '''                frontmatter=(frontmatter if IngestionCapability.FRONTMATTER in requested else None),\n                facts=facts,\n                source_digest=source_identity,\n                parsed_digest=parsed_identity,\n            )\n''',
          )

          # TypeScript core domain + parser + inventory.
          replace_once(
              'typescript/src/core.ts',
              'import { rustMarkdownFactsBatch } from "./rust-core.js";\n',
              'import { parsedDigest, sourceDigest } from "./digests.js";\nimport { rustMarkdownFactsBatch } from "./rust-core.js";\n',
          )
          replace_once(
              'typescript/src/core.ts',
              '''  readonly description: string | null;\n}\n\nexport interface ConceptRecord {''',
              '''  readonly description: string | null;\n  readonly sourceDigest: string;\n  readonly parsedDigest: string;\n}\n\nexport interface ConceptRecord {''',
          )
          replace_once(
              'typescript/src/core.ts',
              '''  readonly description: string | null;\n  readonly frontmatterJson: string;\n''',
              '''  readonly description: string | null;\n  readonly sourceDigest: string;\n  readonly parsedDigest: string;\n  readonly frontmatterJson: string;\n''',
          )
          replace_once(
              'typescript/src/core.ts',
              '''export interface InventoryReport {\n''',
              '''export interface InventoryOptions extends LoadOptions {\n  readonly digests?: boolean;\n}\n\nexport interface DigestRecord {\n  readonly concept_id: string;\n  readonly path: string;\n  readonly source_digest: string;\n  readonly parsed_digest: string;\n}\n\nexport interface InventoryReport {\n''',
          )
          replace_once(
              'typescript/src/core.ts',
              '''  }[];\n}\n\nexport interface GraphReport {''',
              '''  }[];\n  readonly digests?: readonly DigestRecord[];\n}\n\nexport interface GraphReport {''',
          )
          replace_once(
              'typescript/src/core.ts',
              'return new TextDecoder("utf-8", { fatal: true }).decode(bytes);',
              'return new TextDecoder("utf-8", { fatal: true, ignoreBOM: true }).decode(bytes);',
          )
          replace_once(
              'typescript/src/core.ts',
              '''export function parseDocumentContent(content: string, documentPath = "<memory>"): ParsedDocument {\n  const split = splitFrontmatterSource(content);\n''',
              '''export function parseDocumentContent(content: string, documentPath = "<memory>"): ParsedDocument {\n  const sourceIdentity = sourceDigest(content);\n  const split = splitFrontmatterSource(content);\n''',
          )
          replace_once(
              'typescript/src/core.ts',
              '''    description: optionalText(frontmatter, "description"),\n  });\n}\n''',
              '''    description: optionalText(frontmatter, "description"),\n    sourceDigest: sourceIdentity,\n    parsedDigest: parsedDigest(frontmatter, body),\n  });\n}\n''',
          )
          replace_once(
              'typescript/src/core.ts',
              '''        description: parsed.description,\n        frontmatterJson: parsed.frontmatterJson,\n''',
              '''        description: parsed.description,\n        sourceDigest: parsed.sourceDigest,\n        parsedDigest: parsed.parsedDigest,\n        frontmatterJson: parsed.frontmatterJson,\n''',
          )
          replace_once(
              'typescript/src/core.ts',
              '''export async function inventoryBundle(\n  root: string | URL,\n  options: LoadOptions = {},\n): Promise<InventoryReport> {\n''',
              '''export async function inventoryBundle(\n  root: string | URL,\n  options: InventoryOptions = {},\n): Promise<InventoryReport> {\n''',
          )
          replace_once(
              'typescript/src/core.ts',
              '''  return Object.freeze({\n    root: bundle.root,\n    types: Object.freeze(\n      [...counts]\n        .sort(([left], [right]) => left.localeCompare(right, "en"))\n        .map(([concept_type, concept_count]) => Object.freeze({ concept_type, concept_count })),\n    ),\n  });\n}\n''',
              '''  const digests = options.digests === true\n    ? Object.freeze(\n        bundle.concepts\n          .map((concept) => Object.freeze({\n            concept_id: concept.conceptId,\n            path: concept.path,\n            source_digest: concept.sourceDigest,\n            parsed_digest: concept.parsedDigest,\n          }))\n          .sort((left, right) => left.path.localeCompare(right.path, "en")),\n      )\n    : undefined;\n  return Object.freeze({\n    root: bundle.root,\n    types: Object.freeze(\n      [...counts]\n        .sort(([left], [right]) => left.localeCompare(right, "en"))\n        .map(([concept_type, concept_count]) => Object.freeze({ concept_type, concept_count })),\n    ),\n    ...(digests === undefined ? {} : { digests }),\n  });\n}\n''',
          )

          # TypeScript public type exports.
          replace_once(
              'typescript/src/index.ts',
              '''  GraphReport,\n  InventoryReport,\n  JsonValue,\n''',
              '''  DigestRecord,\n  GraphReport,\n  InventoryOptions,\n  InventoryReport,\n  JsonValue,\n''',
          )

          # TypeScript capability-driven envelope.
          replace_once(
              'typescript/src/ingestion.ts',
              'import type { FrontmatterValue, LoadOptions, MarkdownFacts } from "./core.js";\n',
              'import type { FrontmatterValue, LoadOptions, MarkdownFacts } from "./core.js";\nimport { parsedDigest, sourceDigest } from "./digests.js";\n',
          )
          replace_once(
              'typescript/src/ingestion.ts',
              'export type IngestionCapability = "identity" | "body" | "frontmatter" | "markdown_facts";\n',
              'export type IngestionCapability = "identity" | "body" | "frontmatter" | "markdown_facts" | "digests";\n',
          )
          replace_once(
              'typescript/src/ingestion.ts',
              '''  readonly facts?: MarkdownFacts;\n  readonly error?: string;\n''',
              '''  readonly facts?: MarkdownFacts;\n  readonly sourceDigest?: string;\n  readonly parsedDigest?: string | null;\n  readonly error?: string;\n''',
          )
          replace_once(
              'typescript/src/ingestion.ts',
              '''        ...(requested.has("markdown_facts") ? { facts: markdownFacts(body) } : {}),\n      });\n''',
              '''        ...(requested.has("markdown_facts") ? { facts: markdownFacts(body) } : {}),\n        ...(requested.has("digests")\n          ? {\n              sourceDigest: sourceDigest(loaded.text),\n              parsedDigest: frontmatter === null ? null : parsedDigest(frontmatter, body),\n            }\n          : {}),\n      });\n''',
          )

          # TypeScript CLI/MCP opt-in only.
          replace_once(
              'typescript/src/cli.ts',
              '  okf-parser-ts inventory PATH [--exclude PATTERN ...]\n',
              '  okf-parser-ts inventory PATH [--exclude PATTERN ...] [--digests]\n',
          )
          replace_once(
              'typescript/src/cli.ts',
              '  --classify          Explain concept/reserved/ignored/invalid bundle membership\n',
              '  --classify          Explain concept/reserved/ignored/invalid bundle membership\n  --digests           Include deterministic source/parsed digest rows in inventory\n',
          )
          replace_once(
              'typescript/src/cli.ts',
              '      classify: { type: "boolean", default: false },\n',
              '      classify: { type: "boolean", default: false },\n      digests: { type: "boolean", default: false },\n',
          )
          replace_once(
              'typescript/src/cli.ts',
              '''  if (command === "inventory") {\n    writeJson(await inventoryBundle(root, common));\n''',
              '''  if (command === "inventory") {\n    writeJson(await inventoryBundle(root, { ...common, digests: parsed.values.digests }));\n''',
          )
          replace_once(
              'typescript/src/mcp.ts',
              '''const classifySchema = z\n  .boolean()\n  .optional()\n  .describe("Explain concept, reserved, ignored, and invalid bundle membership");\n''',
              '''const classifySchema = z\n  .boolean()\n  .optional()\n  .describe("Explain concept, reserved, ignored, and invalid bundle membership");\nconst digestsSchema = z\n  .boolean()\n  .optional()\n  .describe("Include deterministic source and parsed content digests");\n''',
          )
          replace_once(
              'typescript/src/mcp.ts',
              '''      inputSchema: z.object({ path: pathSchema, exclude: excludeSchema }),\n    },\n    ({ path, exclude }) => toolResult(() => inventoryBundle(path, loadOptions(exclude))),\n''',
              '''      inputSchema: z.object({ path: pathSchema, exclude: excludeSchema, digests: digestsSchema }),\n    },\n    ({ path, exclude, digests }) =>\n      toolResult(() => inventoryBundle(path, { ...loadOptions(exclude), digests: digests ?? false })),\n''',
          )

          # TypeScript DuckDB normalized concepts relation.
          replace_once(
              'typescript-duckdb/src/normalized.ts',
              '''      "concept_type VARCHAR NOT NULL, title VARCHAR, description VARCHAR, " +\n      "frontmatter_json VARCHAR NOT NULL, body VARCHAR NOT NULL)",\n''',
              '''      "concept_type VARCHAR NOT NULL, title VARCHAR, description VARCHAR, " +\n      "source_digest VARCHAR NOT NULL, parsed_digest VARCHAR NOT NULL, " +\n      "frontmatter_json VARCHAR NOT NULL, body VARCHAR NOT NULL)",\n''',
          )
          replace_once(
              'typescript-duckdb/src/normalized.ts',
              '''      appendNullableVarchar(appender, row.title);\n      appendNullableVarchar(appender, row.description);\n      appender.appendVarchar(row.frontmatterJson);\n''',
              '''      appendNullableVarchar(appender, row.title);\n      appendNullableVarchar(appender, row.description);\n      appender.appendVarchar(row.sourceDigest);\n      appender.appendVarchar(row.parsedDigest);\n      appender.appendVarchar(row.frontmatterJson);\n''',
          )

          # Regression tests for the new ingestion capability, without weakening
          # identity-only projection pushdown.
          with Path('tests/test_ingestion.py').open('a', encoding='utf-8') as handle:
              handle.write('''\n\ndef test_digest_capability_reuses_one_content_read_and_exposes_exact_source(tmp_path: Path) -> None:\n    source = b"\\xef\\xbb\\xbf---\\r\\ntype: Note\\r\\n---\\r\\nBody\\r\\n"\n    (tmp_path / "note.md").write_bytes(source)\n\n    [item] = ingest_documents(tmp_path, (IngestionCapability.DIGESTS,))\n\n    assert item.source_digest == "sha256:" + __import__("hashlib").sha256(source).hexdigest()\n    assert item.parsed_digest is not None\n    assert item.body is None\n    assert item.frontmatter is None\n''')

          with Path('typescript/test/ingestion.test.ts').open('a', encoding='utf-8') as handle:
              handle.write('''\n\ntest("digest capability composes with projection pushdown", async () => {\n  const root = await mkdtemp(path.join(tmpdir(), "okf-ingest-digest-"));\n  await writeFile(path.join(root, "note.md"), "\\uFEFF---\\r\\ntype: Note\\r\\n---\\r\\nBody\\r\\n");\n  const rows = [];\n  for await (const row of ingestDocuments(root, { capabilities: ["digests"] })) rows.push(row);\n  expect(rows).toHaveLength(1);\n  expect(rows[0]?.sourceDigest).toMatch(/^sha256:[0-9a-f]{64}$/u);\n  expect(rows[0]?.parsedDigest).toMatch(/^okf-parsed-v1-jcs-sha256:[0-9a-f]{64}$/u);\n  expect(rows[0]?.body).toBeUndefined();\n  expect(rows[0]?.frontmatter).toBeUndefined();\n});\n''')

          # Existing MCP schema/regression tests.
          replace_once(
              'tests/test_mcp.py',
              '    assert "classify" in tools["check"].inputSchema["properties"]\n',
              '    assert "classify" in tools["check"].inputSchema["properties"]\n    assert "digests" in tools["inventory"].inputSchema["properties"]\n',
          )
          replace_once(
              'typescript/test/mcp.test.ts',
              '''  const schema = await client.callTool({\n    name: "schema",\n''',
              '''  const inventory = await client.callTool({\n    name: "inventory",\n    arguments: { path: root, digests: true },\n  });\n  expect(inventory.structuredContent).toMatchObject({\n    digests: [\n      {\n        concept_id: "sample",\n        path: "sample.md",\n        source_digest: expect.stringMatching(/^sha256:/u),\n        parsed_digest: expect.stringMatching(/^okf-parsed-v1-jcs-sha256:/u),\n      },\n    ],\n  });\n\n  const schema = await client.callTool({\n    name: "schema",\n''',
          )

          # Documentation and release metadata.
          replace_once(
              'docs/cli.md',
              'uv run okf-parser inventory path/to/bundle [--exclude PATTERN]...\n',
              'uv run okf-parser inventory path/to/bundle [--exclude PATTERN]... [--digests]\n',
          )
          replace_once(
              'docs/cli.md',
              '''Counts concepts by producer-defined `type`.\n\nMCP tool: `inventory`.\n''',
              '''Counts concepts by producer-defined `type`. `--digests` also returns one row\nper concept with `concept_id`, `path`, `source_digest`, and `parsed_digest`.\n`source_digest` identifies the exact valid UTF-8 source. `parsed_digest` fingerprints\nthe parsed frontmatter/body value using RFC 8785/JCS ordering and string rules with\nLF-normalized body content. It is not a historical Revision id and does not claim\nMarkdown/editorial semantic equivalence.\n\nMCP tool: `inventory` with the same optional `digests` argument.\n''',
          )

          replacements = {
              'pyproject.toml': [('version = "0.33.0"', 'version = "0.34.0"')],
              'typescript/package.json': [('"version": "0.33.0"', '"version": "0.34.0"')],
              'typescript-duckdb/package.json': [
                  ('"version": "0.33.0"', '"version": "0.34.0"'),
                  ('"okf-parser": "^0.33.0"', '"okf-parser": "^0.34.0"'),
              ],
              'typescript/src/version.ts': [
                  ('PROTOCOL_VERSION = "0.33.0"', 'PROTOCOL_VERSION = "0.34.0"'),
              ],
              'README.md': [
                  ('franklinbaldo/okf-parser@v0.33.0', 'franklinbaldo/okf-parser@v0.34.0'),
              ],
          }
          for name, pairs in replacements.items():
              target = Path(name)
              text = target.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{name}: expected one {old!r}, found {count}')
                  text = text.replace(old, new)
              target.write_text(text, encoding='utf-8')

          Path('changelog/0.34.0.md').write_text('''---\ntype: Release\ntitle: okf-parser 0.34.0\ndescription: add exact-source and deterministic parsed-content digests as an opt-in ingestion capability\n---\n\n# okf-parser 0.34.0\n\n- add `source_digest = sha256:<hex>` for the exact valid UTF-8 source and `parsed_digest = okf-parsed-v1-jcs-sha256:<hex>` for the parsed frontmatter/body value;\n- canonicalize parsed values with the RFC 8785/JCS UTF-16 object-key ordering/string rules over OKF's null/string/list/object frontmatter subset and LF-normalized body;\n- preserve physical differences such as BOM/CRLF in `source_digest` while making those variants converge in `parsed_digest`;\n- expose both identities on parsed concepts, canonical Bundle `concepts`, Python and TypeScript DuckDB normalized relations, and opt-in `inventory --digests`;\n- add `digests` to the capability-driven Python/TypeScript document envelope without making identity-only ingestion open file content;\n- preserve the optional Rust core boundary: Rust still computes only Markdown links/headings, while native and Rust bundle loads expose identical digests;\n- keep historical Revision identity and Markdown/editorial semantic equivalence explicitly outside this digest contract.\n''', encoding='utf-8')
          PY

      - name: Refresh locks
        run: |
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb

      - name: Validate full digest stack
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          npm ci --prefix typescript
          npm run build --prefix typescript
          npm ci --prefix typescript-duckdb
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff check src tests
          uv run ty check src tests
          uv run vulture src tests --min-confidence 100
          uv run pytest -q
          uv run python scripts/release_contract.py verify-source --root .
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb
          cargo fmt --manifest-path rust-core/Cargo.toml --check
          cargo test --locked --manifest-path rust-core/Cargo.toml

      - name: Publish clean review head
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/prepare-content-digests-0.34.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add deterministic content digests'
          git push origin HEAD:restack/content-digests-0.34.0
