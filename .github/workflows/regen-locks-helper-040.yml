name: Regenerate 0.40 locks helper

on:
  push:
    branches: [tmp/regen-locks-040]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tmp/regen-locks-040
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Regenerate derived files
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          npm install --package-lock-only --ignore-scripts --prefix typescript
          npm install --package-lock-only --ignore-scripts --prefix typescript-duckdb
          cargo generate-lockfile --manifest-path rust-core/Cargo.toml
          sed -i 's#franklinbaldo/okf-parser@v0\.39\.0#franklinbaldo/okf-parser@v0.40.0#' README.md
      - name: Push generated bytes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock typescript/package-lock.json typescript-duckdb/package-lock.json rust-core/Cargo.lock README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate 0.40 release derivatives'
          git push origin HEAD:tmp/regen-locks-040
