name: Finalize TypeScript MCP

on:
  push:
    branches:
      - feat/typescript-mcp

permissions:
  contents: write

concurrency:
  group: finalize-typescript-mcp
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/typescript-mcp
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Refresh synchronized metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('version = "0.8.0"', 'version = "0.9.0"', 1)
          path.write_text(text, encoding="utf-8")
          PY
          uv lock
          npm install --prefix typescript --package-lock-only --ignore-scripts

      - name: Verify Python
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format --check .
          uv run ruff check .
          uv run ty check src tests
          uv run vulture src --min-confidence 90
          uv run pytest
          uv run okf-parser check .
          uv build

      - name: Verify TypeScript and MCP
        run: |
          set -euo pipefail
          npm ci --prefix typescript
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript
          node typescript/scripts/smoke-mcp-stdio.mjs

      - name: Commit verified implementation
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-typescript-mcp.yml
          rm .github/workflows/diagnose-typescript-mcp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/ci.yml \
            changelog/0.9.0.md \
            pyproject.toml \
            typescript/README.md \
            typescript/package.json \
            typescript/package-lock.json \
            typescript/scripts/smoke-mcp-stdio.mjs \
            typescript/src/index.ts \
            typescript/src/mcp-cli.ts \
            typescript/src/mcp.ts \
            typescript/src/version.ts \
            typescript/test/mcp.test.ts \
            uv.lock
          git add -u \
            .github/workflows/finalize-typescript-mcp.yml \
            .github/workflows/diagnose-typescript-mcp.yml
          git commit -m "feat(ts): add native MCP server"
          git push origin HEAD:feat/typescript-mcp
