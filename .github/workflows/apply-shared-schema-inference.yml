name: Apply shared schema inference

on:
  push:
    branches:
      - feat/shared-schema-inference
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/shared-schema-inference
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Apply migration and refresh lockfiles
        run: |
          set -euo pipefail
          python scripts/apply_shared_schema_inference.py
          npm --prefix typescript version 0.7.0 --no-git-tag-version
          uv lock

      - name: Verify Python
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups
          uv run ruff format src tests
          uv run ruff check .
          uv run ty check src tests
          uv run pytest

      - name: Verify TypeScript
        run: |
          set -euo pipefail
          npm ci --prefix typescript
          npm run check --prefix typescript
          npm test --prefix typescript
          npm run build --prefix typescript

      - name: Commit verified migration
        run: |
          set -euo pipefail
          rm .github/workflows/apply-shared-schema-inference.yml
          rm scripts/apply_shared_schema_inference.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "feat(schema): share exact lexical inference"
          git push origin HEAD:feat/shared-schema-inference
