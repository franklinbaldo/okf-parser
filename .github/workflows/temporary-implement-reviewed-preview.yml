name: Temporary implement reviewed preview

on:
  pull_request:
    branches:
      - feat/single-concept-edit-0.24.0

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'feat/apply-reviewed-preview-token'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/apply-reviewed-preview-token
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      - name: Install locked environment
        run: uv sync --frozen --all-groups
      - name: Apply reviewed-preview implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/okf_parser/apply.py')
          text = path.read_text()
          assert 'expected_preview_token' not in text

          text = text.replace(
              'import re\nfrom dataclasses import dataclass\n',
              'import hashlib\nimport hmac\nimport json\nimport re\nfrom dataclasses import dataclass\n',
              1,
          )
          assert 'import hashlib\nimport hmac\nimport json\nimport re\n' in text

          text = text.replace(
              '    WriteSupportError,\n    snapshot_bundle as _snapshot_bundle,\n',
              '    WriteSupportError,\n    render_raw as _render_raw,\n    snapshot_bundle as _snapshot_bundle,\n',
              1,
          )
          assert 'render_raw as _render_raw' in text

          marker = 'def apply_bundle(  # noqa: C901, PLR0911 - snapshot-coherent RFC 0005 orchestration\n'
          assert marker in text
          helper = '''_APPLY_PREVIEW_TOKEN_PREFIX = "okf-apply-preview-v1-sha256:"
          _APPLY_PREVIEW_CONFLICT = "apply candidate no longer matches the reviewed preview"
          
          
          def _apply_preview_token(
              snapshot: object,
              sql: str,
              exclude: Sequence[str],
              spec_template: str | None,
              candidates: dict[str, tuple[_RawDocument, str, Path]],
          ) -> str:
              """Fingerprint the exact baseline, operation and physical candidate bytes."""
              manifest = getattr(snapshot, "manifest")
              concepts = getattr(snapshot, "concepts")
              payload = {
                  "version": 1,
                  "sql": sql,
                  "exclude": list(exclude),
                  "spec_template": spec_template,
                  "manifest": [
                      [relative, signature[0], signature[1]]
                      for relative, signature in sorted(manifest.items())
                  ],
                  "concepts": [
                      [concept.relative, concept.content_hash]
                      for concept in sorted(concepts, key=lambda item: item.relative)
                  ],
                  "candidates": [
                      [relative, hashlib.sha256(_render_raw(raw, frontmatter_text)).hexdigest()]
                      for relative, (raw, frontmatter_text, _real_path) in sorted(candidates.items())
                  ],
              }
              encoded = json.dumps(
                  payload,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
              return _APPLY_PREVIEW_TOKEN_PREFIX + hashlib.sha256(encoded).hexdigest()
          
          
          def _with_preview_token(payload: dict[str, object], preview_token: str) -> dict[str, object]:
              payload["preview_token"] = preview_token
              return payload
          
          
          '''
          text = text.replace(marker, helper + marker, 1)

          signature = '    spec_template: str | None = None,\n) -> dict[str, object]:\n'
          assert signature in text
          text = text.replace(
              signature,
              '    spec_template: str | None = None,\n    expected_preview_token: str | None = None,\n) -> dict[str, object]:\n',
              1,
          )

          noop_start = text.index('    if outcome.touched_type is None or not outcome.row_diffs:\n')
          concepts_start = text.index('    concepts_by_id = {c.concept_id: c for c in concepts}\n', noop_start)
          noop = '''    if outcome.touched_type is None or not outcome.row_diffs:
              preview_token = _apply_preview_token(snapshot, sql, exclude, spec_template, {})
              if expected_preview_token is not None and not hmac.compare_digest(
                  expected_preview_token, preview_token
              ):
                  return _with_preview_token(
                      ApplyResult(succeeded=False, error=_APPLY_PREVIEW_CONFLICT).to_dict(),
                      preview_token,
                  )
              return _with_preview_token(ApplyResult().to_dict(), preview_token)
          
          '''
          text = text[:noop_start] + noop + text[concepts_start:]

          tail_start = text.index('    if not write:\n', text.index('def apply_bundle('))
          tail = '''    preview_token = _apply_preview_token(snapshot, sql, exclude, spec_template, candidates)
              if expected_preview_token is not None and not hmac.compare_digest(
                  expected_preview_token, preview_token
              ):
                  return _with_preview_token(
                      ApplyResult(
                          changed_paths=tuple(sorted(changed_paths)),
                          succeeded=False,
                          conflict_paths=tuple(sorted(changed_paths)),
                          error=_APPLY_PREVIEW_CONFLICT,
                      ).to_dict(),
                      preview_token,
                  )
          
              if not write:
                  return _with_preview_token(
                      ApplyResult(changed_paths=tuple(sorted(changed_paths))).to_dict(),
                      preview_token,
                  )
          
              touched_hashes = {rel: content_hashes[rel] for rel in candidates}
              result = _stage_validate_write(
                  root,
                  exclude,
                  candidates,
                  baseline_keys,
                  changed_paths,
                  touched_hashes,
                  snapshot.manifest,
                  conflict_error="the bundle changed since apply validated it",
                  temp_prefix="okf-apply-",
              )
              return _with_preview_token(result, preview_token)
          '''
          text = text[:tail_start] + tail
          assert 'expected_preview_token' in text
          assert 'okf-apply-preview-v1-sha256:' in text
          path.write_text(text)
          PY
      - name: Format and validate implementation
        run: |
          uv run ruff format src/okf_parser/apply.py src/okf_parser/write_support.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run ruff check --fix src/okf_parser/apply.py src/okf_parser/write_support.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run ruff format --check src/okf_parser/apply.py src/okf_parser/write_support.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run ruff check src/okf_parser/apply.py src/okf_parser/write_support.py tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
          uv run pytest -q tests/test_apply_preview_token.py tests/test_apply_preview_token_noop.py
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/temporary-*.yml .github/workflows/temporary-*.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(apply): bind writes to reviewed preview candidates'
          git push
