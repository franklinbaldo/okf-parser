name: GraphQL adapter migration

on:
  push:
    branches: [feat/graphql-read-adapter]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/graphql-read-adapter

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Apply deterministic source migration
        run: python scripts/graphql_migration.py

      - name: Regenerate Python lock
        run: uv lock

      - name: Regenerate Cargo lock
        run: cargo check --workspace

      - name: Regenerate npm locks
        shell: bash
        run: |
          npm install --package-lock-only --prefix typescript
          npm install --package-lock-only --prefix typescript-duckdb

      - name: Install all Python groups and extras
        run: uv sync --frozen --all-groups --all-extras

      - name: Format new Python sources
        run: uv run ruff format src/okf_parser/graphql_adapter.py tests/test_graphql_adapter.py

      - name: Lint GraphQL slice
        run: uv run ruff check src/okf_parser/graphql_adapter.py tests/test_graphql_adapter.py

      - name: Run GraphQL tests
        run: uv run pytest tests/test_graphql_adapter.py -q

      - name: Verify release source contract
        run: uv run python scripts/release_contract.py verify-source

      - name: Commit generated metadata and locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(graphql): materialize adapter release metadata"
          git push origin HEAD:feat/graphql-read-adapter
