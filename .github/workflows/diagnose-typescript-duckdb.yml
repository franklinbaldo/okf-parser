name: Diagnose TypeScript DuckDB

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/typescript-duckdb

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Prepare synchronized metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          text = text.replace('version = "0.9.0"', 'version = "0.10.0"', 1)
          pyproject.write_text(text, encoding="utf-8")

          version = Path("typescript/src/version.ts")
          text = version.read_text(encoding="utf-8")
          text = text.replace('"0.9.0"', '"0.10.0"', 1)
          version.write_text(text, encoding="utf-8")
          PY
          npm --prefix typescript version 0.10.0 --no-git-tag-version
          uv lock
          npm install --prefix typescript-duckdb --package-lock-only --ignore-scripts

      - name: Build parser dependency
        run: |
          npm ci --prefix typescript
          npm run build --prefix typescript

      - name: Diagnose adapter
        run: |
          set -euo pipefail
          npm ci --prefix typescript-duckdb
          npm run check --prefix typescript-duckdb
          npm test --prefix typescript-duckdb
          npm run build --prefix typescript-duckdb
