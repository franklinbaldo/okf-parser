name: Rust semantic engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check workspace formatting
        run: cargo fmt --all --manifest-path Cargo.toml --check
      - name: Reject Rust warnings and Clippy findings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test semantic engine
        run: cargo test --locked --manifest-path Cargo.toml -p okf-engine
      - name: Test CLI facade
        run: cargo test --locked --manifest-path Cargo.toml -p okf-core

  repair-native-lock:
    if: github.event_name == 'pull_request' && github.head_ref == 'perf/release-pipeline-hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/release-pipeline-hardening
          fetch-depth: 0
      - name: Install Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Bootstrap and prove the local native lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp typescript/package.json "$RUNNER_TEMP/package.json"
          npm install --package-lock-only --ignore-scripts --prefix typescript --save-optional ./native-npm-linux-x64
          cp "$RUNNER_TEMP/package.json" typescript/package.json
          npm ci --ignore-scripts --prefix typescript
          git diff --exit-code -- typescript/package.json
          grep -q 'node_modules/okf-parser-native-linux-x64' typescript/package-lock.json
          grep -q '"version": "0.42.8"' typescript/package-lock.json
      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add typescript/package-lock.json
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'lockfile already correct'
          else
            git commit -m 'fix: keep native optional dependency locked'
            git push origin HEAD:perf/release-pipeline-hardening
          fi
