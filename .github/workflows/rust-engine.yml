name: Rust semantic engine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      MATURIN_PEP517_ARGS: --no-default-features
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"
      # Link DuckDB's prebuilt library instead of compiling it; the crates'
      # `bundled` default stays for source builds.
      - name: Restore compatible Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-ubuntu-${{ runner.arch }}-${{ github.job }}-v1-no-default-features-${{ hashFiles('Cargo.toml', 'scripts/fetch_libduckdb.py', 'pyproject.toml') }}
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST DUCKDB MATURIN SDKROOT MACOSX_DEPLOYMENT_TARGET DEVELOPER_DIR
          cache-bin: false

      - name: Fetch the pinned prebuilt libduckdb
        run: uv run --script scripts/fetch_libduckdb.py --github-env --runtime
      - name: Check workspace formatting
        run: cargo fmt --all --manifest-path Cargo.toml --check
      - name: Reject Rust warnings and Clippy findings
        run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - name: Test semantic engine
        run: cargo test --locked --manifest-path Cargo.toml -p okf-engine
      - name: Test DuckDB layer
        run: cargo test --locked --no-default-features --manifest-path Cargo.toml -p okf-db
      - name: Test CLI facade
        run: cargo test --locked --no-default-features --manifest-path Cargo.toml -p okf-core
