name: Temporary refresh uv lock

on:
  push:
    branches:
      - fix/import-atomico

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-atomico
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Refresh lockfile only
        run: |
          uv lock
          git diff --exit-code -- pyproject.toml || {
            echo 'uv lock unexpectedly changed pyproject.toml' >&2
            exit 1
          }
          if git diff --quiet -- uv.lock; then
            echo 'uv.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'release: refresh uv.lock for 0.45.1'
          git push origin HEAD:fix/import-atomico
