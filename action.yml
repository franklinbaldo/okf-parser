name: Validate OKF bundle
description: Validate every Markdown file below a path as Open Knowledge Format v0.2
inputs:
  path:
    description: Bundle directory to validate
    required: false
    default: .
  require-all-caps-frontmatter:
    description: Require frontmatter in ALL-CAPS Markdown metadata files
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        version: "0.11.21"
    - name: Validate OKF
      shell: bash
      env:
        OKF_PATH: ${{ inputs.path }}
        OKF_REQUIRE_ALL_CAPS_FRONTMATTER: ${{ inputs.require-all-caps-frontmatter }}
      run: |
        args=()
        if [[ "$OKF_REQUIRE_ALL_CAPS_FRONTMATTER" == "true" ]]; then
          args+=(--require-all-caps-frontmatter)
        fi
        uv run --project "$GITHUB_ACTION_PATH" --frozen okf-tools check "$OKF_PATH" "${args[@]}"
