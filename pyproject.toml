[project]
name = "okf-parser"
version = "0.14.2"
description = "Relational inspection and validation for Open Knowledge Format bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=4.22,<5",
  "duckdb>=1.4,<2",
  "fastmcp>=3.4,<4",
  "ibis-framework[duckdb]>=12,<13",
  "markdown-it-py>=4,<5",
  # okf_parser.markdown_style overrides mdformat's ordered-list renderer, which
  # needs symbols mdformat does not export. Keep this range as narrow as that
  # dependency is real; the adapter also fails fast if the symbols are missing.
  "mdformat>=1,<1.1",
  "mdformat-frontmatter>=2,<3",
  "mdformat-gfm>=1,<2",
  "networkx>=3.4,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
]

[project.scripts]
okf-parser = "okf_parser.cli:main"
okf-parser-mcp = "okf_parser.cli:run_mcp_stdio"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.15,<0.16",
  "ty>=0.0.1a20,<0.1",
  "vulture>=2.14,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Repository automation is not part of the published source distribution: the
# release workflows are a privileged CI boundary, not consumer-installable code.
exclude = [
  ".github",
  ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/okf_parser"]

[tool.coverage.report]
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "ISC001",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates model annotations at runtime, so their imports must stay
# outside a type-checking block.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"src/okf_parser/cli.py" = ["T201"]
"tests/*" = ["D103", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"
