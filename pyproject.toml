[project]
name = "okf-parser"
dynamic = ["version"]
description = "Relational inspection and validation for Open Knowledge Format bundles"
# Derived from README.md by scripts/pypi_readme.py. README.md is an OKF concept
# and must open with frontmatter, which PyPI would otherwise render as a heading
# above the real title.
readme = "README.pypi.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Franklin Baldo", email = "franklinbaldo@gmail.com" }]
keywords = [
  "okf",
  "open-knowledge-format",
  "knowledge-graph",
  "markdown",
  "duckdb",
  "validation",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "pydantic>=2.12,<3",
]

[project.urls]
Homepage = "https://github.com/franklinbaldo/okf-parser"
Repository = "https://github.com/franklinbaldo/okf-parser"
Issues = "https://github.com/franklinbaldo/okf-parser/issues"
Changelog = "https://github.com/franklinbaldo/okf-parser/releases"
Documentation = "https://github.com/franklinbaldo/okf-parser/blob/main/docs/architecture.md"

[project.optional-dependencies]
graphql = ["graphql-core>=3.2,<4"]
networkx = ["networkx>=3.4,<4"]

[dependency-groups]
dev = [
  # Tests read the databases `okf-parser duckdb` writes.
  "duckdb>=1.4,<2",
  "graphql-core>=3.2,<4",
  "jsonschema>=4.26,<5",
  # An independent CommonMark parser the formatter tests check output against.
  "markdown-it-py>=4,<5",
  "networkx>=3.4,<4",
  "pytest>=8,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.15,<0.16",
  "ty>=0.0.1a20,<0.1",
  "vulture>=2.14,<3",
]

[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/okf_parser"]

[tool.coverage.report]
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["__okf__"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"src/okf_parser/apply.py" = ["BLE001", "PLR0913", "S608"]
"src/okf_parser/bundle_import.py" = ["PLR0913", "S608"]
"src/okf_parser/declared_schema.py" = ["S608"]
"src/okf_parser/graphql_adapter.py" = ["PLR0913"]
"src/okf_parser/typed_tables.py" = ["S608"]
"src/okf_parser/schema_export.py" = ["PLR0913"]
"src/okf_parser/service.py" = ["PLR0913"]
"tests/*" = ["D103", "PLR2004", "S101"]
"scripts/cargo_timings.py" = ["D103", "EXE001", "S603", "S607", "T201"]
"scripts/check_feature_graph.py" = ["D103", "EXE001", "I001", "S603", "T201"]
"scripts/benchmark_native_profiles.py" = ["D103", "EXE001", "S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.ty.overrides]]
include = [
  "tests/fixtures/pydantic_generated.py",
  "tests/fixtures/pydantic_adversarial_generated.py",
]

[tool.ty.overrides.rules]
invalid-assignment = "ignore"

# Cargo changes must invalidate cached dynamic metadata and native builds.
[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-core/Cargo.toml" },
  { file = "okf-engine/Cargo.toml" },
  { file = "okf-db/Cargo.toml" },
  { file = "rust-core/build.rs" },
  { file = "rust-core/src/**/*.rs" },
  { file = "okf-engine/src/**/*.rs" },
  { file = "okf-db/src/**/*.rs" },
  { file = "okf-engine/packs/**/*" },
  { file = "README.pypi.md" },
]

[tool.maturin]
manifest-path = "rust-core/Cargo.toml"
bindings = "bin"
module-name = "okf_parser"
python-source = "src"
python-packages = ["okf_parser"]
strip = true
locked = true
sdist-generator = "git"
# Release wheels link DuckDB's prebuilt library and ship it next to the
# executable themselves (scripts/ship_libduckdb.py); maturin's repair would
# instead move the binary behind a Python shim. Warn keeps the audit visible.
auditwheel = "warn"
exclude = [{ path = ".github/**", format = "sdist" }]
