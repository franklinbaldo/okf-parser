[project]
name = "okf-parser"
version = "0.32.0"
description = "Relational inspection and validation for Open Knowledge Format bundles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cyclopts>=4.22,<5",
  "duckdb>=1.4,<2",
  "fastmcp>=3.4,<4",
  "ibis-framework[duckdb]>=12,<13",
  "markdown-it-py>=4,<5",
  # okf_parser.markdown_style overrides mdformat's ordered-list renderer, which
  # needs symbols mdformat does not export. Keep this range as narrow as that
  # dependency is real; the adapter also fails fast if the symbols are missing.
  "mdformat>=1,<1.1",
  "mdformat-frontmatter>=2,<3",
  "mdformat-gfm>=1,<2",
  "networkx>=3.4,<4",
  "pyarrow>=18,<26",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "ruamel.yaml>=0.18,<0.20",
]

[project.scripts]
okf-parser = "okf_parser.cli:main"
okf-parser-mcp = "okf_parser.cli:run_mcp_stdio"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.15,<0.16",
  "ty>=0.0.1a20,<0.1",
  "vulture>=2.14,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Repository automation is not part of the published source distribution: the
# release workflows are a privileged CI boundary, not consumer-installable code.
exclude = [
  ".github",
  ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/okf_parser"]

[tool.coverage.report]
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "ISC001",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates model annotations at runtime, so their imports must stay
# outside a type-checking block.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# PLR0913: every listed function's arguments are independent public CLI/API
# flags or distinct compile/write-path inputs, not a sign the function
# should take fewer of them - see each module's docstring.
# S608: the only dynamic SQL in these files quotes identifiers and
# '-doubles string literals rather than interpolating raw input (apply.py's
# `_build_sugar_sql`, bundle_import.py's source-path replacement scan).
# A002: cli.py's `type` parameters name the domain concept `type`, matching
# every other surface (frontmatter, service functions) for the same flag.
# BLE001: apply.py's frontmatter round-trip probe treats any load/dump
# failure alike, by construction - see `_round_trips_losslessly`.
"src/okf_parser/apply.py" = ["BLE001", "PLR0913", "S608"]
"src/okf_parser/bundle_import.py" = ["PLR0913", "S608"]
"src/okf_parser/declared_schema.py" = ["S608"]
"src/okf_parser/duckdb.py" = ["PLR0913"]
"src/okf_parser/typed_tables.py" = ["S608"]
"src/okf_parser/cli.py" = ["A002", "PLR0913", "T201"]
"src/okf_parser/schema_export.py" = ["PLR0913"]
"src/okf_parser/service.py" = ["PLR0913"]
"tests/*" = ["D103", "PLR2004", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[[tool.ty.overrides]]
include = [
  "tests/fixtures/pydantic_generated.py",
  "tests/fixtures/pydantic_adversarial_generated.py",
]

[tool.ty.overrides.rules]
# Pydantic intentionally uses a non-None annotation with a None Field default
# to represent "may be absent, but explicit null is invalid". Runtime tests pin
# that behavior; ty currently treats Field(default=None) as a plain assignment.
invalid-assignment = "ignore"
